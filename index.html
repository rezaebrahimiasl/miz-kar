<style>
/* Layout: one-column mobile app — sticky header, scrolling view, bottom tab bar, floating add button, bottom sheets */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e8ece7; --ink:#1c2420; --muted:#5f6b64; --line:#d9dfd9;
  --accent:#b8740a; --accent-ink:#ffffff; --accent-soft:#f6e7cc;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#9a5b00; --warn-soft:#fbead0; --bad:#b0281f; --bad-soft:#f7dcd9;
  --a-sales:#b26f06; --a-export:#17708f; --a-marketers:#8447b8; --a-finance:#2c7a4b; --a-therapy:#bd3458; --a-research:#3a57c0; --a-career:#56616b; --a-personal:#727314; --a-affairs:#8a6447;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --sunk:#232a26; --ink:#e6ebe7; --muted:#9aa69f; --line:#2c3430;
  --accent:#e3a03a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --ok:#6cc58f; --ok-soft:#1d3326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f08a80; --bad-soft:#3c1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --a-sales:#e8a744; --a-export:#5bb8d8; --a-marketers:#bc95ea; --a-finance:#6cc58f; --a-therapy:#f28ca6; --a-research:#93a9f4; --a-career:#a9b4be; --a-personal:#cdcb6c; --a-affairs:#d0ad8c;
}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --sunk:#232a26; --ink:#e6ebe7; --muted:#9aa69f; --line:#2c3430;
  --accent:#e3a03a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --ok:#6cc58f; --ok-soft:#1d3326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f08a80; --bad-soft:#3c1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --a-sales:#e8a744; --a-export:#5bb8d8; --a-marketers:#bc95ea; --a-finance:#6cc58f; --a-therapy:#f28ca6; --a-research:#93a9f4; --a-career:#a9b4be; --a-personal:#cdcb6c; --a-affairs:#d0ad8c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top .t{flex:1;min-width:0}
header.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
header.top .d{font-size:12.5px;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;left:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
section.blk{margin-top:18px}
.blk-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.blk-h h2{margin:0;font-size:15px;font-weight:800}
.blk-h .n{font-size:12px;color:var(--muted)}
.blk-h .sp{flex:1}
.link{border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;padding:4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:right;background:none;border-inline:0;border-bottom:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.row .end{flex:none;text-align:left;font-size:13px;font-variant-numeric:tabular-nums}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on svg{display:block}
.chk svg{display:none;width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ab{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.ab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h3 .ab{display:inline-grid;vertical-align:middle;margin-left:6px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.stage{display:flex;gap:3px;margin-top:6px}
.stage i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.stage i.on{background:var(--accent)}
.amt-pos{color:var(--ok)} .amt-neg{color:var(--bad)}
.void .ttl,.void .end{text-decoration:line-through;color:var(--muted)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 10px;font-size:17px;font-weight:800}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-height:42px}
.fld textarea{min-height:84px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px}
.qa svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.capture{display:flex;gap:8px;margin-top:14px}
.capture input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font-size:14px}
.det dt{color:var(--muted)} .det dd{margin:0;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;font-size:14px;line-height:1.85;background:var(--bg);border-radius:12px;padding:12px}
#toast{pointer-events:none;position:fixed;bottom:calc(140px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-size:13.5px;z-index:30}
.search-in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script>
/* ---------- Jalali calendar (jalaali-js algorithm) ---------- */
const J=(()=>{
  const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
  const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  function jalCal(jy){let bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
    for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
    n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
    leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
    if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
  function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
  function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}
  function toJ(gy,gm,gd){const jdn=g2d(gy,gm,gd);let jy=d2g(jdn).gy-621;const r=jalCal(jy);const f=g2d(r.gy,3,r.march);let k=jdn-f,jm,jd;
    if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd}}else k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
    jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
  function toG(jy,jm,jd){const r=jalCal(jy);const jdn=g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;return d2g(jdn)}
  return{toJ,toG};
})();
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoOf(new Date());
const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1,d+n);return isoOf(x)};
const diffDays=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(a)-p(b))/864e5)};
function jOf(iso){const [y,m,d]=iso.split('-').map(Number);return J.toJ(y,m,d)}
function jShort(iso){if(!iso)return'';const j=jOf(iso);return fa(`${j.jy}/${pad(j.jm)}/${pad(j.jd)}`)}
function jNice(iso){if(!iso)return'';const t=today();const dd=diffDays(iso,t);
  if(dd===0)return'امروز';if(dd===1)return'فردا';if(dd===-1)return'دیروز';
  const j=jOf(iso);const s=`${fa(j.jd)} ${MONTHS[j.jm-1]}`;return j.jy===jOf(t).jy?s:s+' '+fa(j.jy)}
function jLong(iso){const [y,m,d]=iso.split('-').map(Number);const w=new Date(y,m-1,d).getDay();const j=J.toJ(y,m,d);return `${WD[w]} ${fa(j.jd)} ${MONTHS[j.jm-1]} ${fa(j.jy)}`}
function parseJ(s){s=en(String(s||'').trim()).replace(/[-.\s]/g,'/');if(!s)return'';const p=s.split('/').map(Number);if(p.length!==3||p.some(isNaN))return null;
  let [a,b,c]=p;if(a<100)a+=1400;if(b<1||b>12||c<1||c>31)return null;const g=J.toG(a,b,c);return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`}
const num=v=>{const x=Number(en(String(v??'')).replace(/[,٬،\s]/g,''));return isNaN(x)?null:x};
const money=(v,c)=>fa(new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Math.abs(v)).replace(/,/g,'٬'))+' '+(c||'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Domain model ---------- */
const AREAS={sales:'فروش عسل و خدمات',export:'صادرات و بازرگانی',marketers:'بازاریاب‌ها و سایت‌ها',finance:'مالی',therapy:'درمان و مراجعین',research:'پژوهش و دکتری',career:'مسیر شغلی',personal:'شخصی و معنوی',affairs:'امور جاری'};
const PIPES={
  sale:{n:'فروش داخلی',area:'sales',st:['تماس اول','نیازسنجی','پیشنهاد و قیمت','سفارش','پرداخت شد']},
  export:{n:'صادرات',area:'export',st:['شناسایی','احراز صلاحیت','نمونه','قیمت و شرایط','قرارداد','ارسال','دریافت وجه']},
  hive:{n:'خدمات کندو',area:'sales',st:['معرفی','بازدید','پیشنهاد','قرارداد سالانه','تمدید']},
  client:{n:'مراجع درمانی',area:'therapy',st:['تماس','فرم مزاج','جلسه اول','درمان فعال','پیگیری']},
  partner:{n:'همکار و بازاریاب',area:'marketers',st:['آشنایی','گفت‌وگو','دوره آزمایشی','همکاری فعال']},
  job:{n:'شغل',area:'career',st:['شناسایی','ارسال درخواست','مصاحبه','پیشنهاد','نتیجه']},
  research:{n:'پژوهش',area:'research',st:['آشنایی','ایده','خلاصه و مفهوم','پروپوزال','تأمین بودجه']}
};
const ROLES=['مشتری','بازاریاب','تأمین‌کننده','خریدار/واردکننده','مراجع','پژوهشی','کارفرما/هتلداری','خانواده','همکار','سایر'];
const CUR=['تومان','دلار','یورو','درهم','ریال عمان'];
const LK={receivable:{n:'طلب (به من بدهکار است)',s:1},payable:{n:'بدهی (من بدهکارم)',s:-1},received:{n:'دریافت پول (فروش نقدی یا تسویه)',s:-1},paid:{n:'پرداخت پول (خرید/هزینه یا تسویه)',s:1}};
const LSHORT={receivable:'طلب',payable:'بدهی',received:'دریافت',paid:'پرداخت'};
const INSTR=['نقد/کارت','چک','حواله','کالا/خدمت','سایر'];
const PRI={1:'فوری',2:'مهم',3:'عادی'};
const CATS_IN=['عسل','بره‌موم','گرده و ژل رویال','زهر زنبور','کندو و کلنی','خدمات مدیریت کندو','آموزش','درمان و مشاوره','پورسانت دریافتی','سایر درآمد'];
const CATS_OUT=['خرید و تأمین کالا','دارو و تغذیه زنبور','حمل و کوچ','بسته‌بندی','دستمزد','پورسانت پرداختی','اجاره','هزینهٔ شخصی','سایر هزینه'];
const CATS_ALL=[...CATS_IN,...CATS_OUT,'قرض و جابه‌جایی (نه درآمد نه هزینه)'];
const APT={move:{n:'کوچ',f:['from','to','hives']},harvest:{n:'برداشت عسل',f:['loc','hives','qty']},visit:{n:'بازدید',f:['loc','hives']},treat:{n:'درمان و دارو',f:['loc','hives','what']},feed:{n:'تغذیه',f:['loc','hives','what','qty']},split:{n:'تقسیم و ملکه',f:['loc','hives']},trade:{n:'خرید یا فروش کلنی',f:['loc','hives']},loss:{n:'تلفات یا مشکل',f:['loc','hives','what']},other:{n:'سایر',f:['loc','hives']}};

/* ---------- State & data ---------- */
const S={people:[],deals:[],tasks:[],ledger:[],inbox:[],notes:[],apiary:[],lots:[],moves:[],quotes:[],contacts:[],habits:[],checkins:[]};
const COLS=Object.keys(S);
let db=null, mode=null, idb=null, loaded=new Set(), tab='today', ui={taskF:'open',dealF:'open',dealP:'all',peopleQ:'',peopleR:'all',moneyF:'all'};
try{const t=localStorage.getItem('miz.tab');if(t)tab=t}catch(e){}
const byId=(c,id)=>S[c].find(x=>x.id===id);
const pname=id=>{const p=id&&byId('people',id);return p?p.name:''};
const nowTs=()=>new Date().toISOString();

/* Storage: inside Claude → private shared db; standalone on phone → IndexedDB (local-first) + file backup */
async function initDb(){
  const cl=window.claude;
  if(cl&&cl.use){db=await cl.use('db')}
  if(db){mode='cloud';
    COLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));if(c==='contacts')rebuildContacts();loaded.add(c);render()},e=>showConn('خطا در خواندن داده: '+e.code))});
    return}
  mode='local';
  try{idb=await new Promise((res,rej)=>{const r=indexedDB.open('miz-kar',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'k'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const all=await new Promise((res,rej)=>{const q=idb.transaction('docs').objectStore('docs').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
    all.forEach(x=>{if(S[x.col])S[x.col].push(x.doc)});rebuildContacts();COLS.forEach(c=>loaded.add(c));
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  }catch(e){showConn('حافظهٔ گوشی در دسترس نیست؛ داده‌ها ذخیره نمی‌شوند.')}
  render();
}
function showConn(m){const b=document.getElementById('conn');b.textContent=m;b.hidden=false}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function idbPut(col,doc){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');t.objectStore('docs').put({k:col+'/'+doc.id,col,doc});t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function save(col,id,data){
  try{
    if(mode==='cloud'){
      if(id){await db.collection(col).doc(id).update({...data,updated:nowTs()})}
      else{await db.collection(col).doc().set({...data,created:nowTs(),updated:nowTs()})}
      return true}
    if(mode==='local'&&idb){
      let doc;const i=id?S[col].findIndex(x=>x.id===id):-1;
      if(i>=0){doc={...S[col][i],...data,updated:nowTs()};S[col][i]=doc}
      else{doc={id:id||newId(),...data,created:nowTs(),updated:nowTs()};S[col].push(doc)}
      await idbPut(col,doc);render();return true}
    toast('ثبت ممکن نیست؛ محل ذخیره در دسترس نیست');return false
  }catch(e){toast(e.code==='quota_exceeded'?'ظرفیت پایگاه داده پر است':'ثبت نشد: '+(e.code||e.message||'خطا'));return false}
}
async function putRaw(col,doc){
  if(mode==='cloud'){const {id,...rest}=doc;await db.collection(col).doc(id).set(rest)}
  else{const i=S[col].findIndex(x=>x.id===doc.id);if(i>=0)S[col][i]=doc;else S[col].push(doc);await idbPut(col,doc)}
}
function backupData(){return {app:'miz-kar',version:'0.5',exported:nowTs(),data:Object.fromEntries(COLS.map(c=>[c,S[c]]))}}
function lastBackup(){try{return localStorage.getItem('miz.lastBackup')||''}catch(_){return''}}
async function doBackup(){
  const name='miz-kar-backup-'+en(jShort(today())).replace(/\//g,'-')+'.json';
  const txt=JSON.stringify(backupData());
  const markDone=()=>{try{localStorage.setItem('miz.lastBackup',today())}catch(_){}render()};
  try{const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'پشتیبان میز کار'});markDone();toast('ارسال شد');return}}catch(e){if(e&&e.name==='AbortError')return}
  const dl=window.claude&&await window.claude.use('downloads');
  if(dl){try{await dl.save({filename:name,data:txt});markDone();toast('فایل آماده شد؛ آن را در درایو بارگذاری کن')}catch(_){toast('دریافت انجام نشد')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();markDone();toast('فایل پشتیبان ذخیره شد')}catch(_){toast('ذخیرهٔ فایل ممکن نشد')}
}
async function doRestore(file){
  let j;try{j=JSON.parse(await file.text())}catch(_){return toast('فایل پشتیبان معتبر نیست')}
  const data=j&&j.data;if(!data||j.app!=='miz-kar')return toast('این فایل پشتیبان میز کار نیست');
  let n=0;
  try{for(const c of COLS){for(const d of (data[c]||[])){if(!d||!d.id)continue;const cur=S[c].find(x=>x.id===d.id);if(!cur||(d.updated||'')>(cur.updated||'')){await putRaw(c,d);n++}}}}
  catch(e){toast('بازیابی نیمه‌کاره ماند: '+(e.code||e.message));render();return}
  rebuildContacts();render();closeSheet();toast(fa(n)+' ردیف بازیابی یا به‌روز شد'+(CT.length?' · '+fa(CT.length)+' مخاطب':''));
}

/* ---------- Derived ---------- */
const openTasks=()=>S.tasks.filter(t=>t.status!=='done'&&t.status!=='archived');
const openDeals=()=>S.deals.filter(d=>(d.status||'open')==='open');
const affects=l=>!l.void&&(l.kind==='receivable'||l.kind==='payable'||!!l.refId||!!l.settles);
function balances(personId){const m={};S.ledger.filter(l=>affects(l)&&(!personId||l.personId===personId)).forEach(l=>{const c=l.currency||'تومان';m[c]=(m[c]||0)+LK[l.kind].s*(Number(l.amount)||0)});return m}
function personBal(){const r={};S.ledger.filter(l=>affects(l)&&l.personId).forEach(l=>{const k=l.personId;const c=l.currency||'تومان';r[k]=r[k]||{};r[k][c]=(r[k][c]||0)+LK[l.kind].s*(Number(l.amount)||0)});return r}
function dueLedger(days){const t=today(),lim=addDays(t,days);return S.ledger.filter(l=>!l.void&&!l.settled&&(l.kind==='receivable'||l.kind==='payable')&&l.due&&l.due<=lim).sort((a,b)=>a.due.localeCompare(b.due))}

/* ---------- Render helpers ---------- */
const ICON={check:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'};
function duePill(iso){if(!iso)return'';const d=diffDays(iso,today());const cls=d<0?'bad':d===0?'warn':'';return `<span class="pill ${cls}">${d<0?'عقب‌افتاده · ':''}${jNice(iso)}</span>`}
function taskRow(t){const done=t.status==='done';return `<div class="row ${done?'done':''}">
  <button class="chk ${done?'on':''}" data-act="toggleTask" data-id="${t.id}" aria-label="${done?'برگرداندن':'انجام شد'}">${ICON.check}</button>
  ${t.area?badge(t.area):''}<button class="main" style="border:0;background:none;text-align:right;padding:0" data-act="editTask" data-id="${t.id}">
    <div class="ttl">${esc(t.title)}</div>
    <div class="sub">${t.due&&!done?duePill(t.due):''}${t.priority==1?'<span class="pill bad">فوری</span>':t.priority==2?'<span class="pill acc">مهم</span>':''}${t.area?`<span>${esc(AREAS[t.area]||'')}</span>`:''}${t.personId?`<span>· ${esc(pname(t.personId))}</span>`:''}${t.loc&&(t.loc.place||t.loc.lat)?`<span>· ${esc(t.loc.place||'موقعیت ثبت‌شده')}</span>`:''}</div>
  </button></div>`}
function stageBar(d){const p=PIPES[d.pipe];if(!p)return'';const i=p.st.indexOf(d.stage);return `<div class="stage">${p.st.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`}
function dealRow(d){const p=PIPES[d.pipe]||{n:''};const st=d.status||'open';const miss=st==='open'&&(!d.nextStep||!d.nextDate);
  return `<button class="row" data-act="viewDeal" data-id="${d.id}">${badge((PIPES[d.pipe]||{}).area||d.area,PIPE_ICON[d.pipe])}<div class="main">
   <div class="ttl">${esc(d.title)}</div>
   <div class="sub"><span class="pill">${esc(p.n)}</span><span>${esc(d.stage||'')}</span>${d.personId?`<span>· ${esc(pname(d.personId))}</span>`:''}${st!=='open'?`<span class="pill ${st==='won'?'ok':st==='lost'?'bad':''}">${{won:'موفق',lost:'ناموفق',paused:'متوقف'}[st]||st}</span>`:''}</div>
   ${st==='open'?(miss?'<div class="sub"><span class="pill bad">قدم بعدی ندارد</span></div>':`<div class="sub"><span>بعدی: ${esc(d.nextStep)}</span>${duePill(d.nextDate)}</div>`):''}
   ${stageBar(d)}</div>
   ${d.value?`<div class="end">${money(d.value,d.currency)}</div>`:''}</button>`}
function ledgerRow(l){const s=(l.kind==='receivable'||l.kind==='received')?1:-1;return `<button class="row ${l.void?'void':''}" data-act="viewLedger" data-id="${l.id}">${badge('finance')}<div class="main">
  <div class="ttl">${esc(LSHORT[l.kind])} · ${esc(pname(l.personId)||'بدون طرف حساب')}</div>
  <div class="sub">${l.category?`<span class="pill acc">${esc(l.category)}</span>`:''}<span>${esc(l.about||'')}</span><span>${jShort(l.date)}</span>${l.instrument&&l.instrument!=='نقد/کارت'?`<span class="pill">${esc(l.instrument)}</span>`:''}${(l.kind==='receivable'||l.kind==='payable')&&l.due&&!l.settled&&!l.void?duePill(l.due):''}${l.settled?'<span class="pill ok">تسویه شد</span>':''}${l.void?'<span class="pill">باطل</span>':''}</div></div>
  <div class="end ${s>0?'amt-pos':'amt-neg'}">${s>0?'+':'−'}${money(l.amount,l.currency)}</div></button>`}
const block=(title,n,body,more)=>`<section class="blk"><div class="blk-h"><h2>${title}</h2>${n!=null?`<span class="n">${fa(n)}</span>`:''}<span class="sp"></span>${more||''}</div>${body}</section>`;
const listOr=(arr,fn,emptyMsg)=>`<div class="list">${arr.length?arr.map(fn).join(''):`<div class="empty">${emptyMsg}</div>`}</div>`;

/* ---------- Views ---------- */
function vToday(){
  const t=today();
  const due=openTasks().filter(x=>x.due&&x.due<=t).sort((a,b)=>(a.priority||3)-(b.priority||3)||a.due.localeCompare(b.due));
  const upcoming=openTasks().filter(x=>!x.due||x.due>t);
  const top=due.length?due.slice(0,3):upcoming.sort((a,b)=>(a.priority||3)-(b.priority||3)||(a.due||'9').localeCompare(b.due||'9')).slice(0,3);
  const follow=openDeals().filter(d=>d.nextDate&&d.nextDate<=t).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  const noNext=openDeals().filter(d=>!d.nextStep||!d.nextDate);
  const stale=openDeals().filter(d=>d.updated&&diffDays(t,d.updated.slice(0,10))>14&&!(d.nextDate&&d.nextDate<=t));
  const money7=dueLedger(7);
  const inbox=S.inbox.filter(i=>!i.processed);
  const bal=balances();
  const recv=Object.entries(personBal()).reduce((a,[,m])=>{Object.entries(m).forEach(([c,v])=>{if(v>0)a[c]=(a[c]||0)+v});return a},{});
  const isLoading=mode===null||loaded.size<COLS.length;
  let h='';
  h+=`<form class="capture" data-form="capture"><input id="capIn" placeholder="یادداشت سریع: هر چیزی در ذهنت است بنویس…" aria-label="یادداشت سریع"><button class="btn pri">بنویس</button></form>`;
  if(isLoading)h+=`<div class="empty">در حال بارگذاری…</div>`;
  if(mode==='local'){const lb=lastBackup();if(!lb||diffDays(today(),lb)>7)h+=`<div class="banner" style="display:flex;gap:10px;align-items:center"><span style="flex:1">${lb?'بیش از یک هفته از آخرین پشتیبان گذشته.':'هنوز از داده‌های گوشی پشتیبان نگرفته‌ای.'}</span><button class="btn pri" data-act="backup">پشتیبان بگیر</button></div>`}
  h+=`<div class="kpis">
    <div class="kpi"><div class="l">کارهای باز</div><div class="v">${fa(openTasks().length)}</div></div>
    <div class="kpi"><div class="l">فرصت‌های باز</div><div class="v">${fa(openDeals().length)}</div></div>
    <div class="kpi"><div class="l">طلب من</div><div class="v">${Object.keys(recv).length?Object.entries(recv).map(([c,v])=>money(v,c)).join('<br>'):'۰'}</div></div>
  </div>`;
  h+=block('سه کار مهم امروز',null,listOr(top,taskRow,'کاری برای امروز نیست. از دکمهٔ + یک کار اضافه کن.'),`<button class="link" data-act="tab" data-v="tasks">همهٔ کارها${due.length>3?' ('+fa(due.length-3)+' کار دیگر امروز)':''}</button>`);
  h+=habitsStrip();
  const fs=flowSummary();
  if(fs.short.length)h+=block('هشدار انبار',fs.short.length,listOr(fs.short,l=>`<button class="row" data-act="viewLot" data-id="${l.id}">${badge('therapy','warn')}<div class="main"><div class="ttl">کسری در ${esc(lotName(l))} ${fa(l.code||'')}</div><div class="sub"><span>${fmtQ(-lotStat(l).rem,l.unit)} بیش از موجودی ثبت شده؛ ورود جاافتاده یا مقدار را اصلاح کن</span></div></div></button>`,''));
  if(fs.rows.length)h+=block('زنجیره‌های در جریان',null,`<div class="list">${fs.rows.map(([k,n,c,a,ic])=>`<button class="row" data-act="${k==='recv'||k==='pay'?'tab':'chain'}" data-v="${k==='recv'||k==='pay'?'money':k}">${badge(a,ic)}<div class="main"><div class="ttl">${n}</div></div><div class="end"><b>${fa(c)}</b></div></button>`).join('')}</div>`);
  h+=block('پیگیری‌های سررسیده',follow.length,listOr(follow,dealRow,'پیگیری سررسیده‌ای نداری.'));
  if(money7.length)h+=block('سررسید مالی ۷ روز آینده',money7.length,listOr(money7,ledgerRow,''));
  if(noNext.length)h+=block('فرصت بدون قدم بعدی',noNext.length,listOr(noNext,dealRow,''));
  if(stale.length)h+=block('بیش از ۱۴ روز بی‌حرکت',stale.length,listOr(stale,dealRow,''));
  h+=block('یادداشت‌های سریع',inbox.length,listOr(inbox,i=>`<button class="row" data-act="viewInbox" data-id="${i.id}">${badge('affairs','note')}<div class="main"><div class="ttl">${esc(i.text)}</div><div class="sub"><span>${i.created?jNice(i.created.slice(0,10)):''}</span><span>برای ویرایش، تبدیل به کار یا خط زدن بزن</span></div></div></button>`,'هر فکری را بالای صفحه بنویس تا یادت نرود؛ بعداً با یک لمس ویرایشش کن یا به کار تبدیلش کن.'));
  return h;
}
function chips(name,opts,cur){return `<div class="chips" role="group">${opts.map(([v,l])=>`<button class="chip" data-act="filter" data-k="${name}" data-v="${v}" aria-pressed="${cur===v}">${esc(l)}</button>`).join('')}</div>`}
function vTasks(){
  const t=today();let arr=S.tasks.filter(x=>x.status!=='archived');
  const f=ui.taskF;
  if(f==='open')arr=arr.filter(x=>x.status!=='done');else if(f==='done')arr=arr.filter(x=>x.status==='done');else if(AREAS[f])arr=arr.filter(x=>x.area===f&&x.status!=='done');
  arr.sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9999').localeCompare(b.due||'9999')||(a.priority||3)-(b.priority||3));
  const groups=f==='done'?[['انجام‌شده',arr]]:[['عقب‌افتاده',arr.filter(x=>x.due&&x.due<t)],['امروز',arr.filter(x=>x.due===t)],['این هفته',arr.filter(x=>x.due>t&&x.due<=addDays(t,7))],['بعداً',arr.filter(x=>x.due>addDays(t,7))],['بدون تاریخ',arr.filter(x=>!x.due)]];
  let h=chips('taskF',[['open','همه باز'],...Object.entries(AREAS),['done','انجام‌شده']],f);
  const g=groups.filter(([,a])=>a.length);
  h+=g.length?g.map(([n,a])=>block(n,a.length,listOr(a,taskRow,''))).join(''):block('کارها',0,listOr([],taskRow,'کاری در این فیلتر نیست.'));
  return h;
}
function vDeals(){
  let arr=S.deals.slice();const f=ui.dealF,p=ui.dealP;
  if(p!=='all')arr=arr.filter(d=>d.pipe===p);
  arr=arr.filter(d=>f==='open'?(d.status||'open')==='open':f==='closed'?(d.status||'open')!=='open':true);
  arr.sort((a,b)=>(a.nextDate||'9999').localeCompare(b.nextDate||'9999'));
  let h=chips('dealP',[['all','همه قیف‌ها'],...Object.entries(PIPES).map(([k,v])=>[k,v.n])],p);
  h+=`<div style="height:6px"></div>`+chips('dealF',[['open','باز'],['closed','بسته‌شده'],['all','همه']],f);
  if(p!=='all'&&f==='open'){const P=PIPES[p];h+=P.st.map(s=>{const a=arr.filter(d=>d.stage===s);return a.length?block(s,a.length,listOr(a,dealRow,'')):''}).join('')||block(P.n,0,listOr([],dealRow,'فرصت بازی در این قیف نیست.'))}
  else h+=block('فرصت‌ها',arr.length,listOr(arr,dealRow,'فرصتی نیست. با دکمهٔ + اضافه کن.'));
  return h;
}
function vPeople(){
  let arr=S.people.filter(x=>x.status!=='archived');const q=ui.peopleQ.trim(),r=ui.peopleR;
  if(r!=='all')arr=arr.filter(x=>(x.roles||[]).includes(r));
  if(q)arr=arr.filter(x=>[x.name,x.org,x.note,x.phone,(x.roles||[]).join(' ')].join(' ').toLowerCase().includes(q.toLowerCase()));
  arr.sort((a,b)=>a.name.localeCompare(b.name,'fa'));
  const pb=personBal();
  let h=`<input class="search-in" id="peopleQ" placeholder="جستجو در افراد…" value="${esc(q)}" style="margin-top:14px">`;
  h+=chips('peopleR',[['all','همه'],...ROLES.map(x=>[x,x])],r);
  h+=block('افراد',arr.length,listOr(arr,x=>{const b=pb[x.id];const bs=b?Object.entries(b).filter(([,v])=>Math.abs(v)>0.0001):[];
    const od=openDeals().filter(d=>d.personId===x.id).length;
    return `<button class="row" data-act="viewPerson" data-id="${x.id}">${badge(x.area||'affairs','user')}<div class="main"><div class="ttl">${esc(x.name)}</div>
     <div class="sub">${(x.roles||[]).map(r=>`<span class="pill">${esc(r)}</span>`).join('')}${x.org?`<span>${esc(x.org)}</span>`:''}${od?`<span>${fa(od)} فرصت باز</span>`:''}</div></div>
     ${bs.length?`<div class="end">${bs.map(([c,v])=>`<div class="${v>0?'amt-pos':'amt-neg'}">${v>0?'طلب ':'بدهی '}${money(v,c)}</div>`).join('')}</div>`:''}</button>`},'کسی ثبت نشده.'));
  return h;
}
function vMoney(){
  const pb=personBal();const f=ui.moneyF;
  const tot={recv:{},pay:{}};Object.values(pb).forEach(m=>Object.entries(m).forEach(([c,v])=>{if(v>0)tot.recv[c]=(tot.recv[c]||0)+v;else if(v<0)tot.pay[c]=(tot.pay[c]||0)-v}));
  const fmt=o=>Object.keys(o).length?Object.entries(o).map(([c,v])=>money(v,c)).join('<br>'):'۰';
  let h=`<div class="kpis"><div class="kpi"><div class="l">جمع طلب من</div><div class="v amt-pos">${fmt(tot.recv)}</div></div><div class="kpi"><div class="l">جمع بدهی من</div><div class="v amt-neg">${fmt(tot.pay)}</div></div></div>`;
  const people=Object.entries(pb).filter(([,m])=>Object.values(m).some(v=>Math.abs(v)>0.0001));
  h+=block('مانده هر طرف حساب',people.length,listOr(people,([pid,m])=>`<button class="row" data-act="viewPerson" data-id="${pid}"><div class="main"><div class="ttl">${esc(pname(pid)||'بدون طرف حساب')}</div></div><div class="end">${Object.entries(m).filter(([,v])=>Math.abs(v)>0.0001).map(([c,v])=>`<div class="${v>0?'amt-pos':'amt-neg'}">${v>0?'طلب ':'بدهی '}${money(v,c)}</div>`).join('')}</div></button>`,'هنوز طلب یا بدهی‌ای ثبت نشده. با دکمهٔ + و «طلب/بدهی» اولین مورد را ثبت کن.'));
  const due=dueLedger(30);
  if(due.length)h+=block('سررسیدهای ۳۰ روز آینده (چک و قرار پرداخت)',due.length,listOr(due,ledgerRow,''));
  let arr=S.ledger.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||'').localeCompare(a.created||''));
  if(f!=='all')arr=arr.filter(l=>l.kind===f);
  h+=`<div style="height:10px"></div>`+chips('moneyF',[['all','همه'],['receivable','طلب'],['payable','بدهی'],['received','دریافت'],['paid','پرداخت']],f);
  h+=block('دفتر ثبت',arr.length,listOr(arr,ledgerRow,'ردیفی نیست.'));
  const rules=S.notes.filter(n=>n.kind==='rule');
  h+=block('قوانین مالی',rules.length,listOr(rules,n=>`<button class="row" data-act="viewNote" data-id="${n.id}"><div class="main"><div class="ttl">${esc(n.title)}</div><div class="sub"><span>${esc(n.version||'')}</span><span>${esc(n.status||'')}</span></div></div></button>`,'قانونی ثبت نشده.'));
  return h;
}

function render(){

    document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===(tab==='tasks'?'today':tab)?'page':'false'));
  const v=document.getElementById('view');
  const focusId=document.activeElement&&document.activeElement.id, selS=document.activeElement&&document.activeElement.selectionStart;

  L.forEach(l=>{const y=jYear(l.date);if(!y)return;const c=l.currency||'تومان';
    if(l.kind==='received'&&CATS_IN.includes(l.category)){inc[y]=inc[y]||{};inc[y][c]=inc[y][c]||{};inc[y][c][l.category]=(inc[y][c][l.category]||0)+Number(l.amount||0)}

  const moves={};S.apiary.filter(a=>!a.void&&a.type==='move'&&a.date).forEach(a=>{const k=(a.to||'نامشخص').trim();const y=jYear(a.date);moves[k]=moves[k]||{};if(!moves[k][y]||a.date<moves[k][y])moves[k][y]=a.date});

  const strip=o=>{const {created,updated,...r}=o;return r};
  const data={امروز:today()+' ('+jShort(today())+')',apiary:S.apiary.filter(a=>!a.void).map(strip),ledger:S.ledger.map(strip),deals:S.deals.map(strip),tasks:S.tasks.map(strip),people:S.people.map(p=>({id:p.id,name:p.name,roles:p.roles})),lots:S.lots.filter(l=>!l.void).map(l=>({...strip(l),supplier:pname(l.supplierId),remaining:lotStat(l).rem})),moves:S.moves.filter(m=>!m.void).map(m=>({...strip(m),person:pname(m.personId),lot:lotName(byId('lots',m.lotId)),lotCode:(byId('lots',m.lotId)||{}).code})),quotes:S.quotes.map(q=>({...strip(q),person:pname(q.personId)}))};

function matchContacts(q,lim=8){q=q.trim();if(q.length<2)return[];const qd=normDigits(q),ql=q.toLowerCase();const out=[];

function parseVcf(txt){txt=txt.replace(/\r?\n[ \t]/g,'').replace(/=\r?\n/g,'');const out=[];
  const qp=s=>{try{return decodeURIComponent(s.replace(/%/g,'%25').replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(_){return s}};
  txt.split(/BEGIN:VCARD/i).slice(1).forEach(c=>{let fn='',n='',org='';const tel=[],em=[];
    c.split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i<0)return;let k=l.slice(0,i),v=l.slice(i+1).trim();if(/QUOTED-PRINTABLE/i.test(k))v=qp(v);const K=k.split(';')[0].toUpperCase();
      if(K==='FN')fn=v;else if(K==='N'&&!n)n=v.split(';').slice(0,2).reverse().filter(Boolean).join(' ');else if(K==='TEL')tel.push(v);else if(K==='EMAIL')em.push(v);else if(K==='ORG')org=v.replace(/;/g,' ').trim()});
    const p=[...new Set(tel.map(t=>{let d=normDigits(t);if(d.startsWith('0098'))d='0'+d.slice(4);else if(d.startsWith('98')&&d.length===12)d='0'+d.slice(2);else if(d.length===10&&d[0]==='9')d='0'+d;return d}).filter(d=>d.length>=7))];
    if(p.length||em.length)out.push({n:(fn||n||p[0]||em[0]).trim(),p:p.slice(0,4),e:em[0]||'',o:org})});return out}
async function importVcf(file){const txt=await file.text();if(!/BEGIN:VCARD/i.test(txt))return toast('این فایل مخاطبین (VCF) نیست');const items=parseVcf(txt);const have=new Set();CT.forEach(c=>c.p.forEach(p=>have.add(p)));
  const fresh=items.filter(c=>!c.p.some(p=>have.has(p))&&(c.p.forEach(p=>have.add(p)),true));

/* ---------- Habits & persistent check-in ---------- */
const HTYPE={yesno:'بله / نه',sleep:'ساعت خواب و بیداری',number:'عدد (مثلاً صفحه، دقیقه)'};
const HICONS={dumbbell:'ورزش',sleep:'خواب',book:'قرآن و مطالعه',research:'پژوهش',personal:'معنوی',therapy:'سلامت',finance:'مالی'};
const ciSnoozed=new Set();
const monthKey=d=>d.slice(0,7);
const ciDoc=(hid,d)=>S.checkins.find(c=>c.habitId===hid&&c.month===monthKey(d));
const getAns=(hid,d)=>{const c=ciDoc(hid,d);return c&&c.days?c.days[d]:undefined};
const activeHabits=()=>S.habits.filter(h=>h.active!==false);
function missingDays(h){if(h.pausedUntil&&today()<=h.pausedUntil)return[];const out=[];const created=(h.created||nowTs()).slice(0,10);const start=addDays(created,-1);
  if(h.lite){const y=addDays(today(),-1);let last='';try{last=localStorage.getItem('miz.lite.'+h.id)||''}catch(_){}if(y>=start&&getAns(h.id,y)===undefined&&(!last||diffDays(today(),last)>=3))out.push(y);return out}
  for(let i=1;i<=7;i++){const d=addDays(today(),-i);if(d<start)break;if(getAns(h.id,d)===undefined)out.push(d)}return out}
const dayWord=d=>{const n=diffDays(today(),d);return n===1?'دیروز':n===2?'پریروز':jNice(d)};
const qFor=(h,d)=>{const w=dayWord(d);return h.q.replace(/دیروز|دیشب/g,m=>m==='دیشب'&&w==='دیروز'?'دیشب':w==='دیروز'?m:(m==='دیشب'?'شبِ '+w:w))};
function ciQueue(){const q=[];
  activeHabits().forEach(h=>{const miss=missingDays(h);miss.forEach(d=>{const k='h:'+h.id+':'+d;if(!ciSnoozed.has(k))q.push({k,type:'habit',h,d,miss:miss.length,rank:diffDays(today(),d)===1?0:2})})});
  openTasks().filter(t=>t.priority==1&&t.due&&diffDays(today(),t.due)>=3).forEach(t=>{const k='t:'+t.id;if(!ciSnoozed.has(k))q.push({k,type:'task',t,rank:1})});
  return q.sort((a,b)=>a.rank-b.rank)}
let ciOpen=false,ciMode='all';
function openCheckin(force){if(!force){if(!document.getElementById('sheetRoot').hidden)return;let last=0;try{last=Number(localStorage.getItem('miz.ciLast')||0)}catch(_){}if(Date.now()-last<3*3600e3)return}
  const q=ciQueue();if(!q.length){if(force)toast('سؤال بی‌جوابی نمانده');return}
  ciMode=force?'all':'single';if(!force){try{localStorage.setItem('miz.ciLast',String(Date.now()))}catch(_){}}ciOpen=true;renderCheckin(q)}
function nextCheckin(){const q=ciQueue();if(!q.length){ciOpen=false;closeSheet();toast('چک‌این تمام شد');render();return}
  if(ciMode==='single'){ciOpen=false;closeSheet();render();toast(`ممنون. ${fa(q.length)} سؤال دیگر مانده؛ هر وقت خواستی از «امروز ← چک‌این»`);return}renderCheckin(q)}
function renderCheckin(q){const it=q[0];let body='';if(it.type==='habit'&&it.h.lite){try{localStorage.setItem('miz.lite.'+it.h.id,today())}catch(_){}}

    else body+=`<div class="row2"><button class="btn pri" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="yes">بله ✓</button><button class="btn" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="no">نه</button></div>`;

  else{const t=it.t;const n=diffDays(today(),t.due);
    body=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${badge(t.area||'affairs','warn')}<div><div style="font-weight:800;font-size:17px">${esc(t.title)}</div><div style="font-size:12.5px;color:var(--bad);font-weight:700">کار فوری · ${fa(n)} روز عقب افتاده</div></div></div>
    <div class="row2"><button class="btn pri" data-act="ciTask" data-id="${t.id}" data-v="done">انجام شد ✓</button><button class="btn" data-act="ciTask" data-id="${t.id}" data-v="1">فردا انجامش می‌دهم</button><button class="btn" data-act="ciTask" data-id="${t.id}" data-v="7">هفتهٔ بعد</button><button class="btn" data-act="ciLater" data-k="${it.k}">بعداً بپرس</button></div>
    <div class="acts" style="margin-top:10px;justify-content:space-between"><button class="btn ghost danger" data-act="ciTask" data-id="${t.id}" data-v="drop">ول کن، کنارش بگذار</button></div>`}
  openSheet(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="ab" style="--c:var(--a-sales)">${svg('bell')}</span><h3 style="margin:0;flex:1">چک‌این</h3><span class="pill">${ciMode==='single'?fa(q.length)+' سؤال مانده':fa(1)+' از '+fa(q.length)}</span></div>${body}`)}
async function skipRest(hid){const h=byId('habits',hid);const miss=missingDays(h).slice(1);const byM={};miss.forEach(d=>{(byM[monthKey(d)]=byM[monthKey(d)]||[]).push(d)});
  for(const [mk,ds] of Object.entries(byM)){const c=S.checkins.find(x=>x.habitId===hid&&x.month===mk);const days={...(c&&c.days||{})};ds.forEach(d=>days[d]='skip');
    if(c)await save('checkins',c.id,{days});else await putRaw('checkins',{id:hid+'_'+mk,habitId:hid,month:mk,days,created:nowTs(),updated:nowTs()})}

const weekStart=iso=>{const [y,m,d]=iso.split('-').map(Number);const w=new Date(y,m-1,d).getDay();return addDays(iso,-((w+1)%7))};
function habitWeek(h){const ws=weekStart(today());let done=0,sum=0;for(let i=0;i<=diffDays(today(),ws);i++){const a=getAns(h.id,addDays(ws,i));if(a==='yes')done++;else if(h.type==='number'&&a&&a!=='skip'&&a!=='no')sum+=Number(a)||0}return h.type==='number'?sum:done}
function habitStreak(h){let n=0;for(let i=1;i<=400;i++){const a=getAns(h.id,addDays(today(),-i));if(a==='yes'||(h.type!=='yesno'&&a&&a!=='skip'&&a!=='no'))n++;else break}return n}
function sleepAvg(h,days=14){const v=[];for(let i=1;i<=days;i++){const a=getAns(h.id,addDays(today(),-i));if(a&&a.startsWith('{')){try{const o=JSON.parse(a);const t=x=>{const [H,M]=x.split(':').map(Number);return H*60+M};let b=t(o.bed),w=t(o.wake);if(b<w)b+=0;let dur=w-b;if(dur<=0)dur+=1440;v.push({b:t(o.bed)<720?t(o.bed)+1440:t(o.bed),w,dur})}catch(_){}}}
  if(!v.length)return null;const av=k=>v.reduce((a,x)=>a+x[k],0)/v.length;const hm=m=>{m=Math.round(m)%1440;return fa(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'))};return{bed:hm(av('b')),wake:hm(av('w')),dur:fa(Math.round(av('dur')/6)/10).replace('.','٫'),n:v.length}}
function habitsStrip(){const hs=activeHabits();if(!hs.length)return'';const q=ciQueue();
  return block('عادت‌ها',null,`<div class="list">${hs.map(h=>{const miss=missingDays(h).length;let right='';
    if(h.type==='sleep'){const a=sleepAvg(h,7);right=a?`<b>${a.dur} ساعت</b><div class="sub">میانگین ۷ شب</div>`:''}
    else{const w=habitWeek(h);right=`<b>${fa(w)}${h.target?' از '+fa(h.target):''}</b><div class="sub">این هفته</div>`}
    const st=habitStreak(h);
    return `<button class="row" data-act="editHabit" data-id="${h.id}">${badge(h.area||'personal',h.icon||'personal')}<div class="main"><div class="ttl">${esc(h.name)}</div><div class="sub">${h.pausedUntil&&today()<=h.pausedUntil?`<span class="pill">مکث تا ${jNice(h.pausedUntil)}</span>`:miss?`<span class="pill bad">${fa(miss)} روز بی‌جواب</span>`:'<span class="pill ok">به‌روز</span>'}${h.lite?'<span class="pill">کم‌پرسش</span>':''}${st>1?`<span>${fa(st)} روز پشت‌سرهم</span>`:''}</div></div><div class="end">${right}</div></button>`}).join('')}</div>`,q.length?`<button class="link" data-act="checkin">چک‌این (${fa(q.length)})</button>`:'')}
function habitsReport(){const hs=S.habits;if(!hs.length)return'';

    if(h.type==='sleep'){const a=sleepAvg(h,28);t=a?`خواب ${a.bed} · بیداری ${a.wake} · ${a.dur} ساعت (${fa(a.n)} شب ثبت‌شده)`:'ثبت نشده'}
    else{const wk=[0,1,2,3].map(k=>{const ws=addDays(weekStart(today()),-7*k);let c=0;for(let i=0;i<7;i++){const a=getAns(h.id,addDays(ws,i));if(a==='yes')c++;else if(h.type==='number'&&a&&!['skip','no'].includes(a))c+=Number(a)||0}return c}).reverse();t=wk.map((c,i)=>`هفتهٔ ${['−۳','−۲','−۱','جاری'][i]}: ${fa(c)}${h.target?'/'+fa(h.target):''}`).join(' · ')}
    return `<div class="row">${badge(h.area||'personal',h.icon||'personal')}<div class="main"><div class="ttl">${esc(h.name)}</div><div class="sub"><span>${t}</span></div></div></div>`}).join('')}</div>`}

function captureGeo(){const m=document.getElementById('geoMsg');const no='موقعیت در این نما در دسترس نیست؛ در نسخهٔ نصبی روی گوشی کار می‌کند. فعلاً نام محل را بنویس.';

    case'chain':{const ts=openTasks().filter(t=>t.flow&&t.flow.kind===b.dataset.v);openSheet(`<h3>زنجیرهٔ در جریان</h3>${listOr(ts,taskRow,'موردی نیست.')}<p class="hint" style="font-size:12px;color:var(--muted)">با ثبت فروش، خرید یا تسویه، این موارد خودکار بسته می‌شوند. اگر نتیجهٔ دیگری داشت، تیکش را بزن.</p><div class="acts"><button class="btn ghost" data-act="close">بستن</button></div>`);break}
    case'checkin':openCheckin(true);break;
    case'ciAns':await answerCheckin(b.dataset.h,b.dataset.d,b.dataset.v);break;
    case'ciSkipRest':await skipRest(b.dataset.h);break;
    case'ciLater':ciSnoozed.add(b.dataset.k);nextCheckin();break;
    case'ciTask':{const t=byId('tasks',b.dataset.id);const v=b.dataset.v;if(v==='done')await save('tasks',t.id,{status:'done',doneAt:nowTs()});else if(v==='drop')await save('tasks',t.id,{status:'archived',note:(t.note?t.note+' · ':'')+'کنار گذاشته شد در چک‌این'});else await save('tasks',t.id,{due:addDays(today(),Number(v))});nextCheckin();break}
    case'habits':habitsSheet();break;
    case'newHabit':formHabit();break;
    case'editHabit':formHabit(byId('habits',id));break;
    case'habitToggle':{const h=byId('habits',id);if(await save('habits',id,{active:h.active===false}))formHabit(byId('habits',id));break}
    case'ciStop':stopAsk(b.dataset.h);break;
    case'stopWhy':await stopWhy(b.dataset.h,b.dataset.v);break;
    case'newLot':formLot();break;
    case'editLot':formLot(byId('lots',id));break;
    case'viewLot':viewLot(id);break;
    case'newMove':formMove({lotId:b.dataset.lot,personId:b.dataset.person});break;
    case'viewMove':viewMove(id);break;
    case'newQuote':formQuote({personId:b.dataset.person});break;
    case'viewQuote':viewQuote(id);break;
    case'voidMoveAsk':document.getElementById('voidBox').innerHTML=`<form data-form="voidMove" data-id="${id}" style="margin-top:12px"><div class="fld"><label for="f_vr">دلیل باطل کردن</label><input id="f_vr" required></div><button class="btn danger">باطل شود</button></form>`;document.getElementById('f_vr').focus();break;
    case'pickContact':{const bx=document.getElementById('ctSug');if(bx&&bx._m)fillFromContact(bx._m[Number(b.dataset.i)]);break}
    case'phoneContacts':pickFromPhone();break;
    case'addFromContact':{const c=(window._ctm||[])[Number(b.dataset.i)];if(c){formPerson({});fillFromContact(c)}break}
    case'ask':askSheet();break;
    case'notesList':openSheet(`<h3>یادداشت‌ها و قوانین</h3>${listOr(S.notes,n=>`<button class="row" data-act="viewNote" data-id="${n.id}"><div class="main"><div class="ttl">${esc(n.title)}</div><div class="sub"><span>${esc(n.version||'')}</span></div></div></button>`,'یادداشتی نیست.')}`);break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='f_pipe'){const s=document.getElementById('f_stage');s.innerHTML=PIPES[e.target.value].st.map(x=>opt(x,x,'')).join('')}
  if(e.target.id==='f_atype'){const show=APT[e.target.value].f;document.querySelectorAll('[data-af]').forEach(el=>el.hidden=!show.includes(el.dataset.af))}
  if(e.target.id==='f_restore'&&e.target.files[0])doRestore(e.target.files[0]);
  if(e.target.id==='f_vcf'&&e.target.files[0])importVcf(e.target.files[0]);
  if(e.target.id==='f_src')document.querySelectorAll('[data-src]').forEach(el=>el.hidden=el.dataset.src!==e.target.value);
  if(e.target.id==='f_mk')document.querySelectorAll('[data-mk]').forEach(el=>el.hidden=e.target.value!=='sale');
});
document.addEventListener('input',e=>{if(e.target.id==='peopleQ'){ui.peopleQ=e.target.value;render()}if(e.target.id==='gq')runSearch(e.target.value);if(e.target.id==='f_name')contactSuggest(e.target.value)});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form,id=f.dataset.id||null;
  if(k==='capture'){const v=val('capIn');if(!v)return;if(await save('inbox',null,{text:v,processed:false})){document.getElementById('capIn').value='';toast('یادداشت شد');return;toast('در صندوق ورودی ثبت شد')}return}
  if(k==='task'){const due=readDate('f_due');if(due===null)return;const d={title:val('f_title'),due,priority:Number(val('f_pri'))||3,area:val('f_area'),personId:val('f_person'),dealId:val('f_dealT'),note:val('f_note'),loc:readLoc()};
    if(!d.title)return toast('عنوان کار لازم است');if(!id)d.status='open';
    if(await save('tasks',id,d)){if(f.dataset.inbox)await save('inbox',f.dataset.inbox,{processed:true});closeSheet();toast('ذخیره شد')}return}
  if(k==='deal'){const nd=readDate('f_nd',true);if(nd===null)return;const pipe=val('f_pipe');
    const d={title:val('f_title'),pipe,area:PIPES[pipe].area,stage:val('f_stage'),personId:val('f_person'),nextStep:val('f_next'),nextDate:nd,value:num(val('f_val'))||0,currency:val('f_cur'),note:val('f_note')};
    if(!d.title)return toast('عنوان لازم است');if(!d.nextStep)return toast('هر فرصت باید «قدم بعدی» داشته باشد');if(!id)d.status='open';
    if(await save('deals',id,d)){closeSheet();toast('ذخیره شد')}return}
  if(k==='person'){const roles=[...f.querySelectorAll('[data-act=toggleChip][aria-pressed=true]')].map(x=>x.dataset.v);
    const d={name:val('f_name'),roles,phone:val('f_phone'),email:val('f_email'),org:val('f_org'),area:val('f_area'),note:val('f_note')};if(!d.name)return toast('نام لازم است');if(!id)d.status='active';
    if(await save('people',id,d)){closeSheet();toast('ذخیره شد')}return}
  if(k==='ledger'){const amt=num(val('f_amt'));if(!amt||amt<=0)return toast('مبلغ را درست وارد کن');const date=readDate('f_date',true);if(date===null)return;const due=readDate('f_due');if(due===null)return;
    const d={kind:val('f_kind'),personId:val('f_person'),amount:amt,currency:val('f_cur'),about:val('f_about'),category:val('f_cat'),instrument:val('f_instr'),ref:val('f_ref'),settles:(d0=>d0&&d0.checked&&(val('f_kind')==='received'||val('f_kind')==='paid'))(document.getElementById('f_settles')),date,due,evidence:val('f_ev'),settled:false,void:false};
    if(!d.personId&&!d.about)return toast('طرف حساب یا «بابت» را بنویس');
    if(await save('ledger',null,d)){closeSheet();toast('ثبت شد')}return}
  if(k==='apiary'){const date=readDate('f_adate',true);if(date===null)return;const type=val('f_atype');const show=APT[type].f;
    const d={type,date,note:val('f_anote'),geo:readLoc()};
    for(const fk of Object.keys(AFLD)){const v=show.includes(fk)?val('f_a_'+fk):'';d[fk]=(fk==='hives'||fk==='qty')?(v?num(v):null):v}
    if(type==='move'&&!d.to)return toast('مقصد کوچ را بنویس');if(type==='harvest'&&!d.qty)return toast('مقدار برداشت را بنویس');
    if(await save('apiary',id,d)){closeSheet();toast('ثبت شد')}return}
  if(k==='ask'){const q=val('f_q');if(q)runAsk(q);return}
  if(k==='inboxEdit'){const t=val('f_it');if(!t)return toast('متن خالی است');if(await save('inbox',id,{text:t})){closeSheet();toast('ذخیره شد')}return}
  if(k==='note'){const d={title:val('f_nt'),version:val('f_nv'),status:val('f_ns'),body:document.getElementById('f_nb').value};if(!d.title)return toast('عنوان لازم است');if(await save('notes',id,d)){closeSheet();toast('ذخیره شد')}return}
  if(k==='moveEdit'){const m=byId('moves',id);const date=readDate('f_mdate',true);if(date===null)return;const d={personId:val('f_person'),toName:val('f_person')?'':val('f_mto'),date,note:val('f_mnote')};
    if(!m.locked){const q=num(val('f_mqty'));if(!q||q<=0)return toast('مقدار را درست وارد کن');d.qty=q}
    if(await save('moves',id,d)){closeSheet();toast('ذخیره شد')}return}
  if(k==='ledgerEdit'){const due=readDate('f_due');if(due===null)return;const d={personId:val('f_person'),about:val('f_about'),category:val('f_cat'),instrument:val('f_instr'),ref:val('f_ref'),due,evidence:val('f_ev')};if(await save('ledger',id,d)){closeSheet();toast('ذخیره شد')}return}
  if(k==='habit'){const d={name:val('f_hn'),q:val('f_hq'),type:val('f_ht'),target:num(val('f_htg'))||0,area:val('f_area')||'personal',icon:val('f_hi')||'personal',active:true};if(!d.name||!d.q)return toast('نام و سؤال لازم است');if(await save('habits',id,d)){closeSheet();toast('ذخیره شد')}return}
  if(k==='ciTime'){const hid=f.dataset.h,dt=f.dataset.d;const a=val('f_bed'),w=val('f_wake');if(!a||!w)return toast('هر دو ساعت را وارد کن');await answerCheckin(hid,dt,JSON.stringify({bed:a,wake:w}));return}
  if(k==='ciNum'){const v=num(val('f_cin'));if(v==null)return toast('عدد را وارد کن');await answerCheckin(f.dataset.h,f.dataset.d,String(v));return}
  if(k==='lot'){const date=readDate('f_ldate',true);if(date===null)return;const src=val('f_src');const prod=val('f_prod');
    const d={product:prod,variety:val('f_var'),source:src,supplierId:src==='buy'?val('f_sup'):'',date,place:val('f_lplace'),note:val('f_lq'),currency:val('f_lcur')};
    if(!id){const q=num(val('f_lqty'));if(!q||q<=0)return toast('مقدار را درست وارد کن');d.qty=q;d.unit=val('f_lunit');d.cost=src==='buy'?(num(val('f_lcost'))||0):0;d.code=nextLotCode(prod,date);d.void=false}
    if(!(await save('lots',id,d)))return;
    if(!id&&src==='buy'&&d.cost>0){const pay=val('f_lpay');const total=d.cost*d.qty;
      if(pay!=='none')await save('ledger',null,{kind:pay==='credit'?'payable':'paid',personId:d.supplierId||'',amount:total,currency:d.currency||'تومان',about:`خرید ${fmtQ(d.qty,d.unit)} ${d.product} ${d.variety||''} (${d.code})`,category:'خرید و تأمین کالا',instrument:'نقد/کارت',date,due:pay==='credit'?addDays(date,30):'',settled:false,void:false})}
    if(!id&&src==='buy'&&d.supplierId)await closeFlows(t=>t.flow&&t.flow.kind==='quote_got'&&t.flow.personId===d.supplierId&&t.flow.product===prod,'خرید ثبت شد');
    closeSheet();toast(id?'ذخیره شد':'محموله '+fa(d.code)+' ثبت شد');return}
  if(k==='move'){const lotId=val('f_mlot');const l=byId('lots',lotId);if(!l)return toast('محموله را انتخاب کن');const kind=val('f_mk');
    const q=num(val('f_mqty'));if(!q||q<=0)return toast('مقدار را درست وارد کن');const st=lotStat(l);
    if(kind!=='ret'&&q>st.rem+1e-9&&f.dataset.force!=='1'){f.dataset.force='1';document.getElementById('mWarn').innerHTML=`<div class="banner" style="margin:0 0 10px">${svg('warn')} موجودی ثبت‌شدهٔ این محموله ${fmtQ(st.rem,l.unit)} است و این ثبت ${fmtQ(q-st.rem,l.unit)} کسری می‌سازد. اگر مطمئنی دوباره «ثبت» را بزن؛ بعد در انبار علامت می‌خورد تا ورود جاافتاده یا مقدار را اصلاح کنی.</div>`;return}
    const date=readDate('f_mdate',true);if(date===null)return;const price=kind==='sale'?(num(val('f_mprice'))||0):0;const pay=kind==='sale'?val('f_mpay'):'none';const cur=val('f_mcur')||'تومان';const pid=val('f_person');
    if(kind==='sale'&&pay==='credit'&&!pid)return toast('برای فروش نسیه، خریدار را انتخاب کن');
    const mv={kind,lotId,personId:pid,toName:pid?'':val('f_mto'),date,qty:q,price,currency:cur,credit:pay==='credit',note:val('f_mnote'),void:false};
    if(!(await save('moves',null,mv)))return;
    if(kind==='sale'&&price>0&&pay!=='none')await save('ledger',null,{kind:pay==='credit'?'receivable':'received',personId:pid,amount:price*q,currency:cur,about:`فروش ${fmtQ(q,l.unit)} ${lotName(l)} (${l.code})`,category:PROD_CAT[l.product]||'سایر درآمد',instrument:'نقد/کارت',date,due:pay==='credit'?addDays(date,30):'',settled:false,void:false});
    if(kind==='sale'&&pid)await closeFlows(t=>t.flow&&t.flow.personId===pid&&t.flow.product===l.product&&(t.flow.kind==='quote_gave'||t.flow.kind==='sample'),'فروش ثبت شد');
    if(kind==='sample'&&pid)await openFlow({kind:'sample',personId:pid,product:l.product},`پیگیری نظر ${pname(pid)} دربارهٔ نمونهٔ ${lotName(l)}`,7,'sales');
    closeSheet();toast('ثبت شد'+(kind==='sale'&&price>0&&pay!=='none'?'؛ ردیف مالی هم ساخته شد':'')+(q>st.rem+1e-9&&kind!=='ret'?'؛ کسری انبار علامت خورد':''));return}
  if(k==='quote'){const pr=num(val('f_qpr'));if(!pr)return toast('قیمت را وارد کن');const date=readDate('f_qdate',true);if(date===null)return;
    const dir=val('f_qd'),pid=val('f_person'),prod=val('f_qp');
    if(await save('quotes',id,{dir,personId:pid,product:prod,variety:val('f_qv'),price:pr,unit:val('f_qu'),currency:val('f_qc'),date,note:val('f_qn')})){
      if(pid&&!id)await openFlow({kind:dir==='got'?'quote_got':'quote_gave',personId:pid,product:prod},dir==='got'?`تصمیم دربارهٔ خرید ${prod} از ${pname(pid)}`:`پیگیری قیمت ${prod} داده‌شده به ${pname(pid)}`,3,dir==='got'?'export':'sales');
      closeSheet();toast('قیمت ثبت شد'+(pid?'؛ پیگیری‌اش در کارها آمد':''))}return}
  if(k==='voidMove'){const r=val('f_vr');if(!r)return toast('دلیل لازم است');if(await save('moves',id,{void:true,voidReason:r,voidAt:nowTs()})){closeSheet();toast('باطل شد')}return}
  if(k==='void'){const r=val('f_vr');if(!r)return toast('دلیل لازم است');if(await save('ledger',id,{void:true,voidReason:r,voidAt:nowTs()})){closeSheet();toast('باطل شد؛ ردیف درست را دوباره ثبت کن')}return}
});
