<style>
/* Layout: one-column mobile app — sticky header, scrolling view, bottom tab bar, floating add button, bottom sheets */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e8ece7; --ink:#1c2420; --muted:#5f6b64; --line:#d9dfd9;
  --accent:#b8740a; --accent-ink:#ffffff; --accent-soft:#f6e7cc;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#9a5b00; --warn-soft:#fbead0; --bad:#b0281f; --bad-soft:#f7dcd9;
  --a-sales:#b26f06; --a-export:#17708f; --a-marketers:#8447b8; --a-finance:#2c7a4b; --a-therapy:#bd3458; --a-research:#3a57c0; --a-career:#56616b; --a-personal:#727314; --a-affairs:#8a6447;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --sunk:#232a26; --ink:#e6ebe7; --muted:#9aa69f; --line:#2c3430;
  --accent:#e3a03a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --ok:#6cc58f; --ok-soft:#1d3326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f08a80; --bad-soft:#3c1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --a-sales:#e8a744; --a-export:#5bb8d8; --a-marketers:#bc95ea; --a-finance:#6cc58f; --a-therapy:#f28ca6; --a-research:#93a9f4; --a-career:#a9b4be; --a-personal:#cdcb6c; --a-affairs:#d0ad8c;
}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --sunk:#232a26; --ink:#e6ebe7; --muted:#9aa69f; --line:#2c3430;
  --accent:#e3a03a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --ok:#6cc58f; --ok-soft:#1d3326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f08a80; --bad-soft:#3c1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --a-sales:#e8a744; --a-export:#5bb8d8; --a-marketers:#bc95ea; --a-finance:#6cc58f; --a-therapy:#f28ca6; --a-research:#93a9f4; --a-career:#a9b4be; --a-personal:#cdcb6c; --a-affairs:#d0ad8c;
}
*{box-sizing:border-box}
svg:not([width]){width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top .t{flex:1;min-width:0}
header.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
header.top .d{font-size:12.5px;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;left:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
section.blk{margin-top:18px}
.blk-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.blk-h h2{margin:0;font-size:15px;font-weight:800}
.blk-h .n{font-size:12px;color:var(--muted)}
.blk-h .sp{flex:1}
.link{border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;padding:4px}
.tbl{overflow-x:auto;background:var(--surface);border-top:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;font-size:12px;background:var(--sunk)}
.tbl td:nth-child(n+2){text-align:left}
.tbl tr.tot td{font-weight:800}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:right;background:none;border-inline:0;border-bottom:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.row .end{flex:none;text-align:left;font-size:13px;font-variant-numeric:tabular-nums}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on svg{display:block}
.chk svg{display:none;width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ab{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}

.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
details.more{border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:11px}details.more>summary{font-size:13px;color:var(--muted);cursor:pointer;padding:2px 0}details.more[open]>summary{margin-bottom:10px}
.banner svg{width:18px;height:18px;vertical-align:-4px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
a.btn,a.pill{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.ppw{position:relative}.ppw input{padding-inline-end:40px}.ppx{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;color:var(--muted);width:32px;height:32px}
.chips::-webkit-scrollbar{display:none}
.chip svg{width:14px;height:14px;vertical-align:-2px}
.dbox{display:flex;gap:6px;align-items:stretch}.dbox input{flex:1;min-width:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.dstep{flex:none;width:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.cal{border:1px solid var(--line);border-radius:12px;padding:8px;margin:6px 0;background:var(--surface)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.calh .dstep{height:34px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.calg i{font-style:normal;font-size:11.5px;color:var(--muted)}
.cd{border:0;background:var(--bg);border-radius:8px;padding:7px 0;font-size:13.5px}.cd.t{outline:1.5px solid var(--accent)}.cd.s{background:var(--accent);color:var(--accent-ink);font-weight:800}
.pill svg,.link svg{width:13px;height:13px;vertical-align:-2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 10px;display:flex;gap:9px;align-items:center;text-align:right;min-height:60px}
.tile b{display:block;font-size:13.5px;line-height:1.35}.tile small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.grp{font-size:12px;font-weight:800;color:var(--muted);margin:12px 2px 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;margin-top:14px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.stage{display:flex;gap:3px;margin-top:6px}
.stage i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.stage i.on{background:var(--accent)}
.amt-pos{color:var(--ok)} .amt-neg{color:var(--bad)}
.void .ttl,.void .end{text-decoration:line-through;color:var(--muted)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 10px;font-size:17px;font-weight:800}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-height:42px}
.fld textarea{min-height:84px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px}
.qa svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.capture{display:flex;gap:8px;margin-top:14px}
.capture input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font-size:14px}
.det dt{color:var(--muted)} .det dd{margin:0;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;font-size:14px;line-height:1.85;background:var(--bg);border-radius:12px;padding:12px}
#toast{pointer-events:none;position:fixed;bottom:calc(140px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-size:13.5px;z-index:30}
.search-in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script>
/* ---------- Jalali calendar (jalaali-js algorithm) ---------- */
const J=(()=>{
  const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
  const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  function jalCal(jy){let bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
    for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
    n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
    leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
    if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
  function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
  function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}
  function toJ(gy,gm,gd){const jdn=g2d(gy,gm,gd);let jy=d2g(jdn).gy-621;const r=jalCal(jy);const f=g2d(r.gy,3,r.march);let k=jdn-f,jm,jd;
    if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd}}else k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
    jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
  function toG(jy,jm,jd){const r=jalCal(jy);const jdn=g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;return d2g(jdn)}
  return{toJ,toG};
})();
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const wdOf=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const SCHED={all:{n:'هر روز',s:'',d:[0,1,2,3,4,5,6]},even:{n:'روزهای زوج (شنبه، دوشنبه، چهارشنبه)',s:'زوج',d:[6,1,3]},odd:{n:'روزهای فرد (یکشنبه، سه‌شنبه، پنجشنبه)',s:'فرد',d:[0,2,4]},custom:{n:'روزهای دلخواه',s:'',d:[]}};
const REP={'':'بدون تکرار',daily:'هر روز',even:'روزهای زوج (شنبه، دوشنبه، چهارشنبه)',odd:'روزهای فرد (یکشنبه، سه‌شنبه، پنجشنبه)',weekly:'هر هفته',monthly:'هر ماه'};
const REPS={daily:'هر روز',even:'زوج',odd:'فرد',weekly:'هفتگی',monthly:'ماهانه'};
function nextOcc(base,rep){const t=today();let d=base>t?base:t;
  if(rep==='weekly'){d=base;do d=addDays(d,7);while(d<=t);return d}
  if(rep==='monthly'){d=base;do{const [y,m,dd]=d.split('-').map(Number);const j=J.toJ(y,m,dd);let jm=j.jm+1,jy=j.jy;if(jm>12){jm=1;jy++}const g=J.toG(jy,jm,Math.min(j.jd,jm<=6?31:jm<12?30:29));d=`${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`}while(d<=t);return d}
  const days=rep==='even'?[6,1,3]:rep==='odd'?[0,2,4]:[0,1,2,3,4,5,6];for(let i=0;i<14;i++){d=addDays(d,1);if(days.includes(wdOf(d)))return d}return addDays(t,1)}
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoOf(new Date());
const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1,d+n);return isoOf(x)};
const diffDays=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(a)-p(b))/864e5)};
function jOf(iso){const [y,m,d]=iso.split('-').map(Number);return J.toJ(y,m,d)}
function jShort(iso){if(!iso)return'';const j=jOf(iso);return fa(`${j.jy}/${pad(j.jm)}/${pad(j.jd)}`)}
function jNice(iso){if(!iso)return'';const t=today();const dd=diffDays(iso,t);
  if(dd===0)return'امروز';if(dd===1)return'فردا';if(dd===-1)return'دیروز';
  const j=jOf(iso);const s=`${fa(j.jd)} ${MONTHS[j.jm-1]}`;return j.jy===jOf(t).jy?s:s+' '+fa(j.jy)}
function jLong(iso){const [y,m,d]=iso.split('-').map(Number);const w=new Date(y,m-1,d).getDay();const j=J.toJ(y,m,d);return `${WD[w]} ${fa(j.jd)} ${MONTHS[j.jm-1]} ${fa(j.jy)}`}
function parseJ(s){s=en(String(s||'').trim());if(!s)return'';const t0=today(),tj=jOf(t0);
  if(/^امروز$/.test(s))return t0;if(/^دیروز$/.test(s))return addDays(t0,-1);if(/^پریروز$/.test(s))return addDays(t0,-2);if(/^فردا$/.test(s))return addDays(t0,1);
  let a,b,c;const mi=MONTHS.findIndex(m=>s.includes(m));
  if(mi>=0){const nums=(s.match(/\d+/g)||[]).map(Number);c=nums[0];b=mi+1;a=nums[1]||tj.jy;if(!c)return null}
  else{const parts=s.split(/[^0-9]+/).filter(Boolean);
    if(parts.length===1){const d=parts[0];if(d.length===8){a=+d.slice(0,4);b=+d.slice(4,6);c=+d.slice(6)}else if(d.length===6){a=1400+ +d.slice(0,2);b=+d.slice(2,4);c=+d.slice(4)}else if(d.length===4){a=tj.jy;b=+d.slice(0,2);c=+d.slice(2)}else if(d.length===3){a=tj.jy;b=+d.slice(0,1);c=+d.slice(1)}else if(d.length<=2){a=tj.jy;b=tj.jm;c=+d}else return null}
    else if(parts.length===2){a=tj.jy;b=+parts[0];c=+parts[1]}else if(parts.length===3){[a,b,c]=parts.map(Number);if(a<100)a+=1400}else return null}
  const max=b<=6?31:b<12?30:(jOf(jIso(a,12,30)).jd===30?30:29);if(b<1||b>12||c<1||c>max)return null;const g=J.toG(a,b,c);return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`}
const num=v=>{const x=Number(en(String(v??'')).replace(/٫/g,'.').replace(/[,٬،\s]/g,''));return isNaN(x)?null:x};
const MIL=c=>(c||'تومان')==='تومان';
const toBase=(x,c)=>x==null?x:(MIL(c)?Math.round(x*1e6):x);
const fromBase=(x,c)=>x==null||x===''?'':(MIL(c)?Math.round(Number(x)/1e6*1e6)/1e6:Number(x));
const nfmt=(v,d=2)=>fa(new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(v).replace(/,/g,'٬').replace('.','٫'));
const ul=(sel,c)=>`<span class="ul" data-for="${sel}" style="font-weight:400;color:var(--muted)">${MIL(c)?' (میلیون تومان)':''}</span>`;
const money=(v,c)=>{const a=Math.abs(Number(v)||0);if(MIL(c)&&a>=1000)return nfmt(a/1e6,3)+' میلیون تومان';return nfmt(a)+' '+(c||'تومان')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Storage: inside Claude → private shared db; standalone on phone → IndexedDB (local-first) + file backup */
async function initDb(){
  const cl=window.claude;
  if(cl&&cl.use){db=await cl.use('db')}
  if(db){mode='cloud';
    COLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));if(c==='contacts')rebuildContacts();loaded.add(c);render()},e=>showConn('خطا در خواندن داده: '+e.code))});
    return}
  mode='local';
  try{idb=await new Promise((res,rej)=>{const r=indexedDB.open('miz-kar',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'k'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const all=await new Promise((res,rej)=>{const q=idb.transaction('docs').objectStore('docs').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
    all.forEach(x=>{if(S[x.col])S[x.col].push(x.doc)});rebuildContacts();COLS.forEach(c=>loaded.add(c));
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  }catch(e){showConn('حافظهٔ گوشی در دسترس نیست؛ داده‌ها ذخیره نمی‌شوند.')}
  render();
}
function showConn(m){const b=document.getElementById('conn');b.textContent=m;b.hidden=false}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function idbPut(col,doc){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');t.objectStore('docs').put({k:col+'/'+doc.id,col,doc});t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function save(col,id,data){const prev=col==='tasks'&&id?byId('tasks',id):null;const was=prev?{...prev}:null;const ok=await save0(col,id,data);
  if(ok&&was&&was.repeat&&was.status!=='done'&&data.status==='done'){const nd=nextOcc(was.due||today(),was.repeat);await putRaw('tasks',{id:newId(),title:was.title,area:was.area||'',priority:was.priority||3,personId:was.personId||'',dealId:was.dealId||'',note:was.note||'',repeat:was.repeat,due:nd,status:'open',created:nowTs(),updated:nowTs()});if(mode==='local')render();setTimeout(()=>toast('نوبت بعدی: '+jNice(nd)+' ↻'),2300)}
  return ok}
async function save0(col,id,data){
  try{
    if(mode==='cloud'){
      if(id){await db.collection(col).doc(id).update({...data,updated:nowTs()})}
      else{await db.collection(col).doc().set({...data,created:nowTs(),updated:nowTs()})}
      return true}
    if(mode==='local'&&idb){
      let doc;const i=id?S[col].findIndex(x=>x.id===id):-1;
      if(i>=0){doc={...S[col][i],...data,updated:nowTs()};S[col][i]=doc}
      else{doc={id:id||newId(),...data,created:nowTs(),updated:nowTs()};S[col].push(doc)}
      await idbPut(col,doc);render();return true}
    toast('ثبت ممکن نیست؛ محل ذخیره در دسترس نیست');return false
  }catch(e){toast(e.code==='quota_exceeded'?'ظرفیت پایگاه داده پر است':'ثبت نشد: '+(e.code||e.message||'خطا'));return false}
}
async function putRaw(col,doc){
  if(mode==='cloud'){const {id,...rest}=doc;await db.collection(col).doc(id).set(rest)}
  else{const i=S[col].findIndex(x=>x.id===doc.id);if(i>=0)S[col][i]=doc;else S[col].push(doc);await idbPut(col,doc)}
}
function backupData(){return {app:'miz-kar',version:APP_VER,exported:nowTs(),data:Object.fromEntries(COLS.map(c=>[c,S[c]]))}}
function lastBackup(){try{return localStorage.getItem('miz.lastBackup')||''}catch(_){return''}}
async function doBackup(){
  const now=new Date();const stamp=en(jShort(today())).replace(/\//g,'-')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');const name='miz-kar-backup-'+stamp+'.json';const shareName='miz-kar-backup-'+stamp+'.txt';
  const txt=JSON.stringify(backupData());
  const markDone=()=>{try{localStorage.setItem('miz.lastBackup',today())}catch(_){}render()};
  try{const file=new File([txt],shareName,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'پشتیبان میز کار'});markDone();toast('ارسال شد');return}}catch(e){if(e&&e.name==='AbortError')return}
  const dl=window.claude&&await window.claude.use('downloads');
  if(dl){try{await dl.save({filename:name,data:txt});markDone();toast('فایل آماده شد؛ آن را در درایو بارگذاری کن')}catch(_){toast('دریافت انجام نشد')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();markDone();toast('منوی اشتراک در این نما نیست؛ فایل در Downloads ذخیره شد — از آنجا در درایو بگذار')}catch(_){toast('ذخیرهٔ فایل ممکن نشد')}
}
async function doRestore(file){
  let j;try{j=JSON.parse(await file.text())}catch(_){return toast('فایل پشتیبان معتبر نیست')}
  const data=j&&j.data;if(!data||j.app!=='miz-kar')return toast('این فایل پشتیبان میز کار نیست');
  let n=0;
  try{for(const c of COLS){for(const d of (data[c]||[])){if(!d||!d.id)continue;const cur=S[c].find(x=>x.id===d.id);if(!cur||(d.updated||'')>(cur.updated||'')){await putRaw(c,d);n++}}}}
  catch(e){toast('بازیابی نیمه‌کاره ماند: '+(e.code||e.message));render();return}
  rebuildContacts();render();closeSheet();toast(fa(n)+' ردیف بازیابی یا به‌روز شد'+(CT.length?' · '+fa(CT.length)+' مخاطب':''));
}

const openTasks=()=>S.tasks.filter(t=>t.status!=='done'&&t.status!=='archived');
const openDeals=()=>S.deals.filter(d=>(d.status||'open')==='open');
const affects=l=>!l.void&&(l.kind==='receivable'||l.kind==='payable'||!!l.refId||!!l.settles);
function balances(personId){const m={};S.ledger.filter(l=>affects(l)&&(!personId||l.personId===personId)).forEach(l=>{const c=l.currency||'تومان';m[c]=(m[c]||0)+LK[l.kind].s*(Number(l.amount)||0)});return m}
function personBal(){const r={};S.ledger.filter(l=>affects(l)&&l.personId).forEach(l=>{const k=l.personId;const c=l.currency||'تومان';r[k]=r[k]||{};r[k][c]=(r[k][c]||0)+LK[l.kind].s*(Number(l.amount)||0)});return r}
function dueLedger(days){const t=today(),lim=addDays(t,days);return S.ledger.filter(l=>!l.void&&!l.settled&&(l.kind==='receivable'||l.kind==='payable')&&l.due&&l.due<=lim).sort((a,b)=>a.due.localeCompare(b.due))}

function stageBar(d){const p=PIPES[d.pipe];if(!p)return'';const i=p.st.indexOf(d.stage);return `<div class="stage">${p.st.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`}
function dealRow(d){const p=PIPES[d.pipe]||{n:''};const st=d.status||'open';const miss=st==='open'&&(!d.nextStep||!d.nextDate);

function ledgerRow(l){const s=(l.kind==='receivable'||l.kind==='received')?1:-1;return `<button class="row ${l.void?'void':''}" data-act="viewLedger" data-id="${l.id}">${badge('finance')}<div class="main">

const CTYPE={tcm:'طب سنتی و زنبوردرمانی',psy:'روان‌درمانی و مشاوره',other:'سایر'};
const CVARS={

  psy:[['پریشانی هیجانی','down'],['اضطراب','down'],['ناامیدی','down'],['احساس طردشدگی','down'],['انعطاف شناختی','up'],['تنظیم هیجان','up'],['رضایت از رابطه','up'],['ثبات ارزشمندی','up'],['خطر خودکشی','down']],
  other:[['شدت مشکل اصلی','down'],['عملکرد روزانه','up']]};

const HW={full:'کامل',partial:'نسبی',none:'انجام نشد'};
const cVisits=id=>S.visits.filter(v=>v.caseId===id&&!v.void).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.no||0)-(b.no||0));
const cVars=c=>(c.vars&&c.vars.length?c.vars:(CVARS[c.type]||CVARS.other).map(([n,g])=>({n,g})));
function nextCaseCode(){const ns=S.cases.map(c=>Number(String(c.code||'').replace(/\D/g,''))||0);const n=Math.max(28,...ns)+1;return 'TEB-'+String(n).padStart(4,'0')}
function spark(vals,good){const v=vals.filter(x=>x!=null);if(v.length<2)return'';const w=70,h=20,mx=10;const pts=vals.map((x,i)=>x==null?null:[i*(w/(vals.length-1)),h-(x/mx)*h]).filter(Boolean);
  const first=v[0],last=v[v.length-1];const better=good==='up'?last>first:last<first;const same=last===first;
  return `<svg width="${w}" height="${h}" viewBox="-2 -2 ${w+4} ${h+4}" style="vertical-align:middle"><polyline fill="none" stroke="${same?'var(--muted)':better?'var(--ok)':'var(--bad)'}" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/></svg>`}
function caseScores(c){const vs=cVisits(c.id);return cVars(c).map(x=>{const series=[c.baseline&&c.baseline[x.n]!=null?Number(c.baseline[x.n]):null,...vs.map(v=>v.scores&&v.scores[x.n]!=null&&v.scores[x.n]!==''?Number(v.scores[x.n]):null)];
  const real=series.filter(y=>y!=null);return{...x,series,first:real[0],last:real[real.length-1],cnt:real.length}})}
function interventionStats(c){const vs=cVisits(c.id);const main=cVars(c)[0];const st={};
  vs.forEach((v,i)=>{const nx=vs[i+1];const a=v.scores&&v.scores[main.n],b=nx&&nx.scores&&nx.scores[main.n];
    (v.iv||[]).forEach(x=>{if(!x.n)return;const k=x.n.trim();const o=st[k]=st[k]||{n:k,layer:x.layer,times:0,deltas:[],adverse:0};o.times++;
      if(a!==undefined&&a!==''&&b!==undefined&&b!==''&&a!=null&&b!=null){const d=Number(b)-Number(a);o.deltas.push(main.g==='up'?d:-d)}if(v.adverse)o.adverse++})});
  return {main,list:Object.values(st).sort((a,b)=>b.times-a.times)}}

const AREA_GUESS=[['therapy','طبابت|مطب|بیمار|مراجع|ویزیت|حجامت|درمان|نسخه|TEB'],['personal','جلسه.?قرآن|جلسات.?قرآن|ختم|نماز|زیارت|هیئت|مسجد|ورزش|باشگاه|خانواده|مادر|پدر|همسر|بچه'],['research','قرآن|پژوهش|مقاله|دکتری|تحقیق|پایان.?نامه|کلاس|درس|کتاب'],

  ['career','رزومه|CV|لینکدین|مصاحبه|شغل|هتل'],['affairs','خانه|نظافت|تعمیر|خرید|قبض|ماشین|بیمه|اداره|کارواش']];
const guessArea=t=>{for(const [a,r] of AREA_GUESS)if(new RegExp(r,'i').test(t))return a;return''};
const WDI={'شنبه':6,'یکشنبه':0,'دوشنبه':1,'سه‌شنبه':2,'سه شنبه':2,'چهارشنبه':3,'پنجشنبه':4,'پنج‌شنبه':4,'جمعه':5};
function guessDate(t){const s=today();if(/پس.?فردا/.test(t))return addDays(s,2);if(/فردا/.test(t))return addDays(s,1);if(/امروز|امشب/.test(t))return s;if(/هفته.?(بعد|آینده)/.test(t))return addDays(s,7);if(/ماه.?(بعد|آینده)/.test(t))return addDays(s,30);
  const m=en(t).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);if(m){const r=parseJ(m[0]);if(r)return r}
  const mm=t.match(new RegExp('([۰-۹\\d]{1,2})\\s*('+MONTHS.join('|')+')'));if(mm){const d=Number(en(mm[1])),mo=MONTHS.indexOf(mm[2])+1;let jy=jOf(s).jy;let iso=jIso(jy,mo,d);if(iso<s)iso=jIso(jy+1,mo,d);return iso}
  for(const [w,n] of Object.entries(WDI).sort((a,b)=>b[0].length-a[0].length))if(new RegExp('(^|\\s)'+w+'(\\s|$)').test(t)){for(let i=1;i<=7;i++){const d=addDays(s,i);if(wdOf(d)===n)return d}}
  return ''}
function parseTaskList(txt){let tag='',area='';const out=[];
  txt.split('\n').forEach(raw=>{let l=raw.trim();if(!l)return;
    const h=l.match(/^#?\s*([^:：]{1,40})[:：]\s*$/)||l.match(/^#\s*(\S.{0,39})$/);if(h){tag=h[1].trim();area=guessArea(tag);return}
    l=l.replace(/^([-–•*▪●◦]|[۰-۹\d]+[.)\-])\s*/,'');if(!l)return;
    let pri=3;if(/(^|\s)!+(\s|$)|فوری/.test(l))pri=1;else if(/(^|\s)مهم(\s|$)/.test(l))pri=2;l=l.replace(/(^|\s)!+(?=\s|$)/g,' ');
    let city='';l=l.replace(/@(\S+)/,(_,c)=>{city=c;return ''});let tg=tag;l=l.replace(/#(\S+)/,(_,c)=>{tg=c;return ''});
    const rep=/هر روز/.test(l)?'daily':/روزهای زوج|(^|\s)زوج(\s|$)/.test(l)?'even':/روزهای فرد|(^|\s)فرد(\s|$)/.test(l)?'odd':/هر هفته|هفتگی/.test(l)?'weekly':/هر ماه|ماهانه/.test(l)?'monthly':'';
    const title=l.replace(/\s+/g,' ').trim();if(!title)return;
    out.push({title,tag:tg,area:(tg!==tag?guessArea(tg):'')||area||guessArea(title)||'',due:guessDate(title),priority:pri,city,repeat:rep})});
  return out}

/* ---------- Occasions (birthdays etc.), city tasks, calendar ---------- */
const jIso=(jy,jm,jd)=>{const g=J.toG(jy,jm,Math.min(jd,jm<=6?31:jm<12?30:29));return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`};
const firstPhone=p=>{const x=normDigits(String(p&&p.phone||'').split(/[،,\/]/)[0]);return x};
const intlPhone=x=>x.startsWith('00')?x.slice(2):x.startsWith('0')?'98'+x.slice(1):x;
function occList(){const out=[];const t=today(),tj=jOf(t).jy;
  S.people.filter(p=>p.status!=='archived'&&(p.occ||[]).length).forEach(p=>(p.occ||[]).forEach(o=>{if(!o.m||!o.d)return;
    for(const jy of [tj-1,tj,tj+1]){const iso=jIso(jy,o.m,o.d);const dd=diffDays(iso,t);const key=jy+'|'+o.t;
      out.push({p,o,iso,dd,key,jy,sent:!!(p.occSent||{})[key],age:o.y?jy-o.y:null})}}));
  return out}
const occSoon=(from=-1,to=7)=>occList().filter(x=>x.dd>=from&&x.dd<=to&&!(x.dd<0&&x.sent)).sort((a,b)=>a.dd-b.dd);
const occMsg=x=>{const fn=(x.p.name||'').replace(/^(حکیم|دکتر|استاد|مطب|خانم|آقای)\s+/,'').split(/\s+/)[0];return `${fn} عزیز، ${x.o.t==='تولد'?'تولدت مبارک':x.o.t+' مبارک'} 🌸\nآرزوی سلامتی، شادی و برکت برایت دارم.\nرضا ابراهیمی`};
const whenTxt=dd=>dd===0?'امروز':dd===1?'فردا':dd===-1?'دیروز بود':dd<0?fa(-dd)+' روز پیش':fa(dd)+' روز دیگر';
function occRow(x){const ph=firstPhone(x.p);const m=encodeURIComponent(occMsg(x));
  return `<div class="row" style="flex-wrap:wrap">${badge('personal','gift')}<button class="main" style="border:0;background:none;text-align:right;padding:0" data-act="viewPerson" data-id="${x.p.id}"><div class="ttl">${esc(x.o.t)} · ${esc(x.p.name)}</div><div class="sub"><span class="pill ${x.dd===0?'acc':x.dd<0?'bad':''}">${whenTxt(x.dd)}</span><span>${fa(x.o.d)} ${MONTHS[x.o.m-1]}</span>${x.age?`<span>${fa(x.age)} سالگی</span>`:''}${x.sent?'<span class="pill ok">تبریک گفته شد ✓</span>':''}</div></button>
   ${x.sent?'':`<div class="acts" style="width:100%;margin-top:6px">${ph?`<a class="btn" href="sms:${ph}?body=${m}">پیامک تبریک</a><a class="btn" href="https://wa.me/${intlPhone(ph)}?text=${m}" target="_blank" rel="noopener">واتساپ</a>`:'<span class="hint" style="font-size:12px">شماره ثبت نشده</span>'}<button class="btn ghost" data-act="occDone" data-id="${x.p.id}" data-k="${esc(x.key)}">تبریک گفتم ✓</button></div>`}</div>`}

  <p class="hint" style="font-size:12px;color:var(--muted)">تقویم گوشی سر وقت یادآوری می‌کند، حتی وقتی برنامه بسته است. هر بار مناسبت تازه ثبت کردی، دوباره بزن.</p>`)}
async function occIcs(){const ev=[];const tj=jOf(today()).jy;const st=x=>x.replace(/-/g,'');
  S.people.filter(p=>p.status!=='archived').forEach(p=>(p.occ||[]).forEach((o,i)=>{if(!o.m||!o.d)return;for(const jy of [tj,tj+1,tj+2]){const iso=jIso(jy,o.m,o.d);if(iso<addDays(today(),-1))continue;
    ev.push(['BEGIN:VEVENT',`UID:miz-${p.id}-${i}-${jy}@miz-kar`,`DTSTAMP:${st(today())}T000000Z`,`DTSTART;VALUE=DATE:${st(iso)}`,`DTEND;VALUE=DATE:${st(addDays(iso,1))}`,`SUMMARY:${o.t} ${p.name}${o.y?' ('+(jy-o.y)+' سالگی)':''}`,`DESCRIPTION:تبریک از برنامهٔ میز کار${p.phone?' — '+p.phone:''}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${o.t} ${p.name}`,'TRIGGER;RELATED=START:PT9H','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:فردا ${o.t} ${p.name}`,'TRIGGER;RELATED=START:-PT15H','END:VALARM','END:VEVENT'].join('\r\n'))}}));
  if(!ev.length)return toast('هنوز برای کسی تولد یا مناسبت ثبت نشده');
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//miz-kar//fa','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');const name='miz-kar-occasions.ics';
  try{const file=new File([txt],name,{type:'text/calendar'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'مناسبت‌ها'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const dl=window.claude&&await window.claude.use('downloads');if(dl){try{await dl.save({filename:name,data:txt});toast('فایل تقویم آماده شد؛ بازش کن تا به تقویم اضافه شود')}catch(_){toast('دریافت انجام نشد')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('فایل تقویم دانلود شد؛ بازش کن تا به تقویم گوشی اضافه شود')}
const gcalLink=t=>{const d=(t.due||today()).replace(/-/g,'');const e=addDays(t.due||today(),1).replace(/-/g,'');return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${d}/${e}&details=${encodeURIComponent((t.note||'')+(t.personId?'\nبا: '+pname(t.personId):'')+'\nاز برنامهٔ میز کار')}${t.city?'&location='+encodeURIComponent(t.city):''}`};
const dSel=(cls,cur)=>`<select class="${cls}" style="flex:1">${opt('','روز',cur||'')}${Array.from({length:31},(_,i)=>opt(i+1,fa(i+1),cur)).join('')}</select>`;
const mSel=(cls,cur)=>`<select class="${cls}" style="flex:2">${opt('','ماه',cur||'')}${MONTHS.map((m,i)=>opt(i+1,m,cur)).join('')}</select>`;
const occEdit=(o={})=>`<div class="occr" style="display:flex;gap:6px;margin-bottom:6px"><input class="o_t" style="flex:3" value="${esc(o.t||'')}" placeholder="مثلاً سالگرد ازدواج">${dSel('o_d',o.d)}${mSel('o_m',o.m)}</div>`;
const cities=()=>[...new Set(S.tasks.map(t=>t.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));

/* ---------- One-time fix: toman amounts typed as millions before v0.7 ---------- */
function legacyAmounts(){const out=[];const chk=(col,doc,f,c)=>{const v=Number(doc[f]);if(MIL(c)&&v>0&&v<1000)out.push({col,id:doc.id,f,v})};
  S.quotes.forEach(x=>chk('quotes',x,'price',x.currency));S.ledger.filter(x=>!x.void).forEach(x=>chk('ledger',x,'amount',x.currency));S.lots.filter(x=>!x.void).forEach(x=>chk('lots',x,'cost',x.currency));
  S.moves.filter(x=>!x.void).forEach(x=>chk('moves',x,'price',x.currency));S.deals.forEach(x=>chk('deals',x,'value',x.currency));return out}

function matchContacts(q,lim=8){q=q.trim();if(q.length<2)return[];if(CTK.length!==CT.length)CTK=CT.map(c=>nrm(c.n+' '+(c.o||'')));const qd=normDigits(q),ql=nrm(q);const words=q.split(/\s+/).map(nrm).filter(Boolean);const out=[];

function parseVcf(txt){txt=txt.replace(/\r?\n[ \t]/g,'').replace(/=\r?\n/g,'');const out=[];
  const qp=s=>{try{return decodeURIComponent(s.replace(/%/g,'%25').replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(_){return s}};
  txt.split(/BEGIN:VCARD/i).slice(1).forEach(c=>{let fn='',n='',org='';const tel=[],em=[];
    c.split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i<0)return;let k=l.slice(0,i),v=l.slice(i+1).trim();if(/QUOTED-PRINTABLE/i.test(k))v=qp(v);const K=k.split(';')[0].toUpperCase();
      if(K==='FN')fn=v;else if(K==='N'&&!n)n=v.split(';').slice(0,2).reverse().filter(Boolean).join(' ');else if(K==='TEL')tel.push(v);else if(K==='EMAIL')em.push(v);else if(K==='ORG')org=v.replace(/;/g,' ').trim()});
    const p=[...new Set(tel.map(t=>{let d=normDigits(t);if(d.startsWith('0098'))d='0'+d.slice(4);else if(d.startsWith('98')&&d.length===12)d='0'+d.slice(2);else if(d.length===10&&d[0]==='9')d='0'+d;return d}).filter(d=>d.length>=7))];

const MOVE={sale:{n:'فروش',s:-1},sample:{n:'نمونهٔ رایگان',s:-1},gift:{n:'هدیه',s:-1,give:1},nazr:{n:'نذری',s:-1,give:1},ehsan:{n:'احسان',s:-1,give:1},sadaqa:{n:'صدقه',s:-1,give:1},loss:{n:'ضایعات یا کسری',s:-1},ret:{n:'مرجوعی (برگشت به انبار)',s:1},lend:{n:'امانی یا قرضی دادم (کالا پس می‌گیرم)',s:-1},payback:{n:'پس دادن کالای امانی یا قرضی',s:-1},getback:{n:'پس گرفتن کالای امانی',s:1}};
function kindBal(){const r={};const bump=(p,l,q)=>{if(!p||!l)return;const k=l.product+'|'+l.unit;r[p]=r[p]||{};const o=r[p][k]=r[p][k]||{q:0,prod:l.product,unit:l.unit,vars:new Set()};o.q+=q;if(l.variety)o.vars.add(l.variety)};
  S.lots.filter(l=>!l.void&&l.source==='loan').forEach(l=>bump(l.supplierId||(l.supplierName?'n:'+l.supplierName:'n:بی‌نام'),l,-(Number(l.qty)||0)));
  S.moves.filter(m=>!m.void&&['lend','payback','getback'].includes(m.kind)).forEach(m=>{const q=Number(m.qty)||0;bump(m.personId||(m.toName?'n:'+m.toName:'n:بی‌نام'),byId('lots',m.lotId),m.kind==='getback'?-q:q)});
  Object.values(r).forEach(m=>Object.keys(m).forEach(k=>{if(Math.abs(m[k].q)<1e-9)delete m[k]}));Object.keys(r).forEach(p=>{if(!Object.keys(r[p]).length)delete r[p]});return r}
function priceNow(prod,unit){const c=[];S.quotes.filter(q=>q.product===prod&&(q.unit||'کیلو')===unit&&q.price).forEach(q=>c.push({d:q.date,p:q.price,c:q.currency}));
  S.moves.filter(m=>!m.void&&m.kind==='sale'&&m.price).forEach(m=>{const l=byId('lots',m.lotId);if(l&&l.product===prod&&l.unit===unit)c.push({d:m.date,p:m.price,c:m.currency})});

  const txt=t=>Object.entries(t).map(([k,q])=>{const [pr,u]=k.split('|');return fmtQ(q,u)+' '+pr}).join('، ');return{owe:txt(owe),due:txt(due)}}

  return h}

async function openFlow(flow,title,days,area){const dup=S.tasks.find(t=>t.status==='open'&&t.flow&&t.flow.kind===flow.kind&&t.flow.personId===flow.personId&&t.flow.product===flow.product);
  if(dup){await save('tasks',dup.id,{due:addDays(today(),days)});return}
  await save('tasks',null,{title,due:addDays(today(),days),priority:2,area,personId:flow.personId||'',dealId:'',note:'ساخته‌شده خودکار برای پیگیری تا نتیجه',status:'open',flow})}
async function closeFlows(pred,why){for(const t of S.tasks.filter(t=>t.status==='open'&&pred(t)))await save('tasks',t.id,{status:'done',doneAt:nowTs(),note:(t.note?t.note+' · ':'')+'بسته شد خودکار: '+why})}
function flowSummary(){const ot=openTasks().filter(t=>t.flow);const c=k=>ot.filter(t=>t.flow.kind===k).length;
  const recv=S.ledger.filter(l=>!l.void&&!l.settled&&l.kind==='receivable').length,pay=S.ledger.filter(l=>!l.void&&!l.settled&&l.kind==='payable').length;
  const short=S.lots.filter(l=>!l.void&&lotStat(l).rem<-1e-9);
  return{rows:[['quote_gave','قیمت داده‌شده، منتظر جواب',c('quote_gave'),'marketers','tag'],['quote_got','قیمت گرفته‌شده، منتظر تصمیم',c('quote_got'),'export','tag'],['sample','نمونهٔ داده‌شده، منتظر نظر',c('sample'),'sales','box'],['recv','فروش نسیه، منتظر دریافت',recv,'finance','finance'],['pay','خرید نسیه، منتظر پرداخت',pay,'finance','finance']].filter(r=>r[2]>0),short}}

const getAns=(hid,d)=>{const c=ciDoc(hid,d);return c&&c.days?c.days[d]:undefined};
const activeHabits=()=>S.habits.filter(h=>h.active!==false);
const hDays=h=>h.sched==='custom'?(h.wd||[]):(SCHED[h.sched||'all']||SCHED.all).d;
const onDay=(h,iso)=>hDays(h).includes(wdOf(iso));
const schedShort=h=>h.sched==='custom'?(h.wd||[]).map(w=>WD[w]).join('، '):(SCHED[h.sched||'all']||{}).s;
function missingDays(h){if(h.pausedUntil&&today()<=h.pausedUntil)return[];const out=[];const created=(h.created||nowTs()).slice(0,10);const start=addDays(created,-1);
  if(h.lite){let y=addDays(today(),-1);for(let k=0;k<6&&!onDay(h,y);k++)y=addDays(y,-1);let last='';try{last=localStorage.getItem('miz.lite.'+h.id)||''}catch(_){}if(y>=start&&getAns(h.id,y)===undefined&&(!last||diffDays(today(),last)>=3))out.push(y);return out}
  for(let i=1;i<=7;i++){const d=addDays(today(),-i);if(d<start)break;if(onDay(h,d)&&getAns(h.id,d)===undefined)out.push(d)}return out}
const dayWord=d=>{const n=diffDays(today(),d);return n===1?'دیروز':n===2?'پریروز':jNice(d)};
const qFor=(h,d)=>{const w=dayWord(d);return h.q.replace(/دیروز|دیشب/g,m=>m==='دیشب'&&w==='دیروز'?'دیشب':w==='دیروز'?m:(m==='دیشب'?'شبِ '+w:w))};
function ciQueue(){const q=[];
  activeHabits().forEach(h=>{const miss=missingDays(h);miss.forEach(d=>{const k='h:'+h.id+':'+d;if(!ciSnoozed.has(k))q.push({k,type:'habit',h,d,miss:miss.length,rank:diffDays(today(),d)===1?0:2})})});
  openTasks().filter(t=>t.priority==1&&t.due&&diffDays(today(),t.due)>=3).forEach(t=>{const k='t:'+t.id;if(!ciSnoozed.has(k))q.push({k,type:'task',t,rank:1})});
  return q.sort((a,b)=>a.rank-b.rank)}
let ciOpen=false,ciMode='all';
function openCheckin(force){if(!force){if(!document.getElementById('sheetRoot').hidden)return;let last=0;try{last=Number(localStorage.getItem('miz.ciLast')||0)}catch(_){}if(Date.now()-last<3*3600e3)return}
  const q=ciQueue();if(!q.length){if(force)toast('سؤال بی‌جوابی نمانده');return}
  ciMode=force?'all':'single';if(!force){try{localStorage.setItem('miz.ciLast',String(Date.now()))}catch(_){}}ciOpen=true;renderCheckin(q)}
function nextCheckin(){const q=ciQueue();if(!q.length){ciOpen=false;closeSheet();toast('چک‌این تمام شد');render();return}
  if(ciMode==='single'){ciOpen=false;closeSheet();render();toast(`ممنون. ${fa(q.length)} سؤال دیگر مانده؛ هر وقت خواستی از «امروز ← چک‌این»`);return}renderCheckin(q)}
function renderCheckin(q){const it=q[0];let body='';if(it.type==='habit'&&it.h.lite){try{localStorage.setItem('miz.lite.'+it.h.id,today())}catch(_){}}
  if(it.type==='habit'){const h=it.h,d=it.d;
    body=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${badge(h.area||'personal',h.icon||'personal')}<div><div style="font-weight:800;font-size:17px">${esc(qFor(h,d))}</div><div style="font-size:12.5px;color:var(--muted)">${esc(h.name)} · ${jShort(d)}${it.miss>1?` · <span style="color:var(--bad);font-weight:700">${fa(it.miss)} روز است ثبت نشده</span>`:''}</div></div></div>`;
    if(h.type==='sleep')body+=`<form data-form="ciTime" data-h="${h.id}" data-d="${d}"><div class="row2"><div class="fld"><label for="f_bed">ساعت خواب</label><input id="f_bed" type="time" value="23:30"></div><div class="fld"><label for="f_wake">ساعت بیداری</label><input id="f_wake" type="time" value="06:00"></div></div><button class="btn pri" style="width:100%">ثبت</button></form>`;
    else if(h.type==='number')body+=`<form data-form="ciNum" data-h="${h.id}" data-d="${d}"><div class="fld"><label for="f_cin">مقدار</label><input id="f_cin" inputmode="decimal"></div><button class="btn pri" style="width:100%">ثبت</button></form>`;
    else body+=`<div class="row2"><button class="btn pri" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="yes">بله ✓</button><button class="btn" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="no">نه</button></div>`;
    body+=`<div class="acts" style="margin-top:12px;justify-content:space-between"><button class="btn ghost" data-act="ciLater" data-k="${it.k}">بعداً بپرس</button><button class="btn ghost" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="skip">ول کن، نمی‌خوام بگم</button><button class="btn ghost danger" data-act="ciStop" data-h="${h.id}">دیگه اینو نپرس</button></div>${it.miss>1?`<button class="btn ghost" style="width:100%;margin-top:6px" data-act="ciSkipRest" data-h="${h.id}">${fa(it.miss-1)} روزِ قبل‌تر را ول کن، فقط همین را بپرس</button>`:''}`}
  else{const t=it.t;const n=diffDays(today(),t.due);
    body=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${badge(t.area||'affairs','warn')}<div><div style="font-weight:800;font-size:17px">${esc(t.title)}</div><div style="font-size:12.5px;color:var(--bad);font-weight:700">کار فوری · ${fa(n)} روز عقب افتاده</div></div></div>
    <div class="row2"><button class="btn pri" data-act="ciTask" data-id="${t.id}" data-v="done">انجام شد ✓</button><button class="btn" data-act="ciTask" data-id="${t.id}" data-v="1">فردا انجامش می‌دهم</button><button class="btn" data-act="ciTask" data-id="${t.id}" data-v="7">هفتهٔ بعد</button><button class="btn" data-act="ciLater" data-k="${it.k}">بعداً بپرس</button></div>
    <div class="acts" style="margin-top:10px;justify-content:space-between"><button class="btn ghost danger" data-act="ciTask" data-id="${t.id}" data-v="drop">ول کن، کنارش بگذار</button></div>`}
  openSheet(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="ab" style="--c:var(--a-sales)">${svg('bell')}</span><h3 style="margin:0;flex:1">چک‌این</h3><span class="pill">${ciMode==='single'?fa(q.length)+' سؤال مانده':fa(1)+' از '+fa(q.length)}</span></div>${body}`)}
async function skipRest(hid){const h=byId('habits',hid);const miss=missingDays(h).slice(1);const byM={};miss.forEach(d=>{(byM[monthKey(d)]=byM[monthKey(d)]||[]).push(d)});
  for(const [mk,ds] of Object.entries(byM)){const c=S.checkins.find(x=>x.habitId===hid&&x.month===mk);const days={...(c&&c.days||{})};ds.forEach(d=>days[d]='skip');
    if(c)await save('checkins',c.id,{days});else await putRaw('checkins',{id:hid+'_'+mk,habitId:hid,month:mk,days,created:nowTs(),updated:nowTs()})}
  if(mode==='local')render();nextCheckin()}
async function answerCheckin(hid,d,v){const c=ciDoc(hid,d);const days={...(c&&c.days||{}),[d]:v};
  if(c)await save('checkins',c.id,{days});else await putRaw('checkins',{id:hid+'_'+monthKey(d),habitId:hid,month:monthKey(d),days,created:nowTs(),updated:nowTs()});
  if(mode==='local')render();if(ciOpen)nextCheckin()}
const weekStart=iso=>{const [y,m,d]=iso.split('-').map(Number);const w=new Date(y,m-1,d).getDay();return addDays(iso,-((w+1)%7))};
function habitWeek(h){const ws=weekStart(today());let done=0,sum=0;for(let i=0;i<=diffDays(today(),ws);i++){const a=getAns(h.id,addDays(ws,i));if(a==='yes')done++;else if(h.type==='number'&&a&&a!=='skip'&&a!=='no')sum+=Number(a)||0}return h.type==='number'?sum:done}
function habitStreak(h){let n=0;for(let i=1;i<=400;i++){const a=getAns(h.id,addDays(today(),-i));if(a==='yes'||(h.type!=='yesno'&&a&&a!=='skip'&&a!=='no'))n++;else break}return n}
function sleepAvg(h,days=14){const v=[];for(let i=1;i<=days;i++){const a=getAns(h.id,addDays(today(),-i));if(a&&a.startsWith('{')){try{const o=JSON.parse(a);const t=x=>{const [H,M]=x.split(':').map(Number);return H*60+M};let b=t(o.bed),w=t(o.wake);if(b<w)b+=0;let dur=w-b;if(dur<=0)dur+=1440;v.push({b:t(o.bed)<720?t(o.bed)+1440:t(o.bed),w,dur})}catch(_){}}}
  if(!v.length)return null;const av=k=>v.reduce((a,x)=>a+x[k],0)/v.length;const hm=m=>{m=Math.round(m)%1440;return fa(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'))};return{bed:hm(av('b')),wake:hm(av('w')),dur:fa(Math.round(av('dur')/6)/10).replace('.','٫'),n:v.length}}
function habitsStrip(){const hs=activeHabits();if(!hs.length)return'';const q=ciQueue();
  return block('عادت‌ها',null,`<div class="list">${hs.map(h=>{const miss=missingDays(h).length;let right='';
    if(h.type==='sleep'){const a=sleepAvg(h,7);right=a?`<b>${a.dur} ساعت</b><div class="sub">میانگین ۷ شب</div>`:''}
    else{const w=habitWeek(h);right=`<b>${fa(w)}${h.target?' از '+fa(h.target):''}</b><div class="sub">این هفته</div>`}
    const st=habitStreak(h);
    return `<button class="row" data-act="editHabit" data-id="${h.id}">${badge(h.area||'personal',h.icon||'personal')}<div class="main"><div class="ttl">${esc(h.name)}</div><div class="sub">${h.pausedUntil&&today()<=h.pausedUntil?`<span class="pill">مکث تا ${jNice(h.pausedUntil)}</span>`:miss?`<span class="pill bad">${fa(miss)} روز بی‌جواب</span>`:'<span class="pill ok">به‌روز</span>'}${h.lite?'<span class="pill">کم‌پرسش</span>':''}${schedShort(h)?`<span class="pill">${esc(schedShort(h))}</span>`:''}${h.sched&&h.sched!=='all'&&onDay(h,today())?'<span class="pill acc">امروز نوبتشه</span>':''}${st>1?`<span>${fa(st)} روز پشت‌سرهم</span>`:''}</div></div><div class="end">${right}</div></button>`}).join('')}</div>`,q.length?`<button class="link" data-act="checkin">چک‌این (${fa(q.length)})</button>`:'')}
function habitsReport(){const hs=S.habits;if(!hs.length)return'';
  return `<div class="blk-h" style="margin-top:16px"><h2>عادت‌ها (۴ هفتهٔ اخیر)</h2></div><div class="list">${hs.map(h=>{let t='';
    if(h.type==='sleep'){const a=sleepAvg(h,28);t=a?`خواب ${a.bed} · بیداری ${a.wake} · ${a.dur} ساعت (${fa(a.n)} شب ثبت‌شده)`:'ثبت نشده'}
    else{const wk=[0,1,2,3].map(k=>{const ws=addDays(weekStart(today()),-7*k);let c=0;for(let i=0;i<7;i++){const a=getAns(h.id,addDays(ws,i));if(a==='yes')c++;else if(h.type==='number'&&a&&!['skip','no'].includes(a))c+=Number(a)||0}return c}).reverse();t=wk.map((c,i)=>`هفتهٔ ${['−۳','−۲','−۱','جاری'][i]}: ${fa(c)}${h.target?'/'+fa(h.target):''}`).join(' · ')}
    return `<div class="row">${badge(h.area||'personal',h.icon||'personal')}<div class="main"><div class="ttl">${esc(h.name)}</div><div class="sub"><span>${t}</span></div></div></div>`}).join('')}</div>`}

function captureGeo(){const m=document.getElementById('geoMsg');const no='موقعیت در این نما در دسترس نیست؛ در نسخهٔ نصبی روی گوشی کار می‌کند. فعلاً نام محل را بنویس.';

function stopAsk(hid){const h=byId('habits',hid);if(!h)return;

  const R=[['pause','موقتاً نمی‌توانم (سفر، بیماری، شلوغی)','دو هفته نمی‌پرسم؛ بعد خودکار برمی‌گردم.'],['less','زیاد می‌پرسد','فقط دربارهٔ دیروز، حداکثر هر ۳ روز یک بار؛ روزهای عقب‌افتاده را رها می‌کنم.'],['elsewhere','جای دیگری ثبتش می‌کنم','خاموش می‌شود.'],['private','نمی‌خواهم این ثبت شود','خاموش می‌شود.'],['quit','دیگر انجامش نمی‌دهم یا هدفم عوض شد','قبلش پیشنهاد می‌کنم هدف را به‌روز کنی.']];
  openSheet(`<h3>چرا دیگر نپرسم؟</h3><p style="font-size:14px;margin:0 0 10px">${why} دلیلت را بگو تا درست‌ترین کار را بکنم:</p>
  <div class="list">${R.map(([v,t,d])=>`<button class="row" data-act="stopWhy" data-h="${hid}" data-v="${v}"><div class="main"><div class="ttl">${t}</div><div class="sub"><span>${d}</span></div></div></button>`).join('')}</div>
  <div class="fld" style="margin-top:10px"><label for="f_why">یا دلیل خودت</label><input id="f_why"></div>
  <div class="acts"><button class="btn" data-act="stopWhy" data-h="${hid}" data-v="other">با این دلیل خاموش کن</button><button class="btn ghost" data-act="close">پشیمان شدم</button></div>`)}
async function stopWhy(hid,v){const h=byId('habits',hid);const done=m=>{toast(m);if(ciOpen)nextCheckin();else closeSheet()};
  if(v==='pause'){if(await save('habits',hid,{pausedUntil:addDays(today(),14),offReason:'مکث موقت'}))done('دو هفته نمی‌پرسم');return}
  if(v==='less'){if(await save('habits',hid,{lite:true}))done('کمتر می‌پرسم: فقط دیروز، هر ۳ روز');return}
  if(v==='quit'){openSheet(`<h3>قبل از خاموش کردن</h3><p style="font-size:14px">اگر هدف عوض شده، بهتر است هدف تازه را جایش بگذاری تا پیگیری قطع نشود (مثلاً به‌جای «باشگاه ۵ بار» بنویس «پیاده‌روی ۳ بار»).</p><div class="acts"><button class="btn pri" data-act="stopGoal" data-h="${hid}">هدف را عوض کن</button><button class="btn danger" data-act="stopWhy" data-h="${hid}" data-v="quit2">فقط خاموش کن</button></div>`);return}
  let reason={elsewhere:'جای دیگری ثبت می‌شود',private:'نمی‌خواهد ثبت شود',quit2:'دیگر انجام نمی‌دهد / هدف عوض شد'}[v];
  if(v==='other'){reason=val('f_why');if(reason.length<6)return toast('دلیل را کمی روشن‌تر بنویس تا قانع شوم')}
  if(await save('habits',hid,{active:false,offReason:reason,offAt:nowTs()}))done(`«${h.name}» دیگر پرسیده نمی‌شود؛ از «عادت‌ها» دوباره روشن می‌شود`)}

const ATYPE={A:{n:'دارایی',dr:1},L:{n:'بدهی',dr:0},E:{n:'سرمایه',dr:0},I:{n:'درآمد',dr:0},X:{n:'هزینه',dr:1}};
const COA=(()=>{const a=[['1101','نقد و بانک','A'],['1201','حساب‌های دریافتنی (طلب از اشخاص)','A'],['1301','موجودی کالا','A'],
  ['1202','طلب کالایی (امانی یا قرضی داده‌شده)','A'],['2101','حساب‌های پرداختنی (بدهی به اشخاص)','L'],['2102','بدهی کالایی (امانی یا قرضی گرفته‌شده)','L'],['3101','سرمایه','E'],['3201','برداشت شخصی','E']];
  CATS_IN.forEach((c,i)=>a.push(['41'+String(i+1).padStart(2,'0'),c==='عسل'?'فروش عسل':c,'I']));a.push(['4999','درآمد دسته‌بندی‌نشده','I']);
  a.push(['5001','بهای تمام‌شدهٔ کالای فروش‌رفته','X']);
  CATS_OUT.filter(c=>c!=='خرید و تأمین کالا'&&c!=='هزینهٔ شخصی').forEach((c,i)=>a.push(['51'+String(i+1).padStart(2,'0'),c,'X']));
  a.push(['5301','هدیه، نذری و خیرات','X'],['5302','ضایعات و کسری انبار','X'],['5303','سود یا زیان تغییر قیمت کالای امانی','X'],['5999','هزینهٔ دسته‌بندی‌نشده','X']);
  return a.map(([code,name,type])=>({code,name,type}))})();
const accBy=c=>COA.find(a=>a.code===c)||{code:c,name:'حساب '+c,type:'A'};
const LOAN=CATS_ALL[CATS_ALL.length-1];
function catAcc(cat,dir){ // dir: 'in' money/claim coming to me, 'out' going from me

  return dir==='in'?'4999':'5999'}
const L=(acc,dr,cr,personId)=>({acc,dr:dr||0,cr:cr||0,personId:personId||''});
function autoEntries(){const out=[];

    else if(l.kind==='paid')lines=settle?[L('2101',a,0,p),L('1101',0,a)]:[L(catAcc(l.category,'out'),a,0,p),L('1101',0,a)];
    else if(l.kind==='receivable')lines=l.category===LOAN?[L('1201',a,0,p),L('1101',0,a)]:[L('1201',a,0,p),L(catAcc(l.category,'in'),0,a)];
    else if(l.kind==='payable')lines=l.category===LOAN?[L('1101',a),L('2101',0,a,p)]:[L(catAcc(l.category,'out'),a),L('2101',0,a,p)];
    if(lines)out.push({date:l.date,created:l.created||'',cur:c,desc:`${LSHORT[l.kind]}${l.about?' · '+l.about:''}${p?' · '+pname(p):''}`,src:{col:'ledger',id:l.id},lines,warn:!l.category&&!settle?'بدون دسته':''})});
  S.lots.filter(l=>!l.void&&l.source==='loan'&&Number(l.cost)).forEach(l=>{const v=Number(l.cost)*Number(l.qty||0);if(v)out.push({date:l.date,created:l.created||'',cur:l.currency||'تومان',desc:`ورود امانی ${fmtQ(Number(l.qty),l.unit)} ${lotName(l)} از ${pname(l.supplierId)} (به ارزش روز)`,src:{col:'lots',id:l.id},lines:[L('1301',v),L('2102',0,v,l.supplierId)]})});
  S.moves.filter(m=>!m.void&&m.kind==='payback').forEach(m=>{const l=byId('lots',m.lotId);if(!l)return;const q=Number(m.qty)||0,p=m.personId;const v=Number(l.cost||0)*q;
    const ll=S.lots.filter(x=>!x.void&&x.source==='loan'&&x.supplierId===p&&x.product===l.product&&x.unit===l.unit&&Number(x.cost));const u=ll.length?ll.reduce((a,x)=>a+Number(x.cost)*Number(x.qty),0)/ll.reduce((a,x)=>a+Number(x.qty),0):0;const lv=u*q;if(!lv&&!v)return;
    const lines=[];if(lv)lines.push(L('2102',lv,0,p));if(v)lines.push(L('1301',0,v));const d=lv-v;if(Math.abs(d)>0.0001)lines.push(d>0?L('5303',0,d):L('5303',-d,0));

  S.moves.filter(m=>!m.void&&m.kind!=='payback').forEach(m=>{const l=byId('lots',m.lotId);if(!l||!Number(l.cost))return;const v=Number(l.cost)*Number(m.qty||0);if(!v)return;const c=l.currency||'تومان';
    const exp=m.kind==='sale'?'5001':MOVE[m.kind]&&MOVE[m.kind].give?'5301':m.kind==='loss'?'5302':m.kind==='sample'?'5301':null;
    let lines=null;if(m.kind==='ret')lines=[L('1301',v),L('5001',0,v)];else if(m.kind==='lend')lines=[L('1202',v,0,m.personId),L('1301',0,v)];else if(m.kind==='getback')lines=[L('1301',v),L('1202',0,v,m.personId)];else if(exp)lines=[L(exp,v),L('1301',0,v)];
    if(lines)out.push({date:m.date,created:m.created||'',cur:c,desc:`${(MOVE[m.kind]||{}).n} ${fmtQ(Number(m.qty),l.unit)} ${lotName(l)} به بهای خرید${m.personId||m.toName?' · '+whoOf(m):''}`,src:{col:'moves',id:m.id},lines})});
  S.vouchers.filter(v=>!v.void).forEach(v=>out.push({date:v.date,created:v.created||'',cur:v.currency||'تومان',desc:v.desc||'سند دستی',src:{col:'vouchers',id:v.id},lines:(v.lines||[]).map(x=>L(x.acc,Number(x.dr)||0,Number(x.cr)||0,x.personId)),manual:1}));
  out.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||'').localeCompare(b.created||''));
  const seq={};out.forEach(e=>{const y=jYear(e.date)||0;seq[y]=(seq[y]||0)+1;e.no=fa(y)+'/'+fa(String(seq[y]).padStart(3,'0'));const d=e.lines.reduce((s,x)=>s+x.dr-x.cr,0);if(Math.abs(d)>0.0001)e.unbal=d});

const amt=v=>MIL(accUI.cur)?nfmt(v/1e6,3):nfmt(v);

function readVLines(){const c=val('f_vcur')||'تومان';return [...document.querySelectorAll('.vline')].map(el=>({acc:el.querySelector('.v_acc').value,personId:el.querySelector('.v_p').value,dr:toBase(num(el.querySelector('.v_dr').value)||0,c),cr:toBase(num(el.querySelector('.v_cr').value)||0,c)})).filter(x=>x.acc&&(x.dr||x.cr))}
function vSum(){const b=document.getElementById('vsum');if(!b)return;const ls=readVLines();const d=ls.reduce((s,x)=>s+x.dr,0),c=ls.reduce((s,x)=>s+x.cr,0);const ok=Math.abs(d-c)<0.01&&d>0;
  b.style.background=ok?'var(--ok-soft)':'';b.style.color=ok?'var(--ok)':'';b.textContent=`جمع بدهکار ${amt(d)} · جمع بستانکار ${amt(c)}`+(ok?' ✓ تراز است':d||c?` · اختلاف ${amt(Math.abs(d-c))}`:'')}

    {const sm=S.moves.find(x=>!x.void&&x.kind===kind&&x.lotId===lotId&&Number(x.qty)===q&&(x.personId||x.toName||'')===(mv.personId||mv.toName||'')&&near(x.date,date,1));if(sm&&dupGuard(f,'m'+sm.id,`${esc(MOVE[kind].n)} ${fmtQ(q,l.unit)} ${esc(lotName(l))} به ${esc(whoOf(sm))} در ${jNice(sm.date)}`,true))return}
    if(!(await save('moves',null,mv)))return;
    if(kind==='sale'&&price>0&&pay!=='none')await save('ledger',null,{kind:pay==='cash'?'received':'receivable',personId:pid,amount:price*q,currency:cur,about:`فروش ${fmtQ(q,l.unit)} ${lotName(l)} (${l.code})`,category:PROD_CAT[l.product]||'سایر درآمد',instrument:pay==='barter'?'تهاتر (کالا یا خدمت)':'نقد/کارت',date,due:pay==='credit'?addDays(date,30):'',settled:false,void:false});
    if(kind==='sale'&&pid)await closeFlows(t=>t.flow&&t.flow.personId===pid&&t.flow.product===l.product&&(t.flow.kind==='quote_gave'||t.flow.kind==='sample'),'فروش ثبت شد');
    if(kind==='sample'&&pid)await openFlow({kind:'sample',personId:pid,product:l.product},`پیگیری نظر ${pname(pid)} دربارهٔ نمونهٔ ${lotName(l)}`,7,'sales');
    closeSheet();toast('ثبت شد'+(kind==='sale'&&price>0&&pay!=='none'?'؛ ردیف مالی هم ساخته شد':'')+(q>st.rem+1e-9&&kind!=='ret'?'؛ کسری انبار علامت خورد':''));return}
  if(k==='quote'){const pr=toBase(num(val('f_qpr')),val('f_qc'));if(!pr)return toast('قیمت را وارد کن');const date=readDate('f_qdate',true);if(date===null)return;
    const dir=val('f_qd'),pid=val('f_person'),prod=val('f_qp');if(!id){const sm=S.quotes.find(x=>x.dir===dir&&(x.personId||'')===(pid||'')&&x.product===prod&&Number(x.price)===pr&&near(x.date,date,3));if(sm&&dupGuard(f,'q'+sm.id,`همین قیمت ${money(sm.price,sm.currency)} برای ${esc(prod)} در ${jNice(sm.date)}`,false))return}
    if(await save('quotes',id,{dir,personId:pid,product:prod,variety:val('f_qv'),price:pr,unit:val('f_qu'),currency:val('f_qc'),date,note:val('f_qn')})){
      if(pid&&!id)await openFlow({kind:dir==='got'?'quote_got':'quote_gave',personId:pid,product:prod},dir==='got'?`تصمیم دربارهٔ خرید ${prod} از ${pname(pid)}`:`پیگیری قیمت ${prod} داده‌شده به ${pname(pid)}`,3,dir==='got'?'export':'sales');
      closeSheet();toast('قیمت ثبت شد'+(pid?'؛ پیگیری‌اش در کارها آمد':''))}return}
  if(k==='voidMove'){const r=val('f_vr');if(!r)return toast('دلیل لازم است');if(await save('moves',id,{void:true,voidReason:r,voidAt:nowTs()})){closeSheet();toast('باطل شد')}return}
  if(k==='void'){const r=val('f_vr');if(!r)return toast('دلیل لازم است');if(await save('ledger',id,{void:true,voidReason:r,voidAt:nowTs()})){closeSheet();toast('باطل شد؛ ردیف درست را دوباره ثبت کن')}return}
});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;try{localStorage.setItem('miz.tab',tab)}catch(_){}render();scrollTo(0,0)});
document.getElementById('fab').addEventListener('click',quickAdd);
document.getElementById('btnSearch').addEventListener('click',searchSheet);
document.getElementById('btnMenu').addEventListener('click',menuSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('sheetRoot').hidden)closeSheet()});

render();initDb().then(()=>setTimeout(()=>openCheckin(false),900));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mode)setTimeout(()=>openCheckin(false),400)});
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
