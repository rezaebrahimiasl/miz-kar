<style>
/* Layout: one-column mobile app — sticky header, scrolling view, bottom tab bar, floating add button, bottom sheets */
:root{

  --a-sales:#b26f06; --a-export:#17708f; --a-marketers:#8447b8; --a-finance:#2c7a4b; --a-therapy:#bd3458; --a-research:#3a57c0; --a-career:#56616b; --a-personal:#727314; --a-affairs:#8a6447; --a-akhirat:#0f7a6c;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#e3a03a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --ok:#6cc58f; --ok-soft:#1d3326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f08a80; --bad-soft:#3c1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --a-sales:#e8a744; --a-export:#5bb8d8; --a-marketers:#bc95ea; --a-finance:#6cc58f; --a-therapy:#f28ca6; --a-research:#93a9f4; --a-career:#a9b4be; --a-personal:#cdcb6c; --a-affairs:#d0ad8c; --a-akhirat:#5fcfbd;
}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --sunk:#232a26; --ink:#e6ebe7; --muted:#9aa69f; --line:#2c3430;
  --accent:#e3a03a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --ok:#6cc58f; --ok-soft:#1d3326; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#f08a80; --bad-soft:#3c1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --a-sales:#e8a744; --a-export:#5bb8d8; --a-marketers:#bc95ea; --a-finance:#6cc58f; --a-therapy:#f28ca6; --a-research:#93a9f4; --a-career:#a9b4be; --a-personal:#cdcb6c; --a-affairs:#d0ad8c; --a-akhirat:#5fcfbd;
}
*{box-sizing:border-box}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px;padding:0}

.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
details.more{border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:11px}details.more>summary{font-size:13px;color:var(--muted);cursor:pointer;padding:2px 0}details.more[open]>summary{margin-bottom:10px}
.banner svg{width:18px;height:18px;vertical-align:-4px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}

.ppw{position:relative}.ppw input{padding-inline-end:40px}.ppx{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;color:var(--muted);width:32px;height:32px}

.chip svg{width:14px;height:14px;vertical-align:-2px}
.dbox{display:flex;gap:6px;align-items:stretch}.dbox input{flex:1;min-width:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.dstep{flex:none;width:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.cal{border:1px solid var(--line);border-radius:12px;padding:8px;margin:6px 0;background:var(--surface)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.calh .dstep{height:34px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.calg i{font-style:normal;font-size:11.5px;color:var(--muted)}
.cd{border:0;background:var(--bg);border-radius:8px;padding:7px 0;font-size:13.5px}.cd.t{outline:1.5px solid var(--accent)}.cd.s{background:var(--accent);color:var(--accent-ink);font-weight:800}
.pill svg,.link svg{width:13px;height:13px;vertical-align:-2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 10px;display:flex;gap:9px;align-items:center;text-align:right;min-height:60px}
.tile b{display:block;font-size:13.5px;line-height:1.35}.tile small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.grp{font-size:12px;font-weight:800;color:var(--muted);margin:12px 2px 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;margin-top:14px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.stage{display:flex;gap:3px;margin-top:6px}
.stage i{height:4px;flex:1;border-radius:2px;background:var(--line)}

.amt-pos{color:var(--ok);font-weight:700}
.sg{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:15px;line-height:1;font-weight:800;color:#fff;margin-inline-end:5px;vertical-align:-3px}.sg.p{background:var(--ok)}.sg.n{background:var(--bad)}
.selbtn{width:100%;display:flex;align-items:center;gap:8px;justify-content:space-between;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:42px;font:inherit;color:inherit;direction:rtl}
.selbtn .sv{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selbtn .sv.ph{color:var(--muted)}.selbtn svg{width:18px;height:18px;flex:none;opacity:.6}
#pickRoot{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
#pickRoot .pk{background:var(--surface);width:100%;max-width:720px;max-height:80%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));direction:rtl;animation:up .16s ease-out}
#pickRoot .pkl{overflow:auto;margin-top:8px}

#pickRoot .pko{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:none;padding:12px 8px;border-radius:12px;font:inherit;color:inherit;border-bottom:1px solid var(--line)}
#pickRoot .pko[aria-selected=true]{background:var(--acc-soft,rgba(180,120,20,.12));font-weight:700}
#pickRoot .pko .ck{margin-inline-start:auto;color:var(--acc,#b07a12)}
.fmrow .seg{margin:6px 0 0;flex-wrap:wrap}.fmrow .seg button{flex:1 1 auto;font-size:12.5px;padding:6px 8px}
.hq{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font-weight:800;font-size:14px;margin-inline-start:6px;vertical-align:middle}
.prw{display:flex;gap:6px;margin-top:8px}.prw button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 2px;font:inherit;font-size:12px;line-height:1.3;color:var(--muted)}.prw button b{display:block;font-size:13px;color:var(--ink)}
.prw button[data-s="1"]{border-color:var(--a-personal);background:color-mix(in srgb,var(--a-personal) 12%,transparent)}.prw button[data-s="2"]{border-color:var(--ok);background:var(--ok-soft)}.prw button[data-s="3"]{border-color:var(--ok);background:var(--ok);color:#fff}.prw button[data-s="3"] b{color:#fff}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--a-personal)}
.cbar{display:flex;align-items:flex-end;gap:6px;height:130px;padding:16px 4px 0;border-bottom:1px solid var(--line)}.cbar .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}.cbar .c i{display:block;width:70%;max-width:28px;border-radius:4px 4px 0 0;background:var(--a-affairs);min-height:2px}.cbar .c b{font-size:11px;font-weight:600;margin-bottom:3px}.cx{display:flex;gap:6px;padding:4px 4px 0}.cx span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:6px 8px;align-items:center;font-size:13px}.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .b{height:10px;border-radius:0 4px 4px 0;min-width:2px}.hb .v{font-size:12.5px;font-weight:600}
.dl{font-size:11.5px;font-weight:700;margin-inline-start:4px}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.row input[type=checkbox],input.f_mod{width:22px;height:22px;min-height:0;flex:none;margin:0}
.wn-hero{border-radius:22px;padding:18px 16px;margin:-2px 0 12px;color:#fff;background:linear-gradient(135deg,#b26f06 0%,#d9901a 45%,#0f7a6c 100%);position:relative;overflow:hidden}.wn-hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}.wn-hero .v{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.3px}.wn-hero h4{margin:8px 0 2px;font-size:20px;line-height:1.5}.wn-hero p{margin:0;font-size:13px;opacity:.92}
.wn-rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}.wn-rail::-webkit-scrollbar{display:none}
.wn-card{flex:0 0 82%;scroll-snap-align:center;border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;animation:wnUp .35s ease-out both}.wn-card .ab{width:40px;height:40px}.wn-card b{font-size:15.5px}.wn-card p{margin:0;font-size:13.5px;line-height:1.85;color:var(--ink);flex:1}.wn-card .btn{align-self:flex-start}
.wn-dots{display:flex;justify-content:center;gap:5px;margin-bottom:6px}.wn-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.wn-dots i.on{width:18px;border-radius:4px;background:#b26f06}
.newdot{position:absolute;top:7px;inset-inline-end:7px;width:9px;height:9px;border-radius:50%;background:#d33f2f;box-shadow:0 0 0 2px var(--surface)}.tile{position:relative}

.void .ttl,.void .end{text-decoration:line-through;color:var(--muted)}
/* sheet */

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

<script>
/* ---------- Jalali calendar (jalaali-js algorithm) ---------- */
const J=(()=>{
  const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
  const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  function jalCal(jy){let bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
    for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
    n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
    leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
    if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
  function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
  function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}
  function toJ(gy,gm,gd){const jdn=g2d(gy,gm,gd);let jy=d2g(jdn).gy-621;const r=jalCal(jy);const f=g2d(r.gy,3,r.march);let k=jdn-f,jm,jd;
    if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd}}else k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
    jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}

})();
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const wdOf=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const SCHED={all:{n:'هر روز',s:'',d:[0,1,2,3,4,5,6]},even:{n:'روزهای زوج (شنبه، دوشنبه، چهارشنبه)',s:'زوج',d:[6,1,3]},odd:{n:'روزهای فرد (یکشنبه، سه‌شنبه، پنجشنبه)',s:'فرد',d:[0,2,4]},custom:{n:'روزهای دلخواه',s:'',d:[]}};
const REP={'':'بدون تکرار',daily:'هر روز',even:'روزهای زوج (شنبه، دوشنبه، چهارشنبه)',odd:'روزهای فرد (یکشنبه، سه‌شنبه، پنجشنبه)',weekly:'هر هفته',monthly:'هر ماه'};
const REPS={daily:'هر روز',even:'زوج',odd:'فرد',weekly:'هفتگی',monthly:'ماهانه'};
function nextOcc(base,rep){const t=today();let d=base>t?base:t;
  if(rep==='weekly'){d=base;do d=addDays(d,7);while(d<=t);return d}
  if(rep==='monthly'){d=base;do{const [y,m,dd]=d.split('-').map(Number);const j=J.toJ(y,m,dd);let jm=j.jm+1,jy=j.jy;if(jm>12){jm=1;jy++}const g=J.toG(jy,jm,Math.min(j.jd,jm<=6?31:jm<12?30:29));d=`${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`}while(d<=t);return d}
  const days=rep==='even'?[6,1,3]:rep==='odd'?[0,2,4]:[0,1,2,3,4,5,6];for(let i=0;i<14;i++){d=addDays(d,1);if(days.includes(wdOf(d)))return d}return addDays(t,1)}
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoOf(new Date());
const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1,d+n);return isoOf(x)};
const diffDays=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(a)-p(b))/864e5)};

function jShort(iso){if(!iso)return'';const j=jOf(iso);return fa(`${j.jy}/${pad(j.jm)}/${pad(j.jd)}`)}
function jNice(iso){if(!iso)return'';const t=today();const dd=diffDays(iso,t);
  if(dd===0)return'امروز';if(dd===1)return'فردا';if(dd===-1)return'دیروز';
  const j=jOf(iso);const s=`${fa(j.jd)} ${MONTHS[j.jm-1]}`;return j.jy===jOf(t).jy?s:s+' '+fa(j.jy)}
function jLong(iso){const [y,m,d]=iso.split('-').map(Number);const w=new Date(y,m-1,d).getDay();const j=J.toJ(y,m,d);return `${WD[w]} ${fa(j.jd)} ${MONTHS[j.jm-1]} ${fa(j.jy)}`}
function parseJ(s){s=en(String(s||'').trim());if(!s)return'';const t0=today(),tj=jOf(t0);
  if(/^امروز$/.test(s))return t0;if(/^دیروز$/.test(s))return addDays(t0,-1);if(/^پریروز$/.test(s))return addDays(t0,-2);if(/^فردا$/.test(s))return addDays(t0,1);
  let a,b,c;const mi=MONTHS.findIndex(m=>s.includes(m));
  if(mi>=0){const nums=(s.match(/\d+/g)||[]).map(Number);c=nums[0];b=mi+1;a=nums[1]||tj.jy;if(!c)return null}
  else{const parts=s.split(/[^0-9]+/).filter(Boolean);
    if(parts.length===1){const d=parts[0];if(d.length===8){a=+d.slice(0,4);b=+d.slice(4,6);c=+d.slice(6)}else if(d.length===6){a=1400+ +d.slice(0,2);b=+d.slice(2,4);c=+d.slice(4)}else if(d.length===4){a=tj.jy;b=+d.slice(0,2);c=+d.slice(2)}else if(d.length===3){a=tj.jy;b=+d.slice(0,1);c=+d.slice(1)}else if(d.length<=2){a=tj.jy;b=tj.jm;c=+d}else return null}
    else if(parts.length===2){a=tj.jy;b=+parts[0];c=+parts[1]}else if(parts.length===3){[a,b,c]=parts.map(Number);if(a<100)a+=1400}else return null}
  const max=b<=6?31:b<12?30:(jOf(jIso(a,12,30)).jd===30?30:29);if(b<1||b>12||c<1||c>max)return null;const g=J.toG(a,b,c);return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`}
const num=v=>{const x=Number(en(String(v??'')).replace(/٫/g,'.').replace(/[,٬،\s]/g,''));return isNaN(x)?null:x};
const MIL=c=>(c||'تومان')==='تومان';
const toBase=(x,c)=>x==null?x:(MIL(c)?Math.round(x*1e6):x);
const fromBase=(x,c)=>x==null||x===''?'':(MIL(c)?Math.round(Number(x)/1e6*1e6)/1e6:Number(x));
const nfmt=(v,d=2)=>fa(new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(v).replace(/,/g,'٬').replace('.','٫'));

const moneyFull=(v,c)=>{const a=Math.abs(Number(v)||0);if(MIL(c)&&a>=1e6)return nfmt(a/1e6,3)+' میلیون تومان';if(MIL(c)&&a>=1000)return nfmt(a/1000,1)+' هزار تومان';return nfmt(a)+' '+(c||'تومان')};
const moneyShort=()=>{try{return (S.meta.find(x=>x.id==='profile')||{}).mfmt!=='full'}catch(_){return true}};
const money=(v,c)=>{if(!moneyShort()||!MIL(c))return moneyFull(v,c);const a=Math.abs(Number(v)||0);if(a&&a<1000)return nfmt(a)+' تومان';return nfmt(a/1e6,3)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Domain model ---------- */
const AREAS={akhirat:'خیر و آخرت',sales:'فروش عسل و خدمات',export:'صادرات و بازرگانی',marketers:'بازاریاب‌ها و سایت‌ها',finance:'مالی',therapy:'درمان و مراجعین',research:'پژوهش و دکتری',career:'مسیر شغلی',personal:'شخصی و معنوی',affairs:'امور جاری'};

  sale:{n:'فروش داخلی',area:'sales',st:['تماس اول','نیازسنجی','پیشنهاد و قیمت','سفارش','پرداخت شد']},
  export:{n:'صادرات',area:'export',st:['شناسایی','احراز صلاحیت','نمونه','قیمت و شرایط','قرارداد','ارسال','دریافت وجه']},
  hive:{n:'خدمات کندو',area:'sales',st:['معرفی','بازدید','پیشنهاد','قرارداد سالانه','تمدید']},

const ROLES=['مشتری','بازاریاب','تأمین‌کننده','خریدار/واردکننده','مراجع','پژوهشی','کارفرما/هتلداری','خانواده','همکار','سایر'];

const catOptions=(cur,dir)=>{const g=(l,a)=>`<optgroup label="${l}">${a.map(c=>opt(c,c,cur)).join('')}</optgroup>`;const IN=g('درآمد',CATS_IN),OUT=g('هزینهٔ کسب‌وکار',CATS_OUT.filter(c=>c!=='هزینهٔ شخصی')),PERS=g('شخصی و خانواده (از سود کم نمی‌شود)',['هزینهٔ شخصی',...CATS_PERS]),NEU=g('نه درآمد نه هزینه',dir==='in'?[LOANC]:[LOANC,INVEST]);

/* Storage: inside Claude → private shared db; standalone on phone → IndexedDB (local-first) + file backup */
async function initDb(){
  const cl=window.claude;
  if(cl&&cl.use){db=await cl.use('db')}
  if(db){mode='cloud';
    COLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));if(c==='contacts')rebuildContacts();loaded.add(c);render()},e=>showConn('خطا در خواندن داده: '+e.code))});
    return}
  mode='local';
  try{idb=await new Promise((res,rej)=>{const r=indexedDB.open('miz-kar',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'k'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const all=await new Promise((res,rej)=>{const q=idb.transaction('docs').objectStore('docs').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
    all.forEach(x=>{if(S[x.col])S[x.col].push(x.doc)});rebuildContacts();COLS.forEach(c=>loaded.add(c));
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  }catch(e){showConn('حافظهٔ گوشی در دسترس نیست؛ داده‌ها ذخیره نمی‌شوند.')}
  render();
}

async function aiCall(sys,text,o={}){const a=AI();if(!a.key)throw new Error('nokey');const ac=new AbortController();const to=setTimeout(()=>ac.abort(),o.t||25000);
  try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(a.model||'gemini-2.5-flash')}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':a.key.trim()},signal:ac.signal,body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text}]}],generationConfig:{temperature:0.1,responseMimeType:'application/json'}})});
   const js=await r.json().catch(()=>({}));if(!r.ok)throw new Error((js.error&&js.error.message)||('HTTP '+r.status));const t=(((js.candidates||[])[0]||{}).content||{}).parts||[];const raw=t.map(p=>p.text||'').join('');return JSON.parse(raw.replace(/^```json|```$/g,'').trim())}
  finally{clearTimeout(to)}}
const aiErr=e=>{const m=String(e&&e.message||e);return m==='nokey'?'اول کلید را در «دستیار هوشمند» بگذار.':/abort/i.test(m)?'جواب نیامد؛ اینترنت یا فیلترشکن را بررسی کن.':/API key|PERMISSION|403|401/i.test(m)?'کلید پذیرفته نشد؛ کلید یا مدل را بررسی کن.':/Failed to fetch|NetworkError|Load failed/i.test(m)?'اتصال به جمینای ممکن نشد؛ اینترنت یا فیلترشکن را بررسی کن.':'خطا: '+m.slice(0,120)};
function matchPerson(n){n=(n||'').trim();if(!n)return '';const q=nrm(n);const P=S.people.filter(p=>p.status!=='archived');let p=P.find(x=>nrm(x.name)===q);if(p)return p.id;const ws=n.split(/\s+/).map(nrm).filter(w=>w.length>1);
  let best=null,bs=0;P.forEach(x=>{const k=nrm(x.name);const sc=ws.filter(w=>k.includes(w)).length;if(sc>bs){bs=sc;best=x}});return bs&&bs>=Math.min(ws.length,2)?best.id:(bs&&ws.length===1?best.id:'')}
function matchLot(desc,unit){const ws=wordsOf(desc).map(nrm);const L=S.lots.filter(l=>!l.void&&!isSup(l)&&lotStat(l).rem>0.0001);let best=null,bs=0;L.forEach(l=>{const k=nrm(lotName(l)+' '+(l.code||''));let sc=ws.filter(w=>k.includes(w)).length;if(unit&&l.unit===unit)sc+=.3;if(sc>bs||(sc===bs&&best&&(l.date||'')<(best.date||''))){bs=sc;best=l}});return bs>=1?best:null}
const jToday=()=>{const j=jOf(today());return `${j.jy}/${pad(j.jm)}/${pad(j.jd)}`};
const AI_PARSE=()=>`تو دستیار ثبت حساب و کار یک زنبوردار و بازرگان ایرانی هستی. جملهٔ کاربر (فارسی، شاید محاوره‌ای) را به JSON تبدیل کن. امروز ${jToday()} شمسی است.
فقط این JSON را برگردان:
{"intent":"sale|purchase|gift|nazr|ehsan|sadaqa|khums|sample|lend|received|paid|receivable|payable|referral|task|unknown","person":"نام طرف یا خالی","marketer":"","date":"YYYY/MM/DD شمسی یا خالی","pay":"cash|credit|barter|","items":[{"desc":"شرح کالا مثل عسل گون","qty":0,"unit":"کیلو|عدد|گرم|قوطی","price":0}],"amount":0,"about":"","title":"","due":"YYYY/MM/DD یا خالی"}

function aiApply(j,text){const pid=matchPerson(j.person),pn=(j.person||'').trim();const dt=j.date?parseJ(j.date)||today():today();const m=v=>toBase(Number(v)||0,'تومان');
  const items=(j.items||[]).filter(x=>x&&(x.desc||x.qty)).map(x=>{const l=matchLot(x.desc||'',x.unit);return{desc:x.desc||(l?lotName(l):''),qty:Number(x.qty)||'',unit:l?l.unit:(x.unit||'کیلو'),price:m(x.price),src:l?'lot':'',lotId:l?l.id:''}});
  const it=j.intent||'unknown';const pay={cash:'received',credit:'receivable',barter:'barter'}[j.pay]||'receivable';
  const after=()=>setTimeout(()=>{if(!pid&&pn){const q=document.getElementById('f_person_q');if(q&&!q.value){q.value=pn;try{ppSearch('f_person',pn)}catch(_){}}}toast('✨ فرم پر شد؛ نگاه کن و ثبت بزن')},120);
  if(it==='sale'||isGive(it)){formDoc({type:'invoice',inv:false,personId:pid,toName:pid?'':pn,date:dt,led:it==='sale'?pay:it,items:items.length?items:[{}]});return after()}

  if(['received','paid','receivable','payable'].includes(it)){formLedger({kind:it,personId:pid,about:j.about||text});setTimeout(()=>{const a=document.getElementById('f_amt');if(a&&j.amount)a.value=fa(j.amount);try{catAuto()}catch(_){}},60);return after()}
  if(it==='referral'){formRef({cust:pid,mkt:matchPerson(j.marketer),sale:j.amount?m(j.amount):items.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.price)||0),0),date:dt,note:j.about||''});return after()}
  if(it==='task'){formTask({title:j.title||text,due:j.due?parseJ(j.due)||'':'',personId:pid});return after()}
  const o=document.getElementById('aiOut');if(o)o.textContent='نفهمیدم چه نوع ثبتی است؛ کمی روشن‌تر بگو (مثلاً «فروختم»، «خریدم»، «دریافت کردم»، «یادم بنداز»).'}
/* Questions: Gemini turns the question into a small query; the query runs on the phone */
const AI_Q=()=>`پرسش کاربر دربارهٔ داده‌های حساب و کارش است. امروز ${jToday()} شمسی است. آن را به یک پرس‌وجو تبدیل کن و فقط این JSON را برگردان:
{"entity":"sales|purchases|gifts|ledger|balance|overdue|tasks|stock","metric":"sum|count|list|top","person":"","product":"","from":"YYYY/MM/DD یا خالی","to":"YYYY/MM/DD یا خالی","kind":"receivable|payable|received|paid|","status":"done|open|late|","group":"person|product|month|","explain":"یک جملهٔ کوتاه فارسی که بگوید چه چیزی حساب می‌شود"}
«پارسال» یعنی کل سال شمسی قبل، «امسال» از اول فروردین امسال، «ماه پیش» کل ماه شمسی قبل. بدهکاران/طلب‌ها=balance، سررسید گذشته=overdue، موجودی انبار=stock، هدیه و نذری=gifts.`;
async function aiAsk(q){openSheet(`<h3>${badge('research','star')} پرسش از داده‌ها</h3><form data-form="aiask"><div style="display:flex;gap:6px"><input id="f_aiq" value="${esc(q||"")}" style="flex:1;min-width:0" placeholder="مثلاً امسال چقدر عسل گون فروختم؟">${micBtn('f_aiq')}<button class="btn pri">بپرس</button></div></form><div id="aiAns" style="margin-top:10px"></div>`);if(q)aiAskRun(q)}
async function aiAskRun(q){const box=document.getElementById('aiAns');if(!aiOn()){box.innerHTML='<div class="empty">دستیار هوشمند روشن نیست. <button class="link" data-act="aiCfg">تنظیم</button></div>';return}box.innerHTML='<div class="hint">⏳ در حال فهمیدن پرسش…</div>';let Q;try{Q=await aiCall(AI_Q(),q)}catch(e){box.innerHTML=`<div class="empty">${esc(aiErr(e))}</div>`;return}box.innerHTML=aiRun(Q)}
function aiRun(Q){const from=Q.from?parseJ(Q.from)||'':'',to=Q.to?parseJ(Q.to)||'':'';const inR=d=>(!from||(d||'')>=from)&&(!to||(d||'')<=to);const pid=Q.person?matchPerson(Q.person):'';const pq=nrm(Q.product||'');const okP=l=>!pq||nrm(lotName(l)).includes(pq);const who=m=>m.personId?pname(m.personId):(m.toName||'—');
  const T=(head,rows)=>`<div class="tbl stmt" style="border-radius:12px;margin-top:8px"><table><thead><tr>${head.map((h,i)=>`<th${i?'':' class="ds"'}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?'':' class="ds"'}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const grp=(arr,key,val,qv)=>{const g={};arr.forEach(x=>{const k=key(x);const o=g[k]=g[k]||{v:0,q:0,n:0};o.v+=val(x);o.q+=qv?qv(x):0;o.n++});return Object.entries(g).sort((a,b)=>b[1].v-a[1].v)};
  const kOf=Q.group==='person'?who:Q.group==='product'?(m=>lotName(byId('lots',m.lotId))):Q.group==='month'?(m=>{const j=jOf(m.date);return fa(j.jy)+'/'+fa(pad(j.jm))}):null;
  let h=`<div class="hint" style="font-size:12.5px">برداشت من: ${esc(Q.explain||'')}${pid?' · '+esc(pname(pid)):Q.person?' · «'+esc(Q.person)+'» در افراد پیدا نشد':''}${from||to?' · '+(from?jShort(from):'…')+' تا '+(to?jShort(to):'امروز'):''}</div>`;
  if(['sales','gifts'].includes(Q.entity)){const M=S.moves.filter(m=>!m.void&&(Q.entity==='sales'?m.kind==='sale':isGive(m.kind))&&inR(m.date)&&(!pid||m.personId===pid)&&(()=>{const l=byId('lots',m.lotId);return l&&okP(l)})());
    const qty={};M.forEach(m=>{const l=byId('lots',m.lotId);qty[l.unit]=(qty[l.unit]||0)+Number(m.qty||0)});const amt=M.reduce((a,m)=>a+Number(m.qty||0)*Number(m.price||0),0);
    h+=`<div class="kpis"><div class="kpi"><div class="l">${Q.entity==='sales'?'فروش':'هدیه و نذری'}</div><div class="v">${Object.entries(qty).map(([u,v])=>fmtQ(Math.round(v*100)/100,u)).join(' + ')||'۰'}</div></div>${Q.entity==='sales'?`<div class="kpi"><div class="l">مبلغ (میلیون)</div><div class="v amt-pos">${amtC(amt,'تومان')||'۰'}</div></div>`:''}<div class="kpi"><div class="l">دفعات</div><div class="v">${fa(M.length)}</div></div></div>`;
    if(kOf)h+=T([Q.group==='person'?'طرف':Q.group==='product'?'کالا':'ماه','مقدار','مبلغ'],grp(M,kOf,m=>Number(m.qty||0)*Number(m.price||0),m=>Number(m.qty||0)).map(([k,o])=>[esc(k),fa(Math.round(o.q*100)/100),amtC(o.v,'تومان')||'—']));
    else if(Q.metric==='list'||M.length<=15)h+=T(['شرح','تاریخ','مبلغ'],M.slice(-40).reverse().map(m=>[esc(fmtQ(Number(m.qty),(byId('lots',m.lotId)||{}).unit||'')+' '+lotName(byId('lots',m.lotId))+' · '+who(m)),jShort(m.date),amtC(Number(m.qty||0)*Number(m.price||0),'تومان')||'—']));return h}

/* What is really left on each credit row: linked settlements (refId) first, then general payments to/from the same person (settles) oldest-due first */
let _remK='',_remC={};
function remMap(){const k=S.ledger.length+'|'+S.ledger.reduce((a,l)=>a+(l.updated||'').length+(l.void?1:0),0);if(k===_remK)return _remC;const R={},G={};

  Object.values(G).forEach(L=>{const open={receivable:[],payable:[]};let pool={receivable:0,payable:0};
    const ids=new Set(L.filter(l=>l.kind==='receivable'||l.kind==='payable').map(l=>l.id));
    L.forEach(l=>{if((l.kind==='receivable'||l.kind==='payable')){const linked=L.filter(x=>x.refId===l.id).reduce((a,x)=>a+Number(x.amount||0),0);R[l.id]=l.settled?0:Math.max(0,Number(l.amount)-linked);if(R[l.id]>0)open[l.kind].push(l)}else if((l.settles&&!l.refId)||(l.refId&&!ids.has(l.refId))){pool[l.kind==='received'?'receivable':'payable']+=Number(l.amount||0)}});
    const take=(kd,p)=>{open[kd].sort((a,b)=>(a.due||a.date||'').localeCompare(b.due||b.date||''));for(const l of open[kd]){if(p<=0.5)break;const t=Math.min(p,R[l.id]);R[l.id]-=t;p-=t}};
    take('receivable',pool.receivable);take('payable',pool.payable);
    const sR=open.receivable.reduce((a,l)=>a+R[l.id],0),sP=open.payable.reduce((a,l)=>a+R[l.id],0),net=Math.min(sR,sP);if(net>0.5){take('receivable',net);take('payable',net)}});
  _remK=k;_remC=R;return R}
const remOf=l=>{const r=remMap()[l.id];return r==null?Number(l.amount)||0:r};

function guessDate(t){const s=today();if(/پس.?فردا/.test(t))return addDays(s,2);if(/فردا/.test(t))return addDays(s,1);if(/امروز|امشب/.test(t))return s;if(/هفته.?(بعد|آینده)/.test(t))return addDays(s,7);if(/ماه.?(بعد|آینده)/.test(t))return addDays(s,30);
  const m=en(t).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);if(m){const r=parseJ(m[0]);if(r)return r}
  const mm=t.match(new RegExp('([۰-۹\\d]{1,2})\\s*('+MONTHS.join('|')+')'));if(mm){const d=Number(en(mm[1])),mo=MONTHS.indexOf(mm[2])+1;let jy=jOf(s).jy;let iso=jIso(jy,mo,d);if(iso<s)iso=jIso(jy+1,mo,d);return iso}
  for(const [w,n] of Object.entries(WDI).sort((a,b)=>b[0].length-a[0].length))if(new RegExp('(^|\\s)'+w+'(\\s|$)').test(t)){for(let i=1;i<=7;i++){const d=addDays(s,i);if(wdOf(d)===n)return d}}
  return ''}
function parseTaskList(txt){let tag='',area='';const out=[];
  txt.split('\n').forEach(raw=>{let l=raw.trim();if(!l)return;
    const h=l.match(/^#?\s*([^:：]{1,40})[:：]\s*$/)||l.match(/^#\s*(\S.{0,39})$/);if(h){tag=h[1].trim();area=guessArea(tag);return}
    l=l.replace(/^([-–•*▪●◦]|[۰-۹\d]+[.)\-])\s*/,'');if(!l)return;
    let pri=3;if(/(^|\s)!+(\s|$)|فوری/.test(l))pri=1;else if(/(^|\s)مهم(\s|$)/.test(l))pri=2;l=l.replace(/(^|\s)!+(?=\s|$)/g,' ');
    let city='';l=l.replace(/@(\S+)/,(_,c)=>{city=c;return ''});let tg=tag;l=l.replace(/#(\S+)/,(_,c)=>{tg=c;return ''});
    const rep=/هر روز/.test(l)?'daily':/روزهای زوج|(^|\s)زوج(\s|$)/.test(l)?'even':/روزهای فرد|(^|\s)فرد(\s|$)/.test(l)?'odd':/هر هفته|هفتگی/.test(l)?'weekly':/هر ماه|ماهانه/.test(l)?'monthly':'';
    const title=l.replace(/\s+/g,' ').trim();if(!title)return;
    out.push({title,tag:tg,area:(tg!==tag?guessArea(tg):'')||area||guessArea(title)||'',due:guessDate(title),priority:pri,city,repeat:rep})});
  return out}

/* ---------- Automatic encrypted backup to a private GitHub repository (no app registration needed) ---------- */
const GH={get cfg(){try{return JSON.parse(localStorage.getItem('miz.gh')||'{}')}catch(_){return{}}},set cfg(v){try{localStorage.setItem('miz.gh',JSON.stringify(v))}catch(_){}}};
let ghDirty=false,ghBusy=false;
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ghKey(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function ghPack(obj,pass){const txt=JSON.stringify(obj);if(!pass)return txt;const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await ghKey(pass,salt),new TextEncoder().encode(txt)));return JSON.stringify({app:'miz-kar-enc',v:1,salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)})}
async function ghUnpack(txt,pass){const j=JSON.parse(txt);if(j.app!=='miz-kar-enc')return j;if(!pass)throw new Error('این پشتیبان رمز دارد؛ رمز را در تنظیمات بنویس');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(j.iv)},await ghKey(pass,b64d(j.salt)),b64d(j.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function ghApi(path,opt={}){const c=GH.cfg;const r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/'+path,{...opt,headers:{Authorization:'Bearer '+c.token,Accept:opt.raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});return r}

/* ---------- Calendar feed: tasks, follow-ups and occasions as an .ics in a secret gist; Google Calendar subscribes by URL ---------- */
function calFeed(){const ev=[];const st=x=>x.replace(/-/g,'');const esc2=t=>String(t||'').replace(/[\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');const stamp=nowTs().replace(/[-:]/g,'').slice(0,15)+'Z';
  const add=(uid,iso,title,desc)=>ev.push(['BEGIN:VEVENT','UID:'+uid+'@miz-kar','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+st(iso),'DTEND;VALUE=DATE:'+st(addDays(iso,1)),'SUMMARY:'+esc2(title),desc?'DESCRIPTION:'+esc2(desc):'','TRANSP:TRANSPARENT','END:VEVENT'].filter(Boolean).join('\r\n'));
  const from=addDays(today(),-30);
  openTasks().filter(t=>t.due&&t.due>=from&&!t.caseId).forEach(t=>add('t-'+t.id,t.due,(t.priority==1?'❗ ':'')+t.title,[t.personId?'با: '+pname(t.personId):'',t.city?'شهر: '+t.city:'',t.note||''].filter(Boolean).join('\n')));
  openDeals().filter(d=>d.nextDate&&d.nextDate>=from).forEach(d=>add('d-'+d.id,d.nextDate,'قدم بعد: '+(d.nextStep||d.title),d.title));
  S.ledger.filter(l=>!l.void&&!l.settled&&(l.kind==='receivable'||l.kind==='payable')&&l.due&&l.due>=from).forEach(l=>add('l-'+l.id,l.due,(l.kind==='receivable'?'سررسید طلب از ':'سررسید بدهی به ')+(pname(l.personId)||l.about||''),''));
  const tj=jOf(today()).jy;S.people.filter(p=>p.status!=='archived').forEach(p=>(p.occ||[]).forEach((o,i)=>{if(!o.m||!o.d)return;for(const jy of [tj,tj+1]){const iso=jIso(jy,o.m,o.d);if(iso>=from)add('o-'+p.id+'-'+i+'-'+jy,iso,'🎉 '+o.t+' '+p.name+(o.y?' ('+(jy-o.y)+' سالگی)':''),p.phone||'')}}));

const MY_NAMES=['رضا ابراهیمی اصل','رضا ابراهیمی‌اصل','رضا ابراهیمی'];
function parseBank(raw){const t=en(String(raw||'')).replace(/‌/g,' ').replace(/[ \t]+/g,' ');const L=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);const r={raw};
  let best=0,unit='';for(const m of t.matchAll(/(\d{1,3}(?:[,٬]\d{3})+|\d{4,})\s*(ریال|تومان)?/g)){const n=Number(m[1].replace(/[,٬]/g,''));if(m[2]&&n>best){best=n;unit=m[2]}}
  if(!best){for(const m of t.matchAll(/(?:مبلغ|مبلغ انتقال|برداشت|واریز)[^\d]{0,12}(\d[\d,٬]{3,})/g)){const n=Number(m[1].replace(/[,٬]/g,''));if(n>best){best=n;unit='ریال'}}}
  r.toman=best?(unit==='تومان'?best:Math.round(best/10)):0;
  const lab=(re)=>{for(let i=0;i<L.length;i++){const m=L[i].match(re);if(m)return (m[1]||L[i+1]||'').trim()}return''};
  r.ref=(lab(/(?:شماره پیگیری|کد پیگیری|پیگیری)\s*[:：]?\s*(\d{4,})?\s*$/)||lab(/(?:شماره مرجع|مرجع)\s*[:：]?\s*(\d{4,})?\s*$/)).replace(/\D/g,'');
  const from=lab(/(?:انتقال دهنده|انتقال‌دهنده|فرستنده|واریزکننده)\s*[:：]?\s*(.*)$/),to=lab(/(?:گیرنده|به نام|دریافت کننده|مقصد)\s*[:：]?\s*([^\d].*)$/);
  const mine=x=>MY_NAMES.some(n=>nrm(x).includes(nrm(n)));
  if(/واریز|دریافت شد|به حساب شما|\+\s*\d/.test(t)&&!/برداشت|خرید|انتقال موفق/.test(t))r.dir='in';else if(from&&!mine(from))r.dir='in';else r.dir='out';
  let who=r.dir==='in'?(from&&!mine(from)?from:''):(to&&!mine(to)?to:'');
  if(!who){const labels=/زمان|تاریخ|مبلغ|انتقال|روش|سپرده|کارت|شماره|پیگیری|مرجع|ریال|تومان|موفق|بانک|مانده|حساب|ساعت|blu|transfer/i;who=(L.find(x=>/^[؀-ۿ ]{4,40}$/.test(x)&&!labels.test(x)&&!mine(x))||'')}
  r.who=who.replace(/\s+/g,' ').trim();
  r.method=['کارت به کارت','پایا','ساتنا','پل','خرید','انتقال'].find(k=>t.includes(k))||'';
  const dm=t.match(/(\d{1,2})\s*(فروردین|اردیبهشت|خرداد|تیر|مرداد|شهریور|مهر|آبان|آذر|دی|بهمن|اسفند)\s*(\d{4})?/)||t.match(/(1[34]\d\d)[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  r.date=dm?(parseJ(dm[0])||today()):today();r.bank=/blu|بلو/i.test(t)?'بلوبانک':(t.match(/بانک\s*(\S+)/)||['',''])[1]?('بانک '+t.match(/بانک\s*(\S+)/)[1]):'';
  return r}

/* ---------- Recurring payments (scheduled transactions, YNAB-style): bank auto-pays get confirmed, manual ones become tasks ---------- */
const RPER={daily:'هر روز',weekly:'روزهای مشخص هفته',monthly:'روزهای مشخص ماه',yearly:'هر سال'};
function recurNext(r,after){if(r.per==='daily')return addDays(after,1);
  if(r.per==='yearly'){const j=jOf(after);let x=jIso(j.jy,Number(r.mon||1),Number(r.day||1));if(x<=after)x=jIso(j.jy+1,Number(r.mon||1),Number(r.day||1));return x}
  const wds=(r.wds&&r.wds.length?r.wds:[Number(r.wd??6)]).map(Number),dys=(r.days&&r.days.length?r.days:[Number(r.day||1)]).map(Number);
  let d=after;for(let i=0;i<400;i++){d=addDays(d,1);if(r.per==='weekly'?wds.includes(wdOf(d)):dys.includes(Math.min(jOf(d).jd,31))||(dys.some(x=>x>=30)&&jOf(addDays(d,1)).jd===1&&dys.some(x=>x>jOf(d).jd)))return d}return addDays(after,30)}
async function recurRun(){const t=today();for(const r of S.recurs.filter(x=>x.active!==false)){let last=r.lastGen||addDays(r.from||t,-1);let n=0;
    let left=r.left==null||r.left===''?null:Number(r.left);while(n<62){if(left!==null&&left<=0)break;const d=recurNext(r,last);if(d>t)break;n++;last=d;if(left!==null)left--;
      const nth=r.total&&left!==null?` (قسط ${fa(r.total-left)} از ${fa(r.total)})`:'';const dir=r.dir||'out',base={acct:dir==='behalf'?'':(r.bank||''),personId:r.personId||'',amount:Number(r.amount)||0,currency:'تومان',instrument:'حواله',date:d,settled:false,void:false,recurId:r.id,created:nowTs(),updated:nowTs()},ab=r.title+(r.toName?' · '+r.toName:'')+nth;
      if(dir==='behalf'){const pair=newId();await putRaw('ledger',{...base,id:newId(),kind:'received',about:'کمک: '+ab,category:'هدیه و کمک دریافتی',pending:r.confirm!==false,pairId:pair,evidence:'پرداخت مستقیم به جای من'});await putRaw('ledger',{...base,id:newId(),kind:'paid',about:ab,category:r.cat||'',pending:r.confirm!==false,pairId:pair,evidence:'پرداخت مستقیم به جای من'})}
      else if(r.auto)await putRaw('ledger',{...base,id:newId(),kind:dir==='in'?'received':'paid',about:ab,category:r.cat||'',pending:r.confirm!==false,evidence:(r.bank||'')+(dir==='in'?' · واریز دوره‌ای':' · پرداخت خودکار')});
      else await putRaw('tasks',{id:newId(),title:(dir==='in'?'دریافت: ':'پرداخت: ')+r.title,due:d,start:addDays(d,-Number(r.lead||3)),priority:2,area:'finance',personId:r.personId||'',payAmt:Number(r.amount)||0,payCat:r.cat||'',payKind:dir==='in'?'received':'paid',recurId:r.id,status:'open',created:nowTs(),updated:nowTs()})}
    if(n)await save('recurs',r.id,{lastGen:last,...(left!==null?{left,active:left>0}:{})});if(n&&left===0)toast('آخرین قسط «'+r.title+'» ثبت شد؛ تمام شد 🎉')}
  if(mode==='local')render()}

/* ---------- Picker: every <select> opens a right-to-left bottom list with search ---------- */
const chevDown='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
let _selN=0;
function selLabel(sel){const o=sel.options[sel.selectedIndex];return o?o.textContent:''}
function syncSel(sel){const b=sel._pb;if(!b)return;const t=selLabel(sel),ph=!sel.value&&/^[—\-\s]|انتخاب/.test(t);b.querySelector('.sv').textContent=t||'— انتخاب کن —';b.querySelector('.sv').classList.toggle('ph',ph);b.hidden=sel.hidden;b.disabled=sel.disabled}
function enhanceSelects(root){(root||document).querySelectorAll('select:not([multiple]):not([data-enh])').forEach(sel=>{sel.dataset.enh='1';if(!sel.id)sel.id='sel'+(++_selN);
  const b=document.createElement('button');b.type='button';b.className='selbtn';b.dataset.act='pick';b.dataset.for=sel.id;b.innerHTML='<span class="sv"></span>'+chevDown;sel.after(b);sel.style.display='none';sel._pb=b;syncSel(sel);
  sel.addEventListener('change',()=>syncSel(sel));new MutationObserver(()=>syncSel(sel)).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','disabled']})})}
setInterval(()=>document.querySelectorAll('select[data-enh]').forEach(syncSel),700);
new MutationObserver(()=>enhanceSelects()).observe(document.documentElement,{childList:true,subtree:true});
function pickOpen(sel){if(!sel)return;const lab=(document.querySelector(`label[for="${sel.id}"]`)||{}).textContent||sel.closest('.fld')?.querySelector('label')?.textContent||'انتخاب کن';
  const items=[];[...sel.children].forEach(ch=>{if(ch.tagName==='OPTGROUP'){items.push({g:ch.label});[...ch.children].forEach(o=>!o.hidden&&!o.disabled&&items.push({v:o.value,t:o.textContent}))}else if(!ch.hidden&&!ch.disabled)items.push({v:ch.value,t:ch.textContent})});
  const many=items.filter(x=>x.t!=null).length>7;let r=document.getElementById('pickRoot');if(!r){r=document.createElement('div');r.id='pickRoot';document.body.appendChild(r)}
  const draw=q=>{const qn=nrm(q||'');let h='',lastG=null,pend=null;items.forEach(x=>{if(x.g!=null){pend=x.g;return}if(qn&&!nrm(x.t).includes(qn))return;if(pend!==lastG&&pend!=null){h+=`<div class="pkg">${esc(pend)}</div>`;lastG=pend}h+=`<button type="button" class="pko" data-v="${esc(x.v)}" aria-selected="${x.v===sel.value}"><span>${esc(x.t)}</span>${x.v===sel.value?'<span class="ck">✓</span>':''}</button>`});return h||'<div class="empty">چیزی پیدا نشد</div>'};
  r.innerHTML=`<div class="pk" role="dialog" aria-modal="true"><div class="grab"></div><div style="font-weight:700;font-size:15px">${esc(lab.trim())}</div>${many?'<input class="search-in" id="pkq" placeholder="جستجو…" autocomplete="off" style="margin-top:8px">':''}<div class="pkl">${draw('')}</div></div>`;r.hidden=false;
  r.onclick=e=>{const o=e.target.closest('.pko');if(o){sel.value=o.dataset.v;sel.dispatchEvent(new Event('change',{bubbles:true}));sel.dispatchEvent(new Event('input',{bubbles:true}));syncSel(sel);r.hidden=true;r.innerHTML='';return}if(e.target===r){r.hidden=true;r.innerHTML=''}};
  const q=document.getElementById('pkq');if(q)q.oninput=()=>{r.querySelector('.pkl').innerHTML=draw(q.value)};
  const cur=r.querySelector('.pko[aria-selected=true]');if(cur)cur.scrollIntoView({block:'center'})}

const CATALOG=[['کار و زمان',[['today','امروز','tab','today'],['period','گزارش هفته و ماه','periodRep'],['wins','دستاوردها و بینش‌ها','wins'],['search','جستجو و پرسش','search'],['fm','برنامه‌ام به هم خورد','fmajeure'],['trip','سفر','newTrip']]],['پول',[['money','زبانهٔ پول','tab','money'],['cheques','چک‌ها','chequesSheet'],['docs','نامه، قرارداد و فاکتور','docsSheet'],['ledger','طلب، بدهی، دریافت و پرداخت','new','ledger'],['recur','پرداخت و دریافت دوره‌ای','recurs'],['net','سود یا درآمد خالص','netForm'],['accounting','دفاتر حسابداری','accOpen'],['reports','گزارش‌های مالی و فروش','reports'],['marketers','بازاریاب‌ها و پورسانت','marketers'],['tbook','دفتر کارها','tbook'],['ai','دستیار هوشمند (جمینای)','aiCfg'],['aiask','پرسش هوشمند از داده‌ها','aiAskQ']]],['کسب‌وکار',[['stock','انبار، فروش و قیمت','tab','biz'],['apiary','دفتر زنبورداری','apiary']]],['درمان و زندگی',[['ibadat','عبادات و معنویت','ibadat'],['cases','پرونده‌های درمانی','clinic'],['vault','گاوصندوق','vault'],['backup','پشتیبان','backupSheet'],['profile','نمایه و تنظیمات','profile']]]];
function helpSheet(){const HM2={cheques:'cheques',docs:'docs',trip:'trips',recur:'recurs',accounting:'acc',stock:'stock',apiary:'apiary',cases:'clinic',vault:'vault',ibadat:'ibadat',wins:'wins',period:'wins'};openSheet(`<h3>${badge('affairs','book')} راهنما و فهرست امکانات</h3><p class="hint" style="font-size:12.5px;color:var(--muted);margin-top:0">هر بخش یک خط توضیح دارد؛ «باز کن» مستقیم می‌بردت آنجا. در خود فرم‌ها هم دکمهٔ ؟ کنار عنوان هست.</p>${CATALOG.map(([g,arr])=>`<div class="grp">${g}</div><div class="list">${arr.filter(([k])=>!HM2[k]||on(HM2[k])).map(([k,t,act,v])=>`<div class="row" style="flex-wrap:wrap;cursor:default"><div class="main"><div class="ttl">${esc(t)}</div><div class="sub" style="display:block;font-size:13px;line-height:1.8">${esc(HELP[k][1])}</div></div><div class="acts" style="width:100%;margin-top:6px"><button class="btn" data-act="${act}" ${v?`data-v="${v}"`:''}>باز کن</button></div></div>`).join('')}</div>`).join('')}<div class="acts" style="margin-top:12px"><button class="btn ghost" data-act="close">بستن</button></div>`)}

/* ---------- Worship: prayers, fasting (Hijri calendar), Quran, kinship, charity, sincerity ---------- */
const HM=['محرم','صفر','ربیع‌الاول','ربیع‌الثانی','جمادی‌الاول','جمادی‌الثانی','رجب','شعبان','رمضان','شوال','ذی‌القعده','ذی‌الحجه'];
const PRAY=[['fajr','صبح'],['dhuhr','ظهر و عصر'],['maghrib','مغرب و عشا']];const PRK=PRAY.map(x=>x[0]);
const PST=['—','خواندم','اول وقت','جماعت / مسجد'];
function hij(iso){const off=Number(PROF().hoff??-1)||0;const d=new Date(addDays(iso,off)+'T12:00:00');let parts;try{parts=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d)}catch(_){parts=new Intl.DateTimeFormat('en-u-ca-islamic',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d)}
  const g=t=>Number((parts.find(x=>x.type===t)||{}).value);return{d:g('day'),m:g('month'),y:parseInt((parts.find(x=>x.type==='year')||{}).value)}}
const hijTxt=iso=>{const h=hij(iso);return fa(h.d)+' '+HM[h.m-1]+' '+fa(h.y)};
function hSpecial(iso){const {d,m}=hij(iso);const o=[];const A=(t,f)=>o.push({t,f});
  if(m===9)A('ماه رمضان','wajib');
  if(m===10&&d===1)A('عید فطر','haram');if(m===12&&d===10)A('عید قربان','haram');
  if(m===7&&d===1)A('اول رجب','mostahab');if(m===7&&d===27)A('عید مبعث','mostahab');if(m===8&&d===15)A('نیمهٔ شعبان','mostahab');
  if(m===11&&d===25)A('دحوالارض','mostahab');if(m===12&&d>=1&&d<=8)A('دههٔ اول ذی‌الحجه','mostahab');if(m===12&&d===9)A('روز عرفه','mostahab');if(m===12&&d===18)A('عید غدیر','mostahab');if(m===3&&d===17)A('میلاد پیامبر (ص)','mostahab');
  if((m===7||m===8)&&!o.length)A('ماه '+HM[m-1],'mostahab');
  if(d>=13&&d<=15&&m!==9&&!(m===12&&d===13))A('ایام البیض','mostahab');
  if(m===1&&(d===9||d===10))A(d===9?'تاسوعا':'عاشورا','');return o}
const ibOf=iso=>S.ibadat.find(x=>x.id==='d'+iso)||{id:'d'+iso,date:iso,pr:{}};

  const tip=sp1.find(z=>z.f==='mostahab')?`<div class="sub" style="margin-top:4px"><span class="pill acc">فردا: ${esc(sp1.map(z=>z.t).join('، '))} — روزهٔ مستحب</span></div>`:sp.length?`<div class="sub" style="margin-top:4px"><span class="pill">${esc(sp.map(z=>z.t).join('، '))}${sp.some(z=>z.f==='haram')?' — روزه حرام':sp.some(z=>z.f==='mostahab')?' — روزهٔ مستحب':''}</span></div>`:'';
  return `<div class="row" style="margin-top:12px;border:1px solid var(--line);border-radius:14px;flex-wrap:wrap;cursor:default">${badge('personal','moon')}<div class="main" data-act="ibadat" style="cursor:pointer"><div class="ttl">${hijTxt(t)} · نماز ${fa(nDone)} از ${fa(nP)}</div>${tip}</div>
   <div class="prw" style="width:100%">${PRAY.map(([k,l])=>{const v=(x.pr||{})[k]||0;return `<button type="button" data-act="prTap" data-k="${k}" data-d="${t}" data-s="${v}"><b>${l}</b>${v?PST[v]:'—'}</button>`}).join('')}</div></div>`}
function ibStats(days){const t=today();let pr=0,early=0,jam=0,fast=0,quran=0,sileh=0,niy=0,nn=0;for(let i=0;i<days;i++){const x=ibOf(addDays(t,-i));PRK.forEach(k=>{const v=(x.pr||{})[k]||0;if(v>0)pr++;if(v>=2)early++;if(v>=3)jam++});if(x.fast)fast++;quran+=Number(x.quran)||0;sileh+=(x.sileh||[]).length;if(x.niy){niy+=x.niy;nn++}}
  const from=addDays(t,-days+1);const L=S.ledger.filter(l=>!l.void&&!l.pending&&l.kind==='paid'&&l.date>=from&&l.date<=t);const sad=L.filter(l=>l.category==='خیرات، صدقه و نذر').reduce((a,l)=>a+Number(l.amount||0),0),qh=L.filter(l=>l.category==='قرض‌الحسنه و کمک').reduce((a,l)=>a+Number(l.amount||0),0);
  return{pr,early,jam,fast,quran,sileh,niy:nn?niy/nn:0,sad,qh,max:days*PRAY.length}}

function formWin(w={}){const type=w.type||'win';openSheet(`<h3>${badge(WT[type][2],WT[type][1])} ${w.id?'ویرایش':'ثبت'} در دفتر دستاوردها${helpBtn('wins')}</h3>${w.from?`<p class="hint" style="font-size:13px;margin-top:0">«${esc(w.from)}» تمام شد. چیزی ارزش یادداشت دارد؟</p>`:''}<form data-form="win" data-id="${w.id||''}" data-task="${esc(w.taskId||'')}" data-deal="${esc(w.dealId||'')}" data-trip="${esc(w.tripId||'')}">

/* ---------- Weekly, monthly and yearly report with charts ---------- */
function perRange(per,off){const t=today();if(per==='week'){let s0=t;while(wdOf(s0)!==6)s0=addDays(s0,-1);s0=addDays(s0,7*off);return[s0,addDays(s0,6),off===0?'این هفته':off===-1?'هفتهٔ گذشته':'هفتهٔ '+jShort(s0)]}
  const j=jOf(t);if(per==='month'){let m=j.jm+off,y=j.jy;while(m<1){m+=12;y--}while(m>12){m-=12;y++}const s0=jIso(y,m,1);const nm=m===12?jIso(y+1,1,1):jIso(y,m+1,1);return[s0,addDays(nm,-1),MONTHS[m-1]+' '+fa(y)]}
  const y=j.jy+off;return[jIso(y,1,1),addDays(jIso(y+1,1,1),-1),'سال '+fa(y)]}
function perData(f,to){const inR=d=>d&&d>=f&&d<=to;const doneD=t=>t.doneAt?isoOf(new Date(t.doneAt)):'';
  const done=S.tasks.filter(t=>t.status==='done'&&inR(doneD(t)));const created=S.tasks.filter(t=>t.created&&inR(isoOf(new Date(t.created))));
  const L=S.ledger.filter(l=>!l.void&&!l.pending&&inR(l.date)&&!l.settles&&!l.refId&&(l.currency||'تومان')==='تومان');
  const inc=L.filter(l=>l.kind==='received'&&CATS_IN.includes(l.category)),exp=L.filter(l=>l.kind==='paid'&&CATS_OUT.includes(l.category)&&l.category!=='خرید و تأمین کالا'),pers=L.filter(l=>l.kind==='paid'&&(CATS_PERS.includes(l.category)||l.category==='هزینهٔ شخصی'));
  const sum=a=>a.reduce((s2,l)=>s2+Number(l.amount||0),0);const sales=S.moves.filter(m=>!m.void&&m.kind==='sale'&&inR(m.date));
  let pr=0,early=0,jam=0,fast=0,quran=0,sileh=0,niy=0,nn=0,days=0;for(let d=f;d<=to&&d<=today();d=addDays(d,1)){days++;const x=ibOf(d);PRK.forEach(k=>{const v=(x.pr||{})[k]||0;if(v>0)pr++;if(v>=2)early++;if(v>=3)jam++});if(x.fast)fast++;quran+=Number(x.quran)||0;sileh+=(x.sileh||[]).length;if(x.niy){niy+=x.niy;nn++}}
  const pl=plRange(f,to);
  return{done,created,inc:pl.inc,exp:pl.exp,pers:pl.pers,incL:inc,expL:exp,persL:pers,salesQ:sales.reduce((a,m)=>a+Number(m.qty||0),0),wins:S.wins.filter(w=>!w.void&&inR(w.date)),ib:{pr,early,jam,fast,quran,sileh,niy:nn?niy/nn:0,max:days*PRAY.length}}}
const delta=(a,b)=>{if(!b&&!a)return'';if(!b)return'<span class="dl up">تازه</span>';const p=Math.round((a-b)/Math.abs(b)*100);return p===0?'<span class="dl">بدون تغییر</span>':`<span class="dl ${p>0?'up':'dn'}">${p>0?'▲':'▼'} ${fa(Math.abs(p))}٪</span>`};
function colChart(items,color){const mx=Math.max(1,...items.map(x=>x.v));return `<div class="cbar" role="img" aria-label="${esc(items.map(x=>x.l+': '+x.v).join('، '))}">${items.map(x=>`<div class="c" title="${esc(x.l)}: ${fa(x.v)}"><b>${x.v?fa(x.v):''}</b><i style="height:${Math.round(x.v/mx*100)}%;background:${color||'var(--a-affairs)'}"></i></div>`).join('')}</div><div class="cx">${items.map(x=>`<span>${esc(x.l)}</span>`).join('')}</div>`}

function periodReport(per,off){per=per||ui.rp||'week';off=off||0;ui.rp=per;const [f,to,lab]=perRange(per,off);const [pf,pt]=perRange(per,off-1);const D=perData(f,to),P=perData(pf,pt);
  // tasks per bucket

  else if(per==='month'){let d=f,i=1;while(d<=to){const e=addDays(d,6)>to?to:addDays(d,6);buckets.push({l:'هفتهٔ '+fa(i),f:d,t:e});d=addDays(e,1);i++}}

  const doneD=t=>t.doneAt?isoOf(new Date(t.doneAt)):'';buckets.forEach(b=>b.v=D.done.filter(t=>{const d=doneD(t);return d>=b.f&&d<=b.t}).length);

  const net=D.inc-D.exp,pnet=P.inc-P.exp;

  const over=openTasks().filter(t=>t.due&&t.due<today()).length;if(over&&off===0)ins.push(`${fa(over)} کار عقب‌افتاده داری؛ «مرور هفتگی» کمک می‌کند.`);
  const kpi=(l,v,dv)=>`<div class="kpi"><div class="l">${l}</div><div class="v" style="font-size:20px">${v}${dv||''}</div></div>`;

  ${ins.length?`<div class="ans"><div class="q">${svg('check')} برداشت این دوره</div><div class="a" style="font-size:14px">${ins.map(x=>'• '+x).join('<br>')}</div></div>`:''}

const CATALOG_DOC=()=>S.meta.find(x=>x.id==='catalog')||{items:[]};
const catalogNames=()=>[...new Set([...(CATALOG_DOC().items||[]).map(x=>x.name),...S.quotes.map(q=>q.product+(q.variety?' '+q.variety:'')),...S.lots.map(l=>lotName(l))].filter(Boolean))].slice(0,300);
function catalogFind(desc){const n=nrm(desc||'');if(n.length<3)return null;const it=(CATALOG_DOC().items||[]);return it.find(x=>nrm(x.name)===n)||it.find(x=>nrm(x.name).includes(n)||n.includes(nrm(x.name)))||null}
async function syncCatalog(manual){const site=(PROF().site||'').trim();if(!site){if(manual)toast('نشانی سایت در «نمایه و تنظیمات» خالی است');return}
  const base=site.replace(/\/+$/,'');const url=(/^https?:/.test(base)?base:'https://'+base)+'/wp-json/wc/store/v1/products?per_page=100';
  try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),12000);const r=await fetch(url,{signal:ac.signal});clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);const js=await r.json();if(!Array.isArray(js))throw new Error('قالب ناشناخته');
    const items=js.map(p=>{const pr=p.prices||{};const mu=Number(pr.currency_minor_unit||0);let v=Number(pr.price||0)/Math.pow(10,mu);if((pr.currency_code||'').toUpperCase()==='IRR')v=v/10;return{name:String(p.name||'').replace(/<[^>]+>/g,''),price:Math.round(v),stock:p.is_in_stock===false?'ناموجود':(p.stock_quantity!=null?p.stock_quantity:'موجود'),sku:p.sku||'',url:p.permalink||''}}).filter(x=>x.name);
    await putRaw('meta',{id:'catalog',items,at:nowTs(),site:base,err:''});if(manual)toast(fa(items.length)+' کالا از سایت آمد ✓')}catch(e){const d=CATALOG_DOC();await putRaw('meta',{...d,id:'catalog',items:d.items||[],err:String(e.message||e),tried:nowTs()});if(manual)toast('اتصال به سایت ممکن نشد ('+String(e.message||e).slice(0,40)+'). از اطلاعات قبلی استفاده می‌کنم')}}
setTimeout(()=>{try{const d=CATALOG_DOC();const last=d.at||d.tried||'';if(navigator.onLine&&PROF().site&&(!last||Date.now()-new Date(last).getTime()>12*3600e3))syncCatalog(false)}catch(_){}},7000);

async function personByName(n){n=(n||'').trim();if(!n)return'';const p=S.people.find(x=>x.name===n);if(p)return p.id;const id=newId();await putRaw('people',{id,name:n,roles:['تأمین‌کننده'],status:'active',created:nowTs(),updated:nowTs()});return id}
let LOT_REUSE=[],LEG_SET=[];const takeLot=prod=>{const i=LOT_REUSE.findIndex(id=>{const l=byId('lots',id);return l&&(!prod||l.product===prod)});return i>=0?LOT_REUSE.splice(i,1)[0]:newId()};
async function postDoc(d,id,led,acct,ext){const date=d.date,pid=d.personId||'',t=docTotal(d),now=nowTs();const out={moves:0,lots:0,led:0};
  const ledRow=async(kind,amount,category,about,extra={})=>{if(!amount||led==='none')return;await putRaw('ledger',{id:newId(),kind,personId:extra.personId!=null?extra.personId:pid,amount,currency:'تومان',about,category,acct:['received','paid'].includes(kind)?acct:'',instrument:'نقد/کارت',date,due:['receivable','payable'].includes(kind)?addDays(date,30):'',docId:id,settled:false,void:false,created:now,updated:now,...extra});out.led++};
  if(d.type==='invoice'){const byCat={},GV=isGive(led),prods=new Set();
    for(const x of d.items){let lotId=x.src==='lot'?x.lotId:'';const prod=lotId?(byId('lots',lotId)||{}).product:(x.src==='new'&&x.nProd&&x.nProd!=='سایر'?x.nProd:guessProd(x.desc));prods.add(prod);
      if(x.src==='buy'){const sup=await personByName(x.bSup);const lid=takeLot(prod);const bd=x.bDate||date;await putRaw('lots',{id:lid,product:prod,variety:x.desc.replace(prod,'').trim(),source:'buy',supplierId:sup,qty:x.qty,unit:x.unit||'کیلو',cost:x.bPrice||0,currency:'تومان',date:bd,code:nextLotCode(prod,bd),docId:id,void:false,created:now,updated:now});out.lots++;lotId=lid;
        if(x.bPrice&&led!=='none')await putRaw('ledger',{id:newId(),kind:x.bPay==='paid'?'paid':'payable',personId:sup,amount:x.bPrice*x.qty,currency:'تومان',about:'خرید '+fmtQ(x.qty,x.unit)+' '+x.desc+' (برای فاکتور '+d.no+')',category:'خرید و تأمین کالا',lotId:lid,acct:x.bPay==='paid'?acct:'',instrument:'نقد/کارت',date:bd,due:x.bPay==='paid'?'':addDays(bd,30),docId:id,settled:false,void:false,created:now,updated:now})}
      if(x.src==='new'){const lid=takeLot(prod);const who=['loan','consign'].includes(x.nSrc)?await personByName(x.nWho):'';await putRaw('lots',{id:lid,product:prod,variety:String(x.desc||'').replace(prod,'').trim(),source:x.nSrc==='open'?'open':x.nSrc==='loan'?'loan':x.nSrc==='consign'?'buy':'own',consign:x.nSrc==='consign',supplierId:who,qty:x.qty,unit:x.unit||'کیلو',cost:['open','loan','consign'].includes(x.nSrc)?(x.nCost||0):0,currency:'تومان',date,code:nextLotCode(prod,date),docId:id,note:'معرفی‌شده هنگام صدور '+DT.invoice[0]+' '+d.no,void:false,created:now,updated:now});out.lots++;lotId=lid;
        if(x.nSrc==='consign'&&x.nCost&&led!=='none')await putRaw('ledger',{id:newId(),kind:'payable',personId:who,amount:x.nCost*x.qty,currency:'تومان',about:'سهم صاحب کالای امانی: '+fmtQ(x.qty,x.unit)+' '+(x.desc||''),category:'خرید و تأمین کالا',lotId:lid,instrument:'نسیه',date,due:addDays(date,30),docId:id,settled:false,void:false,created:now,updated:now})}

/* ---------- Daily self-reckoning (muhasaba): was yesterday's work for God? ---------- */
const NIY={lillah:['فقط برای خدا','🌿'],khayr:['کار حلال با نیت خیر','🤲'],adi:['عادی؛ نیتی نکردم','·'],naqis:['نیتم خالص نبود','!']};
const NIYW={lillah:1,khayr:.8,adi:.3,naqis:0};
const doneOn=(d)=>S.tasks.filter(t=>t.status==='done'&&t.doneAt&&isoOf(new Date(t.doneAt))===d);
function niyVerdict(arr){const n=arr.filter(t=>t.niy).length;if(!n)return'';const sc=arr.filter(t=>t.niy).reduce((a,t)=>a+NIYW[t.niy],0)/n;const p=Math.round(sc*100);
  const by={};arr.filter(t=>t.niy).forEach(t=>{by[t.niy]=(by[t.niy]||0)+1});const best=arr.filter(t=>t.niy==='lillah').map(t=>AREAS[t.area]||'').filter(Boolean);
  const msg=p>=85?'روزی که رنگ خدا داشت؛ قبول باشد.':p>=60?'بیشتر کارهایت با نیت خیر بود؛ با یک «بسم‌الله» پیش از هر کار، بقیه هم خدایی می‌شود.':p>=35?'کارها بیشتر عادی گذشت. فردا پیش از هر کار یک لحظه نیت کن؛ همان کار، عبادت می‌شود.':'روز سختی بود؛ توبه و تجدید نیت درِ همیشه باز است.';
  return `<div style="text-align:center;margin:6px 0"><div style="font-size:30px;font-weight:800;color:#0f7a6c">${fa(p)}٪</div><div class="sub" style="justify-content:center"><span>رنگ خدایی کارهای دیروز</span></div></div><p style="font-size:14px;text-align:center;margin:4px 0 8px">${msg}</p><div class="sub" style="justify-content:center">${Object.entries(by).map(([k,v])=>`<span class="pill">${NIY[k][1]} ${NIY[k][0]}: ${fa(v)}</span>`).join('')}</div>${best.length?`<div class="sub" style="justify-content:center;margin-top:4px"><span>خالص‌ترین‌ها در: ${[...new Set(best)].map(esc).join('، ')}</span></div>`:''}`}
function mhsCard(){const y=addDays(today(),-1);let hid='';try{hid=localStorage.getItem('miz.mhs')||''}catch(_){}if(hid===today())return'';const arr=doneOn(y);if(!arr.length)return'';const left=arr.filter(t=>!t.niy);
  if(!left.length){let shown='';try{shown=localStorage.getItem('miz.mhsDone')||''}catch(_){}return shown===today()?`<div class="mhs"><div class="ttl" style="font-weight:700">${badge('akhirat','moon')} حساب دیروز</div>${niyVerdict(arr)}<div class="acts" style="justify-content:center;margin-top:8px"><button class="btn ghost" data-act="mhsHide">بستن</button></div></div>`:''}
  return `<div class="mhs"><div style="display:flex;align-items:center;gap:8px">${badge('akhirat','moon')}<div class="main"><div class="ttl" style="font-weight:700">حساب دیروز: ${fa(arr.length)} کار انجام دادی</div><div class="sub"><span>هر کدام برای که بود؟ فقط خودت و خدا می‌دانید.</span></div></div></div>
   <div class="ay">«قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ» · انعام ۱۶۲</div>
   <div class="list">${left.slice(0,8).map(t=>`<div class="row" style="flex-wrap:wrap;cursor:default"><div class="main"><div class="ttl" style="font-size:14px">${esc(t.title)}</div>${t.area?`<div class="sub"><span>${esc(AREAS[t.area]||'')}</span></div>`:''}</div><div class="niyq" style="width:100%">${Object.entries(NIY).map(([k,v])=>`<button type="button" data-act="niySet" data-id="${t.id}" data-v="${k}" aria-pressed="false">${v[1]} ${v[0]}</button>`).join('')}</div></div>`).join('')}</div>
   <div class="acts" style="margin-top:8px"><button class="btn ghost" data-act="mhsHide">امروز نه</button>${left.length>1?`<button class="btn ghost" data-act="niyAll" data-v="khayr">همه «حلال با نیت خیر»</button>`:''}</div></div>`}

const CHST={wait:['در جریان','acc'],cleared:['پاس شد','ok'],bounced:['برگشت خورد','bad'],endorsed:['خرج شد (واگذار)',''],returned:['عودت یا باطل','']};

/* Goods lent or borrowed that have not come back: oldest open quantity first (FIFO) */
function kindAge(){const ev={};const add=(p,l,q,date)=>{if(!p||!l||!q)return;const kg=lotKg(l,1);const unit=kg?'کیلو':l.unit;const k=p+'|'+l.product+'|'+unit;const o=ev[k]=ev[k]||{p,prod:l.product,unit,e:[],pk:new Set()};o.pk.add(l.packId||'');o.e.push({q:kg?q*kg:q,date:date||'',n:q,pid:l.packId||''})};
  S.lots.filter(l=>!l.void&&l.source==='loan').forEach(l=>add(l.supplierId||(l.supplierName?'n:'+l.supplierName:'n:بی‌نام'),l,-(Number(l.qty)||0),l.date));
  S.moves.filter(m=>!m.void&&['lend','payback','getback'].includes(m.kind)).forEach(m=>{const q=Number(m.qty)||0;add(m.personId||(m.toName?'n:'+m.toName:'n:بی‌نام'),byId('lots',m.lotId),m.kind==='getback'?-q:q,m.date)});
  const out=[];Object.values(ev).forEach(o=>{const Q=[];o.e.sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{let a=x.q;while(Q.length&&Math.sign(Q[0].q)!==Math.sign(a)&&Math.abs(a)>1e-9){const t=Math.min(Math.abs(a),Math.abs(Q[0].q));Q[0].q-=Math.sign(Q[0].q)*t;a-=Math.sign(a)*t;if(Math.abs(Q[0].q)<1e-9)Q.shift()}if(Math.abs(a)>1e-9)Q.push({q:a,date:x.date})});
    if(Q.length){const tot=Q.reduce((s,x)=>s+x.q,0);let cnt='';if(o.pk.size===1){const pid=[...o.pk][0];const pk=pid&&PACKS().find(z=>z.id===pid);if(pk&&pk.w)cnt=fmtQ(Math.round(Math.abs(tot)/pk.w),'عدد')+' '+pk.n}out.push({p:o.p,prod:o.prod,unit:o.unit,q:tot,since:Q[0].date,cnt})}});return out.sort((a,b)=>a.since.localeCompare(b.since))}
const KAGE=30;
function kindDueCard(){let L=[];try{L=kindAge().filter(x=>x.since&&diffDays(today(),x.since)>=KAGE)}catch(_){return''}if(!L.length)return'';
  const nm=p=>p.startsWith('n:')?p.slice(2):pname(p)||'—';
  return `<div class="blk-h" style="margin-top:14px"><h2>کالای امانی برنگشته</h2><span class="pill warn">${fa(L.length)}</span></div><div class="list">${L.map(x=>`<button class="row" ${x.p.startsWith('n:')?'':`data-act="viewPerson" data-id="${x.p}"`}>${badge(x.q>0?'sales':'affairs','box')}<div class="main"><div class="ttl">${(()=>{const qt=x.cnt?esc(x.prod)+' '+esc(x.cnt):fmtQ(Math.round(Math.abs(x.q)*100)/100,x.unit)+' '+esc(x.prod);return x.q>0?qt+' نزد '+esc(nm(x.p)):qt+' که باید به '+esc(nm(x.p))+' پس بدهی'})()}</div><div class="sub"><span>از ${jShort(x.since)} · ${fa(diffDays(today(),x.since))} روز</span>${x.cnt?`<span>≈ ${fmtQ(Math.round(Math.abs(x.q)*100)/100,x.unit)}</span>`:''}<span class="pill warn">${x.q>0?'پس بگیر':'پس بده'}</span></div></div></button>`).join('')}</div>`}

/* ---------- Marketers and sites: commission suggestions and monthly settlement ---------- */
const isMarketer=p=>p&&((p.roles||[]).some(r=>/بازاریاب/.test(r))||S.moves.some(m=>!m.void&&m.via===p.id)||S.ledger.some(l=>!l.void&&l.ref&&l.ref.mkt===p.id));
const lastComm=pid=>S.ledger.filter(l=>!l.void&&l.personId===pid&&l.comm).sort((a,b)=>(b.comm.until||'').localeCompare(a.comm.until||''))[0];
function commSales(pid){const lc=lastComm(pid);const from=lc?lc.comm.until:'';return S.moves.filter(m=>!m.void&&m.kind==='sale'&&m.via===pid&&(!from||m.date>from)).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
function commCalc(pid,rule){const ms=commSales(pid);const rev=ms.reduce((a,m)=>a+Number(m.qty||0)*Number(m.price||0),0);const kg=ms.reduce((a,m)=>{const l=byId('lots',m.lotId);return a+(l&&l.unit==='کیلو'?Number(m.qty||0):l&&l.unit==='گرم'?Number(m.qty||0)/1000:0)},0);
  const r=rule||(byId('people',pid)||{}).comm||{t:'pct',v:5,sug:1};const amt=r.t==='pct'?rev*Number(r.v||0)/100:r.t==='kg'?kg*Number(r.v||0):Number(r.v||0);return{ms,rev,kg,r,amt:Math.round(amt/1000)*1000}}
/* Referral commission: the dispatcher pays me a % of referred sales; the marketer gets a tiered share of the sale. Accrual: receivable from dispatcher, payable to marketer. */
const CCFG=()=>({rate:25,disp:'',days:180,tiers:[{upto:50e6,pct:10},{upto:0,pct:12.5}],...((S.meta.find(x=>x.id==='commcfg')||{}))});
const ymOf=d=>{const j=jOf(d||today());return j.jy*100+j.jm};
const mshare=(sale,rate,mp,base)=>(base||CCFG().base)==='comm'?sale*rate/100*mp/100:sale*mp/100;
const refRows=()=>S.ledger.filter(l=>!l.void&&l.ref&&l.kind==='receivable');
function mktMonth(mid,date,skip){const ym=ymOf(date);return refRows().filter(l=>l.ref.mkt===mid&&ymOf(l.date)===ym&&l.ref.id!==skip).reduce((a,l)=>a+Number(l.ref.sale||0),0)}
function tierPct(total){const T=CCFG().tiers||[];let acc=0;for(const t of T){if(!t.upto||total<=Number(t.upto))return Number(t.pct)||0}return T.length?Number(T[T.length-1].pct)||0:0}
function refAttr(cid){const c=byId('people',cid);if(!c||!c.refBy)return '';const last=refRows().filter(l=>l.ref.cust===cid).map(l=>l.date).sort().pop()||c.refAt||'';if(last&&diffDays(today(),last)>CCFG().days)return '';return c.refBy}
function formRef(pre={}){const C=CCFG();const mid=pre.mkt||(pre.cust?refAttr(pre.cust):'');openSheet(`<h3>${badge('marketers','marketers')} ${pre.editOf?'اصلاح فروش معرفی':'فروش معرفی (پورسانتی)'}</h3><p class="hint" style="font-size:12.5px;color:var(--muted);margin-top:0">فروشی که ارسال‌کننده انجام داده و از آن پورسانت می‌گیری. طلب پورسانت از ارسال‌کننده و سهم بازاریاب خودکار ثبت می‌شود.</p>${pre.editOf?'':commQCard()}<form data-form="refsale" data-edit="${esc(pre.editOf||'')}">

/* ---------- Contacts (phone book lookup, kept apart from «افراد») ---------- */
let CT=[];
const nrm=s=>String(s||'').toLowerCase().replace(/[\s\u200c\u200f\u200e\-_.،,]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه');
let CTK=[];
function rebuildContacts(){CT=[];S.contacts.slice().sort((a,b)=>(a.i||0)-(b.i||0)).forEach(d=>(d.items||[]).forEach(x=>CT.push(x)));CTK=CT.map(c=>nrm(c.n+' '+(c.o||'')))}
const normDigits=s=>en(String(s||'')).replace(/\D/g,'');
function matchContacts(q,lim=8){q=q.trim();if(q.length<2)return[];if(CTK.length!==CT.length)CTK=CT.map(c=>nrm(c.n+' '+(c.o||'')));const qd=normDigits(q),ql=nrm(q);const words=q.split(/\s+/).map(nrm).filter(Boolean);const out=[];
  for(let i=0;i<CT.length;i++){const c=CT[i],k=CTK[i];if((ql&&k.includes(ql))||(words.length>1&&words.every(w=>k.includes(w)))||(qd.length>=4&&c.p.some(p=>p.includes(qd)))){out.push(c);if(out.length>=lim)break}}return out}
function contactSuggest(q){const box=document.getElementById('ctSug');if(!box)return;const m=matchContacts(q,6);
  box.innerHTML=m.length?`<div class="list" style="margin-top:6px">${m.map((c,i)=>`<button type="button" class="row" data-act="pickContact" data-i="${i}"><div class="main"><div class="ttl">${esc(c.n)}</div><div class="sub"><span dir="ltr">${esc(c.p.slice(0,2).join(' · '))}</span>${c.o?`<span>${esc(c.o)}</span>`:''}</div></div><span class="pill">از مخاطبین</span></button>`).join('')}</div>`:'';
  box._m=m}
function fillFromContact(c){const set=(id,v)=>{const e=document.getElementById(id);if(e&&v)e.value=v};set('f_name',c.n);set('f_phone',(c.p||[]).join(' ، '));set('f_email',c.e);set('f_org',c.o);const b=document.getElementById('ctSug');if(b)b.innerHTML=''}
async function pickFromPhone(){try{const r=await navigator.contacts.select(['name','tel','email'],{multiple:false});if(r&&r[0])fillFromContact({n:(r[0].name||[])[0]||'',p:(r[0].tel||[]).map(normDigits),e:(r[0].email||[])[0]||'',o:''})}catch(_){toast('دسترسی به مخاطبین گوشی داده نشد')}}
function parseVcf(txt){txt=txt.replace(/\r?\n[ \t]/g,'').replace(/=\r?\n/g,'');const out=[];
  const qp=s=>{try{return decodeURIComponent(s.replace(/%/g,'%25').replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(_){return s}};
  txt.split(/BEGIN:VCARD/i).slice(1).forEach(c=>{let fn='',n='',org='';const tel=[],em=[];
    c.split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i<0)return;let k=l.slice(0,i),v=l.slice(i+1).trim();if(/QUOTED-PRINTABLE/i.test(k))v=qp(v);const K=k.split(';')[0].toUpperCase();
      if(K==='FN')fn=v;else if(K==='N'&&!n)n=v.split(';').slice(0,2).reverse().filter(Boolean).join(' ');else if(K==='TEL')tel.push(v);else if(K==='EMAIL')em.push(v);else if(K==='ORG')org=v.replace(/;/g,' ').trim()});
    const p=[...new Set(tel.map(t=>{let d=normDigits(t);if(d.startsWith('0098'))d='0'+d.slice(4);else if(d.startsWith('98')&&d.length===12)d='0'+d.slice(2);else if(d.length===10&&d[0]==='9')d='0'+d;return d}).filter(d=>d.length>=7))];
    if(p.length||em.length)out.push({n:(fn||n||p[0]||em[0]).trim(),p:p.slice(0,4),e:em[0]||'',o:org})});return out}
async function importVcf(file){const txt=await file.text();if(!/BEGIN:VCARD/i.test(txt))return toast('این فایل مخاطبین (VCF) نیست');const items=parseVcf(txt);const have=new Set();CT.forEach(c=>c.p.forEach(p=>have.add(p)));
  const fresh=items.filter(c=>!c.p.some(p=>have.has(p))&&(c.p.forEach(p=>have.add(p)),true));
  if(!fresh.length)return toast('مخاطب تازه‌ای در این فایل نبود');
  let i=S.contacts.length;for(let k=0;k<fresh.length;k+=500){await putRaw('contacts',{id:'c'+String(i).padStart(3,'0'),i,items:fresh.slice(k,k+500),updated:nowTs()});i++}
  rebuildContacts();render();toast(fa(fresh.length)+' مخاطب تازه اضافه شد')}

const PRODUCTS=['عسل','بره‌موم','گرده','ژل رویال','زهر زنبور','موم','کلنی و کندو','بسته‌بندی','سایر'];

const MOVE={sale:{n:'فروش',s:-1},adj:{n:'اضافهٔ شمارش انبار',s:1},pret:{n:'برگشت به فروشنده (برگشت از خرید)',s:-1},sample:{n:'نمونهٔ رایگان',s:-1},gift:{n:'هدیه',s:-1,give:1},nazr:{n:'نذری',s:-1,give:1},ehsan:{n:'احسان',s:-1,give:1},sadaqa:{n:'صدقه',s:-1,give:1},khums:{n:'وجوهات شرعی',s:-1,give:1},loss:{n:'ضایعات یا کسری',s:-1},ret:{n:'مرجوعی (برگشت به انبار)',s:1},lend:{n:'امانی یا قرضی دادم',s:-1},payback:{n:'پس دادن کالای امانی یا قرضی',s:-1},getback:{n:'پس گرفتن کالای امانی',s:1},pack:{n:'بسته‌بندی شد',s:-1,internal:1},use:{n:'مصرف در بسته‌بندی',s:-1,internal:1}};
function kindBal(){const r={};const bump=(p,l,q)=>{if(!p||!l)return;const kg=lotKg(l,1);const unit=kg?'کیلو':l.unit;if(kg)q=q*kg;const k=l.product+'|'+unit;r[p]=r[p]||{};const o=r[p][k]=r[p][k]||{q:0,prod:l.product,unit,vars:new Set()};o.q+=q;if(l.variety)o.vars.add(l.variety)};
  S.lots.filter(l=>!l.void&&l.source==='loan').forEach(l=>bump(l.supplierId||(l.supplierName?'n:'+l.supplierName:'n:بی‌نام'),l,-(Number(l.qty)||0)));
  S.moves.filter(m=>!m.void&&['lend','payback','getback'].includes(m.kind)).forEach(m=>{const q=Number(m.qty)||0;bump(m.personId||(m.toName?'n:'+m.toName:'n:بی‌نام'),byId('lots',m.lotId),m.kind==='getback'?-q:q)});
  Object.values(r).forEach(m=>Object.keys(m).forEach(k=>{if(Math.abs(m[k].q)<1e-9)delete m[k]}));Object.keys(r).forEach(p=>{if(!Object.keys(r[p]).length)delete r[p]});return r}
function priceNow(prod,unit){const c=[];S.quotes.filter(q=>q.product===prod&&(q.unit||'کیلو')===unit&&q.price).forEach(q=>c.push({d:q.date,p:q.price,c:q.currency}));
  S.moves.filter(m=>!m.void&&m.kind==='sale'&&m.price).forEach(m=>{const l=byId('lots',m.lotId);if(l&&l.product===prod&&l.unit===unit)c.push({d:m.date,p:m.price,c:m.currency})});
  S.lots.filter(l=>!l.void&&l.product===prod&&l.unit===unit&&Number(l.cost)).forEach(l=>c.push({d:l.date,p:l.cost,c:l.currency}));c.sort((a,b)=>(b.d||'').localeCompare(a.d||''));return c[0]||null}
function kindTotals(){const kb=kindBal();const owe={},due={};Object.values(kb).forEach(m=>Object.values(m).forEach(o=>{const k=o.prod+'|'+o.unit;const t=o.q<0?owe:due;t[k]=(t[k]||0)+Math.abs(o.q)}));
  const txt=t=>Object.entries(t).map(([k,q])=>{const [pr,u]=k.split('|');return fmtQ(q,u)+' '+pr}).join('، ');return{owe:txt(owe),due:txt(due)}}
const kindLine=(t,cls)=>t?`<div class="${cls}" style="font-size:12.5px;font-weight:700;margin-top:2px">+ ${esc(t)} <span style="font-weight:400;opacity:.75">(کالایی)</span></div>`:'';
function kindRows(only){const kb=kindBal();const rows=[];Object.entries(kb).forEach(([p,m])=>{if(only&&p!==only)return;Object.values(m).forEach(o=>rows.push({p,...o}))});
  return rows.map(o=>{const pr=priceNow(o.prod,o.unit);const v=pr?Math.abs(o.q)*pr.p:0;const nm=o.p.startsWith('n:')?o.p.slice(2):pname(o.p);return `<button class="row" ${o.p.startsWith('n:')?'data-act="kindHelp"':`data-act="viewPerson" data-id="${o.p}"`}>${badge('sales','box')}<div class="main"><div class="ttl">${o.q<0?'بدهی من به':'طلب من از'} ${esc(nm||'—')}</div><div class="sub"><span>${esc(o.prod)}${o.vars.size?' ('+esc([...o.vars].join('، '))+')':''}</span>${pr?`<span>≈ ${money(v,pr.c)} به آخرین نرخ</span>`:'<span>نرخ روز ثبت نشده</span>'}</div></div><div class="end ${o.q<0?'amt-neg':'amt-pos'}"><b>${fmtQ(Math.abs(o.q),o.unit)}</b><div class="sub">کالایی</div></div></button>`}).join('')}
const whoOf=m=>pname(m.personId)||m.toName||'—';
function refPrice(prod,unit,exceptId){const c=[];S.quotes.filter(q=>!q.void&&q.dir==='got'&&q.product===prod&&(q.unit||'کیلو')===unit&&Number(q.price)).forEach(q=>c.push({d:q.date||'',v:Number(q.price),c:q.currency||'تومان',src:'قیمتی که از '+(pname(q.personId)||'—')+' گرفتی ('+jShort(q.date)+')'}));
  S.lots.filter(l=>!l.void&&l.id!==exceptId&&l.source!=='loan'&&l.product===prod&&l.unit===unit&&Number(l.cost)).forEach(l=>c.push({d:l.date||'',v:Number(l.cost),c:l.currency||'تومان',src:'خرید از '+(pname(l.supplierId)||l.supplierName||'—')+' ('+jShort(l.date)+')'}));
  c.sort((a,b)=>b.d.localeCompare(a.d));return c[0]||null}
function lotSuspect(l){if(!l||!Number(l.cost))return null;const r=refPrice(l.product,l.unit,l.id);if(r&&(r.c||'تومان')===(l.currency||'تومان')){const k=Number(l.cost)/r.v;if(k>4||k<0.25)return r}
  if(!r&&l.product==='عسل'&&l.unit==='کیلو'&&Number(l.cost)>20e6)return{v:0,src:'—'};return null}
const lotCost=l=>l?Number(l.cost||0)+Number(l.packCost||0)+((Number(l.extra||0)+Number(l.extraPack||0))/(Number(l.qty)||1)):0;
function unitValue(l){if(l.cost&&!lotSuspect(l))return{v:lotCost(l),c:l.currency||'تومان',src:'بهای همین محموله'};{const r=refPrice(l.product,l.unit,l.id);if(r)return{v:r.v,c:r.c,src:r.src}}
  const yr=S.moves.filter(m=>!m.void&&m.kind==='sale'&&m.price&&diffDays(today(),m.date)<=365).filter(m=>{const x=byId('lots',m.lotId);return x&&x.product===l.product&&x.unit===l.unit});

async function qSend(id,ch){const q=byId('quotes',id);const txt=val('f_qmsg');const num=val('f_qnum');const names={sms:'پیامک',wa:'واتساپ',tg:'تلگرام',share:'اشتراک'};
  if(ch==='sms')location.href=`sms:${num}?body=${encodeURIComponent(txt)}`;else if(ch==='wa')open(`https://wa.me/${num?intlPhone(num):''}?text=${encodeURIComponent(txt)}`,'_blank');else if(ch==='tg')open(`https://t.me/share/url?url=${encodeURIComponent(' ')}&text=${encodeURIComponent(txt)}`,'_blank');
  else{try{await navigator.share({text:txt})}catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(txt);toast('متن کپی شد؛ در برنامهٔ دلخواه بچسبان')}catch(_){}}}
  await save('quotes',id,{sentVia:names[ch],sentAt:nowTs(),sentText:txt});setTimeout(()=>toast('ثبت شد که با '+names[ch]+' فرستادی ✓'),800)}
function viewQuote(id){const q=byId('quotes',id);if(!q)return;const same=S.quotes.filter(x=>x.product===q.product&&(x.variety||'')===(q.variety||'')&&x.id!==id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

function personTrade(id){const mv=S.moves.filter(m=>m.personId===id&&!m.void);const by={};
  mv.forEach(m=>{const l=byId('lots',m.lotId);if(!l)return;const y=jYear(m.date);const k=`${y}|${l.product}|${l.unit}`;by[k]=by[k]||{q:0,amt:0,cur:m.currency||'تومان'};by[k].q-=MOVE[m.kind].s*(Number(m.qty)||0);if(m.kind==='sale')by[k].amt+=(Number(m.qty)||0)*(Number(m.price)||0)});

/* ---------- Flow follow-up: quotes, samples and credit are chased until they close ---------- */
async function openFlow(flow,title,days,area){const dup=S.tasks.find(t=>t.status==='open'&&t.flow&&t.flow.kind===flow.kind&&t.flow.personId===flow.personId&&t.flow.product===flow.product);
  if(dup){await save('tasks',dup.id,{due:addDays(today(),days)});return}
  await save('tasks',null,{title,due:addDays(today(),days),priority:2,area,personId:flow.personId||'',dealId:'',note:'ساخته‌شده خودکار برای پیگیری تا نتیجه',status:'open',flow})}
async function closeFlows(pred,why){for(const t of S.tasks.filter(t=>t.status==='open'&&pred(t)))await save('tasks',t.id,{status:'done',doneAt:nowTs(),note:(t.note?t.note+' · ':'')+'بسته شد خودکار: '+why})}
function flowSummary(){const ot=openTasks().filter(t=>t.flow);const c=k=>ot.filter(t=>t.flow.kind===k).length;
  const recv=S.ledger.filter(l=>!l.void&&!l.settled&&l.kind==='receivable').length,pay=S.ledger.filter(l=>!l.void&&!l.settled&&l.kind==='payable').length;
  const short=S.lots.filter(l=>!l.void&&lotStat(l).rem<-1e-9);
  return{rows:[['quote_gave','قیمت داده‌شده، منتظر جواب',c('quote_gave'),'marketers','tag'],['quote_got','قیمت گرفته‌شده، منتظر تصمیم',c('quote_got'),'export','tag'],['sample','نمونهٔ داده‌شده، منتظر نظر',c('sample'),'sales','box'],['recv','فروش نسیه، منتظر دریافت',recv,'finance','finance'],['pay','خرید نسیه، منتظر پرداخت',pay,'finance','finance']].filter(r=>r[2]>0),short}}
