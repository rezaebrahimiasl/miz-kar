const ciSnoozed=new Set();
const monthKey=d=>d.slice(0,7);
const ciDoc=(hid,d)=>S.checkins.find(c=>c.habitId===hid&&c.month===monthKey(d));
const getAns=(hid,d)=>{const c=ciDoc(hid,d);return c&&c.days?c.days[d]:undefined};
const activeHabits=()=>S.habits.filter(h=>h.active!==false);
const hDays=h=>h.sched==='custom'?(h.wd||[]):(SCHED[h.sched||'all']||SCHED.all).d;
const onDay=(h,iso)=>hDays(h).includes(wdOf(iso));
const schedShort=h=>h.sched==='custom'?(h.wd||[]).map(w=>WD[w]).join('، '):(SCHED[h.sched||'all']||{}).s;
function missingDays(h){if(h.pausedUntil&&today()<=h.pausedUntil)return[];const out=[];const created=(h.created||nowTs()).slice(0,10);const start=addDays(created,-1);
  if(h.lite){let y=addDays(today(),-1);for(let k=0;k<6&&!onDay(h,y);k++)y=addDays(y,-1);let last='';try{last=localStorage.getItem('miz.lite.'+h.id)||''}catch(_){}if(y>=start&&getAns(h.id,y)===undefined&&(!last||diffDays(today(),last)>=3))out.push(y);return out}
  for(let i=1;i<=7;i++){const d=addDays(today(),-i);if(d<start)break;if(onDay(h,d)&&getAns(h.id,d)===undefined)out.push(d)}return out}
const dayWord=d=>{const n=diffDays(today(),d);return n===1?'دیروز':n===2?'پریروز':jNice(d)};
const qFor=(h,d)=>{const w=dayWord(d);return h.q.replace(/دیروز|دیشب/g,m=>m==='دیشب'&&w==='دیروز'?'دیشب':w==='دیروز'?m:(m==='دیشب'?'شبِ '+w:w))};
function ciQueue(){const q=[];
  activeHabits().forEach(h=>{const miss=missingDays(h);miss.forEach(d=>{const k='h:'+h.id+':'+d;if(!ciSnoozed.has(k))q.push({k,type:'habit',h,d,miss:miss.length,rank:diffDays(today(),d)===1?0:2})})});
  openTasks().filter(t=>t.priority==1&&t.due&&diffDays(today(),t.due)>=3).forEach(t=>{const k='t:'+t.id;if(!ciSnoozed.has(k))q.push({k,type:'task',t,rank:1})});
  return q.sort((a,b)=>a.rank-b.rank)}
let ciOpen=false,ciMode='all';
function openCheckin(force){if(!force){if(!document.getElementById('sheetRoot').hidden)return;let last=0;try{last=Number(localStorage.getItem('miz.ciLast')||0)}catch(_){}if(Date.now()-last<3*3600e3)return}
  const q=ciQueue();if(!q.length){if(force)toast('سؤال بی‌جوابی نمانده');return}
  ciMode=force?'all':'single';if(!force){try{localStorage.setItem('miz.ciLast',String(Date.now()))}catch(_){}}ciOpen=true;renderCheckin(q)}
function nextCheckin(){const q=ciQueue();if(!q.length){ciOpen=false;closeSheet();toast('چک‌این تمام شد');render();return}
  if(ciMode==='single'){ciOpen=false;closeSheet();render();toast(`ممنون. ${fa(q.length)} سؤال دیگر مانده؛ هر وقت خواستی از «امروز ← چک‌این»`);return}renderCheckin(q)}
function renderCheckin(q){const it=q[0];let body='';if(it.type==='habit'&&it.h.lite){try{localStorage.setItem('miz.lite.'+it.h.id,today())}catch(_){}}

    body=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${badge(h.area||'personal',h.icon||'personal')}<div><div style="font-weight:800;font-size:17px">${esc(qFor(h,d))}</div><div style="font-size:12.5px;color:var(--muted)">${esc(h.name)} · ${jShort(d)}${it.miss>1?` · <span style="color:var(--bad);font-weight:700">${fa(it.miss)} روز است ثبت نشده</span>`:''}</div></div></div>`;
    if(h.type==='sleep')body+=`<form data-form="ciTime" data-h="${h.id}" data-d="${d}"><div class="row2"><div class="fld"><label for="f_bed">ساعت خواب</label><input id="f_bed" type="time" value="23:30"></div><div class="fld"><label for="f_wake">ساعت بیداری</label><input id="f_wake" type="time" value="06:00"></div></div><button class="btn pri" style="width:100%">ثبت</button></form>`;
    else if(h.type==='number')body+=`<form data-form="ciNum" data-h="${h.id}" data-d="${d}"><div class="fld"><label for="f_cin">مقدار</label><input id="f_cin" inputmode="decimal"></div><button class="btn pri" style="width:100%">ثبت</button></form>`;
    else body+=`<div class="row2"><button class="btn pri" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="yes">بله ✓</button><button class="btn" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="no">نه</button></div>`;
    body+=`<div class="acts" style="margin-top:12px;justify-content:space-between"><button class="btn ghost" data-act="ciLater" data-k="${it.k}">بعداً بپرس</button><button class="btn ghost" data-act="ciAns" data-h="${h.id}" data-d="${d}" data-v="skip">ول کن، نمی‌خوام بگم</button><button class="btn ghost danger" data-act="ciStop" data-h="${h.id}">دیگه اینو نپرس</button></div>${it.miss>1?`<button class="btn ghost" style="width:100%;margin-top:6px" data-act="ciSkipRest" data-h="${h.id}">${fa(it.miss-1)} روزِ قبل‌تر را ول کن، فقط همین را بپرس</button>`:''}`}
  else{const t=it.t;const n=diffDays(today(),t.due);
    body=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${badge(t.area||'affairs','warn')}<div><div style="font-weight:800;font-size:17px">${esc(t.title)}</div><div style="font-size:12.5px;color:var(--bad);font-weight:700">کار فوری · ${fa(n)} روز عقب افتاده</div></div></div>
    <div class="row2"><button class="btn pri" data-act="ciTask" data-id="${t.id}" data-v="done">انجام شد ✓</button><button class="btn" data-act="ciTask" data-id="${t.id}" data-v="1">فردا انجامش می‌دهم</button><button class="btn" data-act="ciTask" data-id="${t.id}" data-v="7">هفتهٔ بعد</button><button class="btn" data-act="ciLater" data-k="${it.k}">بعداً بپرس</button></div>
    <div class="acts" style="margin-top:10px;justify-content:space-between"><button class="btn ghost danger" data-act="ciTask" data-id="${t.id}" data-v="drop">ول کن، کنارش بگذار</button></div>`}
  openSheet(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="ab" style="--c:var(--a-sales)">${svg('bell')}</span><h3 style="margin:0;flex:1">چک‌این</h3><span class="pill">${ciMode==='single'?fa(q.length)+' سؤال مانده':fa(1)+' از '+fa(q.length)}</span></div>${body}`)}
async function skipRest(hid){const h=byId('habits',hid);const miss=missingDays(h).slice(1);const byM={};miss.forEach(d=>{(byM[monthKey(d)]=byM[monthKey(d)]||[]).push(d)});
  for(const [mk,ds] of Object.entries(byM)){const c=S.checkins.find(x=>x.habitId===hid&&x.month===mk);const days={...(c&&c.days||{})};ds.forEach(d=>days[d]='skip');
    if(c)await save('checkins',c.id,{days});else await putRaw('checkins',{id:hid+'_'+mk,habitId:hid,month:mk,days,created:nowTs(),updated:nowTs()})}
  if(mode==='local')render();nextCheckin()}
async function answerCheckin(hid,d,v){const c=ciDoc(hid,d);const days={...(c&&c.days||{}),[d]:v};
  if(c)await save('checkins',c.id,{days});else await putRaw('checkins',{id:hid+'_'+monthKey(d),habitId:hid,month:monthKey(d),days,created:nowTs(),updated:nowTs()});
  if(mode==='local')render();if(ciOpen)nextCheckin()}
const weekStart=iso=>{const [y,m,d]=iso.split('-').map(Number);const w=new Date(y,m-1,d).getDay();return addDays(iso,-((w+1)%7))};
function habitWeek(h){const ws=weekStart(today());let done=0,sum=0;for(let i=0;i<=diffDays(today(),ws);i++){const a=getAns(h.id,addDays(ws,i));if(a==='yes')done++;else if(h.type==='number'&&a&&a!=='skip'&&a!=='no')sum+=Number(a)||0}return h.type==='number'?sum:done}
function habitStreak(h){let n=0;for(let i=1;i<=400;i++){const a=getAns(h.id,addDays(today(),-i));if(a==='yes'||(h.type!=='yesno'&&a&&a!=='skip'&&a!=='no'))n++;else break}return n}
function sleepAvg(h,days=14){const v=[];for(let i=1;i<=days;i++){const a=getAns(h.id,addDays(today(),-i));if(a&&a.startsWith('{')){try{const o=JSON.parse(a);const t=x=>{const [H,M]=x.split(':').map(Number);return H*60+M};let b=t(o.bed),w=t(o.wake);if(b<w)b+=0;let dur=w-b;if(dur<=0)dur+=1440;v.push({b:t(o.bed)<720?t(o.bed)+1440:t(o.bed),w,dur})}catch(_){}}}
  if(!v.length)return null;const av=k=>v.reduce((a,x)=>a+x[k],0)/v.length;const hm=m=>{m=Math.round(m)%1440;return fa(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'))};return{bed:hm(av('b')),wake:hm(av('w')),dur:fa(Math.round(av('dur')/6)/10).replace('.','٫'),n:v.length}}
function habitsStrip(){const hs=activeHabits();if(!hs.length)return'';const q=ciQueue();
  return block('عادت‌ها',null,`<div class="list">${hs.map(h=>{const miss=missingDays(h).length;let right='';
    if(h.type==='sleep'){const a=sleepAvg(h,7);right=a?`<b>${a.dur} ساعت</b><div class="sub">میانگین ۷ شب</div>`:''}
    else{const w=habitWeek(h);right=`<b>${fa(w)}${h.target?' از '+fa(h.target):''}</b><div class="sub">این هفته</div>`}
    const st=habitStreak(h);
    return `<button class="row" data-act="editHabit" data-id="${h.id}">${badge(h.area||'personal',h.icon||'personal')}<div class="main"><div class="ttl">${esc(h.name)}</div><div class="sub">${h.pausedUntil&&today()<=h.pausedUntil?`<span class="pill">مکث تا ${jNice(h.pausedUntil)}</span>`:miss?`<span class="pill bad">${fa(miss)} روز بی‌جواب</span>`:'<span class="pill ok">به‌روز</span>'}${h.lite?'<span class="pill">کم‌پرسش</span>':''}${schedShort(h)?`<span class="pill">${esc(schedShort(h))}</span>`:''}${h.sched&&h.sched!=='all'&&onDay(h,today())?'<span class="pill acc">امروز نوبتشه</span>':''}${st>1?`<span>${fa(st)} روز پشت‌سرهم</span>`:''}</div></div><div class="end">${right}</div></button>`}).join('')}</div>`,q.length?`<button class="link" data-act="checkin">چک‌این (${fa(q.length)})</button>`:'')}
function habitsReport(){const hs=S.habits;if(!hs.length)return'';
  return `<div class="blk-h" style="margin-top:16px"><h2>عادت‌ها (۴ هفتهٔ اخیر)</h2></div><div class="list">${hs.map(h=>{let t='';
    if(h.type==='sleep'){const a=sleepAvg(h,28);t=a?`خواب ${a.bed} · بیداری ${a.wake} · ${a.dur} ساعت (${fa(a.n)} شب ثبت‌شده)`:'ثبت نشده'}
    else{const wk=[0,1,2,3].map(k=>{const ws=addDays(weekStart(today()),-7*k);let c=0;for(let i=0;i<7;i++){const a=getAns(h.id,addDays(ws,i));if(a==='yes')c++;else if(h.type==='number'&&a&&!['skip','no'].includes(a))c+=Number(a)||0}return c}).reverse();t=wk.map((c,i)=>`هفتهٔ ${['−۳','−۲','−۱','جاری'][i]}: ${fa(c)}${h.target?'/'+fa(h.target):''}`).join(' · ')}
    return `<div class="row">${badge(h.area||'personal',h.icon||'personal')}<div class="main"><div class="ttl">${esc(h.name)}</div><div class="sub"><span>${t}</span></div></div></div>`}).join('')}</div>`}
function habitsSheet(){openSheet(`<h3>عادت‌ها و چک‌این</h3><p style="font-size:13.5px;margin:0 0 10px">هر عادت یک سؤال دارد که تا جواب نگیرد، با هر بار باز شدن برنامه پرسیده می‌شود (حداکثر ۷ روز گذشته). «ول کن» همان روز را رها می‌کند؛ «دیگه نپرس» عادت را خاموش می‌کند.</p>
  ${listOr(S.habits.slice().sort((a,b)=>(a.active===false)-(b.active===false)),h=>`<button class="row ${h.active===false?'done':''}" data-act="editHabit" data-id="${h.id}">${badge(h.area||'personal',h.icon||'personal')}<div class="main"><div class="ttl">${esc(h.name)}</div><div class="sub"><span>${esc(h.q)}</span>${h.active===false?'<span class="pill">خاموش</span>':''}</div></div></button>`,'عادتی تعریف نشده.')}
  <div class="acts" style="margin-top:12px"><button class="btn pri" data-act="newHabit">عادت جدید</button><button class="btn" data-act="checkin">چک‌این الان</button><button class="btn ghost" data-act="close">بستن</button></div>`)}
function formHabit(h={}){openSheet(`<h3>${h.id?'ویرایش عادت':'عادت جدید'}</h3><form data-form="habit" data-id="${h.id||''}">
  <div class="fld"><label for="f_hn">نام</label><input id="f_hn" value="${esc(h.name)}" placeholder="مثلاً ورزش"></div>

   <div id="hsWd" class="chips wrap" style="margin-top:6px" ${h.sched==='custom'?'':'hidden'}>${[6,0,1,2,3,4,5].map(w=>`<button type="button" class="chip" data-act="toggleChip" data-wd="${w}" aria-pressed="${(h.wd||[]).includes(w)}">${WD[w]}</button>`).join('')}</div>
   <div class="hint" style="font-size:12px;color:var(--muted)">فقط دربارهٔ همین روزها پرسیده می‌شود؛ روز نوبت در «امروز» علامت می‌خورد.</div></div>
  <div class="row2">${areaSelect('f_area',h.area||'personal')}<div class="fld"><label for="f_hi">آیکون</label><select id="f_hi">${Object.entries(HICONS).map(([k,v])=>opt(k,v,h.icon||'personal')).join('')}</select></div></div>

  <div class="fld"><label for="f_it">متن (قابل ویرایش)</label><textarea id="f_it">${esc(i.text)}</textarea></div>

const ledOfMove=m=>S.ledger.find(l=>!l.void&&(l.kind==='received'||l.kind==='receivable')&&(l.moveId===m.id||(!l.moveId&&!l.docId&&(l.personId||'')===(m.personId||'')&&l.date===m.date&&Math.abs(Number(l.amount)-Number(m.qty)*Number(m.price))<1)));
const lotOfAbout=t=>{const m=String(t||'').match(/\(([^()]+)\)\s*$/);return m?S.lots.find(l=>!l.void&&(l.code||'')===m[1].trim()):null};
const moveOfLed=l=>{if(l.docId||l.ref||!(l.kind==='received'||l.kind==='receivable'))return null;const M=S.moves.filter(m=>!m.void&&m.kind==='sale'&&!m.docId);let m=M.find(m=>l.moveId===m.id||(!l.moveId&&(m.personId||'')===(l.personId||'')&&m.date===l.date&&Math.abs(Number(m.qty)*Number(m.price)-Number(l.amount))<1));if(m)return m;
  const lo=lotOfAbout(l.about);if(!lo)return null;const C=M.filter(x=>x.lotId===lo.id&&Math.abs(diffDays(x.date||l.date,l.date))<=3&&(!x.personId||!l.personId||x.personId===l.personId)).sort((a,b)=>Math.abs(Number(a.qty)*Number(a.price)-Number(l.amount))-Math.abs(Number(b.qty)*Number(b.price)-Number(l.amount)));return C[0]||null};
function editRoute(kind,id,ctx){
  if(kind==='doc'){const d=byId('docs',id);if(!d)return;if(d.type==='count')return viewCount(id);if(d.posted&&!d.void&&INVT.includes(d.type)){const {id:_i,posted:_p,void:_v,created:_c,updated:_u,...cp}=d;return formDoc({...cp,inv:d.inv,redoOf:id})}return formDoc(d)}
  if(kind==='ledger'){const l=byId('ledger',id);if(!l)return;const dd=l.docId&&byId('docs',l.docId);if(dd&&!dd.void)return editRoute('doc',dd.id);if(l.ref)return formRef({...l.ref,disp:(refLines(l.ref.id).find(x=>!x.void&&x.kind==='receivable')||l).personId,date:l.date,editOf:l.ref.id});const m=moveOfLed(l);if(m)return editRoute('move',m.id,{led:l});
    const lo=lotOfAbout(l.about);if(on('docs')&&lo&&(l.kind==='received'||l.kind==='receivable')){const q=Number((String(l.about).match(/([\d۰-۹.٫]+)\s*(کیلو|عدد|گرم|قوطی)/)||[])[1]?num(String(l.about).match(/([\d۰-۹.٫]+)\s*(کیلو|عدد|گرم|قوطی)/)[1]):0)||1;
      return formDoc({type:'invoice',inv:false,personId:l.personId||'',date:l.date,led:l.kind,acct:l.acct||'',items:[{desc:lotName(lo),qty:q,unit:lo.unit,price:Math.round(Number(l.amount)/q),src:'lot',lotId:lo.id}],legacy:'|'+l.id,noStock:1})}
    return formLedgerEdit(l)}
  if(kind==='move'){const m=byId('moves',id);if(!m)return;if(m.kind==='pack')return toast('بسته‌بندی را باطل کن و دوباره ثبت کن');const dd=m.docId&&byId('docs',m.docId);if(dd&&!dd.void)return editRoute('doc',dd.id);
    if(on('docs')&&(m.kind==='sale'||isGive(m.kind))){const l=byId('lots',m.lotId);const L=(ctx&&ctx.led)||(m.kind==='sale'?ledOfMove(m):null);return formDoc({type:'invoice',inv:false,personId:m.personId||(L&&L.personId)||'',toName:m.toName||'',date:m.date,via:m.via||'',led:m.kind==='sale'?(L?(L.kind==='receivable'?'receivable':L.instrument&&L.instrument.startsWith('تهاتر')?'barter':'received'):'none'):m.kind,acct:L&&L.acct||'',items:[{desc:l?lotName(l):'',qty:m.qty,unit:l?l.unit:'کیلو',price:m.price||0,src:'lot',lotId:m.lotId}],legacy:m.id+'|'+(L?L.id:'')})}
    return formMoveEdit(m)}}
function formMoveEdit(m){if(!m)return;const l=byId('lots',m.lotId);const locked=m.kind==='sale'&&Number(m.price)>0;m.locked=locked;
  openSheet(`<h3>ویرایش ${esc((MOVE[m.kind]||{}).n||'')}</h3><form data-form="moveEdit" data-id="${m.id}">

  v.addEventListener('touchmove',e=>{if(!ok)return;const p=e.touches[0];const dx=p.clientX-x0,dy=p.clientY-y0;if(!dir){if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.4)dir=1;else if(Math.abs(dy)>14)dir=-1}if(dir===1){v.style.transition='none';v.style.transform=`translateX(${dx*.55}px)`;v.style.opacity=String(1-Math.min(.45,Math.abs(dx)/700))}},{passive:true});
  v.addEventListener('touchend',e=>{if(!ok||dir!==1)return;const dx=e.changedTouches[0].clientX-x0;const o=order();const i=o.indexOf(tab==='deals'||tab==='stock'?'biz':tab);const j=dx>0?i+1:i-1;
    if(Math.abs(dx)<55||i<0||j<0||j>=o.length)return reset();v.style.transition='none';goTab(o[j]);v.style.transform=`translateX(${dx>0?-36:36}px)`;v.style.opacity='.55';requestAnimationFrame(()=>requestAnimationFrame(reset))},{passive:true});
  v.addEventListener('touchcancel',()=>{if(dir===1)reset()},{passive:true})})();
document.getElementById('fab').addEventListener('click',()=>tab==='money'?moneyAdd():quickAdd());
document.getElementById('btnSearch').addEventListener('click',searchSheet);
document.getElementById('btnMenu').addEventListener('click',menuSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('sheetRoot').hidden)closeSheet()});

render();initDb().then(()=>setTimeout(()=>openCheckin(false),900));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mode)setTimeout(()=>openCheckin(false),400)});
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
