# Runs the full test suite (synthetic data, local server, headless Chromium) on every pull request and push to main.
# Development only: nothing here is part of the app or its deployment (GitHub Pages serves the branch as before).
name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support ubuntu-latest (26.04) yet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm i -g playwright@1.56.0
          npx -y playwright@1.56.0 install --with-deps chromium
      - name: Full suite
        run: NODE_PATH="$(npm root -g)" sh tests/run.sh
